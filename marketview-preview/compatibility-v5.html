<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>TAC MarketView｜相容性測試 v5</title>
<style>
:root{color-scheme:dark;--bg:#10141d;--panel:#171e2a;--line:#2a3444;--muted:#9aa7b8;--gold:#d5ad58;--fg:#f4f6fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 15px 13px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--gold);font-weight:700}h1{font-size:22px;margin:7px 0 4px}.sub{font-size:12px;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:12px}.intro{font-size:12px;color:var(--muted);line-height:1.6;margin:4px 2px 14px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.cardhead{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-weight:700}.ticker{font-size:11px;color:var(--gold)}.chart{height:440px;background:#000}.tradingview-widget-container,.tradingview-widget-container__widget{width:100%;height:100%}
@media(min-width:850px){.grid{grid-template-columns:1fr 1fr}.chart{height:460px}}
</style></head><body>
<header><div class="eyebrow">TAC · INVESTMENT RESEARCH</div><h1>MarketView｜相容性測試</h1><div class="sub">四個指數獨立圖表｜統一 5 分鐘週期</div></header>
<main>
<p class="intro">本頁將四個商品分開載入，避免切換狀態或舊圖表快取干擾判斷。每張圖表均設定 Asia/Taipei、5m。這是內部研究測試，不連接或修改 TAC 正式首頁、母版及工作規則。</p>
<div class="grid" id="charts"></div>
</main>
<script>
const items=[
 {name:"S&P 500",symbol:"FOREXCOM:SPXUSD"},
 {name:"NASDAQ 100",symbol:"FOREXCOM:NSXUSD"},
 {name:"道瓊工業指數",symbol:"FOREXCOM:DJI"},
 {name:"費城半導體指數",symbol:"NASDAQ:SOX"}
];
const root=document.getElementById('charts');
for(const item of items){
 const card=document.createElement('section');card.className='card';
 const head=document.createElement('div');head.className='cardhead';
 const name=document.createElement('span');name.className='name';name.textContent=item.name;
 const ticker=document.createElement('span');ticker.className='ticker';ticker.textContent=item.symbol+' · 5m';
 head.append(name,ticker);
 const box=document.createElement('div');box.className='chart';
 const wrap=document.createElement('div');wrap.className='tradingview-widget-container';wrap.style.cssText='height:100%;width:100%';
 const inner=document.createElement('div');inner.className='tradingview-widget-container__widget';inner.style.cssText='height:calc(100% - 30px);width:100%';
 const credit=document.createElement('div');credit.style.cssText='height:30px;text-align:center;font:12px Arial,sans-serif;color:#9aa7b8';credit.textContent='Chart by TradingView';
 const script=document.createElement('script');script.type='text/javascript';script.async=true;script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
 script.textContent=JSON.stringify({autosize:true,symbol:item.symbol,interval:"5",timezone:"Asia/Taipei",theme:"dark",style:"1",locale:"zh_TW",allow_symbol_change:true,calendar:false,hide_side_toolbar:false,hide_top_toolbar:false,hide_legend:false,hide_volume:false,save_image:false,support_host:"https://www.tradingview.com"});
 wrap.append(inner,credit,script);box.append(wrap);card.append(head,box);root.append(card);
}
</script></body></html>
