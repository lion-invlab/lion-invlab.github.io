<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q4 精選基金｜基金篩選測試｜TAC 投資早報</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#17191d;--muted:#737981;--line:#e1e4e8;--red:#c62828;--green:#16834c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}.logo{font-size:27px;font-weight:950}.logo i{font-style:normal;color:var(--red)}
.wrap{max-width:1200px;margin:auto;padding:18px 14px 42px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px #00000008}
h1{font-size:22px;margin:0 0 5px}.sub{font-size:11px;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:850;margin-bottom:5px}.picker{min-height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 34px 10px 11px;font-weight:800;font-size:13px;position:relative;cursor:pointer}.picker:after{content:"⌄";position:absolute;right:10px;top:7px;font-size:22px}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:8px;height:38px;padding:0 14px;font-weight:900;cursor:pointer}.clear{background:#eee}.count{margin-left:auto;align-self:center;font-size:12px;color:var(--muted);font-weight:850}
.table-wrap{overflow:auto;margin-top:14px}table{width:100%;min-width:1080px;border-collapse:collapse;font-size:11px}th{background:#fafafa;color:var(--muted);font-size:10px;text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 7px;border-bottom:1px solid #eee;vertical-align:top}.code,.isin{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}.dist{font-weight:900;color:var(--green)}a{color:#1769aa;text-decoration:none;font-weight:800}
.cards{display:none}
.modal{display:none;position:fixed;inset:0;background:#0005;z-index:30;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.panel{width:min(520px,100%);max-height:84vh;overflow:auto;background:#fff;border-radius:22px;padding:16px;box-shadow:0 20px 60px #0004}.panel-head{position:sticky;top:-16px;background:#fff;padding:4px 0 11px;border-bottom:1px solid var(--line);z-index:2}.allrow{display:flex;align-items:center;gap:10px;padding:8px 3px;font-weight:900;font-size:17px}.allrow input,.opt input{width:21px;height:21px;accent-color:var(--red)}.selcount{margin-left:auto;color:var(--muted);font-size:11px}.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #eee;font-size:15px;line-height:1.35}.modal-actions{position:sticky;bottom:-16px;background:#fff;padding-top:11px;display:flex;gap:8px}.modal-actions button{height:42px;border:0;border-radius:8px;font-weight:900;padding:0 16px}.m-cancel{background:#eee}.m-ok{background:var(--red);color:#fff;flex:1}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.cards{display:grid;gap:9px;margin-top:14px}.fundcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.fundname{font-weight:900;font-size:14px;line-height:1.35}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:11px}.meta b{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}.table-wrap{display:none}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:13px 12px 32px}h1{font-size:20px}.picker{font-size:13px}.panel{border-radius:20px;padding:14px}.opt{font-size:15px}}
</style></head><body>
<header class="top"><div class="logo"><i>TAC</i> 投資早報</div></header>
<main class="wrap">
<section class="card"><h1>精選基金代號＆配息速查｜篩選測試版</h1><div class="sub">本測試頁不另建資料庫：開啟時會直接讀取正式 <b>fund-detail-v2.html</b> 內目前的基金級別資料，因此測試結果與現有基金資料同步。</div>
<div id="filters" class="grid"></div><div class="actions"><button class="btn clear" id="clearBtn">↺ 清除全部篩選</button><span id="count" class="count">載入中…</span></div>
<div id="table" class="table-wrap"></div><div id="cards" class="cards"></div></section></main>
<div id="modal" class="modal"><div class="panel"><div class="panel-head"><div class="allrow"><input id="all" type="checkbox"><span id="allLabel">全選</span><span id="selCount" class="selcount"></span></div></div><div id="opts"></div><div class="modal-actions"><button class="m-cancel" id="mCancel">取消</button><button class="m-ok" id="mOk">套用</button></div></div></div>
<script>
const SOURCE="fund-detail-v2.html";
let rows=[],mains=[],friendly={},active={},pending=[];
const labels={main:"主基金（15檔）",type:"基金類型",risk:"風險等級",currency:"計價幣別",code:"基金代號",channel:"境內外／前後收",dist:"是否配息"};
const keys=["main","type","risk","currency","code","channel","dist"];
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
async function loadDB(){
 const text=await fetch(SOURCE,{cache:"no-store"}).then(r=>r.text());
 const a=text.match(/const rows=(\[.*?\]),mains=(\[.*?\]),friendly=/s);
 const b=text.match(/friendly=(\{.*?\});let current=/s);
 if(!a||!b)throw new Error("找不到正式基金資料");
 rows=Function("return "+a[1])();mains=Function("return "+a[2])();friendly=Function("return "+b[1])();
 active={main:[...mains]};
 renderFilters();apply();
}
function unique(key){
 if(key==="main")return mains;
 const idx={type:0,main:1,grade:2,currency:3,code:4,channel:5,risk:6,dist:7};
 const source=rows.filter(r=>active.main?.length?active.main.includes(r[1]):true);
 if(key==="type")return [...new Set(source.map(r=>r[idx.type]))].filter(Boolean).sort();
 if(key==="risk")return [...new Set(source.map(r=>r[idx.risk]))].filter(Boolean).sort((a,b)=>Number(a)-Number(b)).map(x=>"RR"+x);
 if(key==="currency")return [...new Set(source.map(r=>r[idx.currency]))].filter(Boolean).sort();
 if(key==="code")return [...new Set(source.map(r=>r[idx.code]))].filter(Boolean).sort();
 if(key==="channel")return [...new Set(source.map(r=>r[idx.channel]))].filter(Boolean).sort();
 if(key==="dist")return [...new Set(source.map(r=>r[idx.dist]))].filter(Boolean).sort();
}
function makePicker(key){
 const vals=unique(key);const div=document.createElement("div");div.className="field";
 div.innerHTML='<label>'+labels[key]+'</label><div class="picker" data-key="'+key+'"></div>';
 div.querySelector(".picker").textContent=summary(key);
 div.querySelector(".picker").onclick=()=>openPicker(key);return div;
}
function summary(key){const s=active[key]||[];const all=unique(key);if(!s.length||s.length===all.length)return "全部（全選）";return "已選 "+s.length+" 項";}
function renderFilters(){$("filters").innerHTML="";keys.forEach(k=>$("filters").appendChild(makePicker(k)));}
function openPicker(key){
 const vals=unique(key);pending=[...(active[key]||[])];$("opts").innerHTML=vals.map((v,i)=>'<label class="opt"><input type="checkbox" data-i="'+i+'"><span>'+esc(v==="RR"+v.replace("RR","")?v:v)+'</span></label>').join("");
 $("opts").querySelectorAll("input").forEach(x=>x.checked=pending.includes(vals[+x.dataset.i]));
 $("allLabel").textContent=pending.length===vals.length?"取消全選":"全選";$("all").checked=pending.length===vals.length;$("selCount").textContent="已選 "+pending.length+"／"+vals.length;
 $("all").onclick=()=>{const all=pending.length===vals.length;pending=all?[]:[...vals];$("opts").querySelectorAll("input").forEach(x=>x.checked=!all);syncModal(vals,key)};
 $("opts").onchange=()=>{pending=[...$("opts").querySelectorAll("input:checked")].map(x=>vals[+x.dataset.i]);syncModal(vals,key)};
 $("mCancel").onclick=()=>closePicker();$("mOk").onclick=()=>{active[key]=[...pending];closePicker();renderFilters();apply();};
 $("modal").classList.add("show");document.body.style.overflow="hidden";
}
function syncModal(vals,key){$("all").checked=pending.length===vals.length;$("allLabel").textContent=pending.length===vals.length?"取消全選":"全選";$("selCount").textContent="已選 "+pending.length+"／"+vals.length;}
function closePicker(){$("modal").classList.remove("show");document.body.style.overflow="";}
$("modal").onclick=e=>{if(e.target===$("modal"))closePicker()};
$("clearBtn").onclick=()=>{active={main:[...mains]};renderFilters();apply();};
function apply(){
 const src=rows.filter(r=>(!active.main?.length||active.main.includes(r[1]))&&(!active.type?.length||active.type.includes(r[0]))&&(!active.risk?.length||active.risk.includes("RR"+r[6]))&&(!active.currency?.length||active.currency.includes(r[3]))&&(!active.code?.length||active.code.includes(r[4]))&&(!active.channel?.length||active.channel.includes(r[5]))&&(!active.dist?.length||active.dist.includes(r[7])));
 $("count").textContent=src.length+" 個基金級別";
 const html=src.map(r=>'<tr><td>'+esc(r[0])+'</td><td><b>'+esc(friendly[r[1]]||r[1])+'</b></td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td class="code">'+esc(r[4])+'</td><td>'+esc(r[5])+'</td><td>RR'+esc(r[6])+'</td><td class="dist">'+esc(r[7])+'</td><td>'+esc(r[8]||"—")+'</td><td>'+(r[9]?'<a target="_blank" href="'+esc(r[9])+'">查看</a>':"—")+'</td><td class="isin">'+esc(r[10])+'</td></tr>').join("");
 $("table").innerHTML='<table><thead><tr><th>基金類型</th><th>主基金</th><th>基金級別</th><th>計價幣別</th><th>基金代號</th><th>境內外／前後收</th><th>風險等級</th><th>是否配息</th><th>年化配息率</th><th>MoneyDJ</th><th>ISIN</th></tr></thead><tbody>'+html+'</tbody></table>';
 $("cards").innerHTML=src.map(r=>'<article class="fundcard"><div class="fundname">'+esc(r[2])+'</div><div class="meta"><div><b>主基金</b>'+esc(friendly[r[1]]||r[1])+'</div><div><b>基金代號</b>'+esc(r[4])+'</div><div><b>基金類型</b>'+esc(r[0])+'</div><div><b>風險</b>RR'+esc(r[6])+'</div><div><b>計價幣別</b>'+esc(r[3])+'</div><div><b>境內外／前後收</b>'+esc(r[5])+'</div><div><b>是否配息</b>'+esc(r[7])+'</div><div><b>年化配息率</b>'+esc(r[8]||"—")+'</div></div>'+(r[9]?'<div style="margin-top:8px"><a target="_blank" href="'+esc(r[9])+'">查看 MoneyDJ 配息頁面 →</a></div>':"")+'</article>').join("");
}
loadDB().catch(e=>{$("count").textContent="資料載入失敗";$("table").innerHTML='<div style="color:#c62828;font-weight:900;padding:12px">無法讀取正式基金資料：'+esc(e.message)+'</div>';});
</script></body></html>
