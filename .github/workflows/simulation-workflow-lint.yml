name: TAC simulation workflow YAML lint
on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - ".github/workflows/tac-simulation-lab.yml"
      - ".github/workflows/simulation-workflow-lint.yml"
      - "simulation-lab/**"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout simulation branch
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse TAC simulation workflow YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          path = Path(".github/workflows/tac-simulation-lab.yml")
          doc = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          assert isinstance(doc, dict)
          assert "jobs" in doc and doc["jobs"]
          print("YAML parse PASS; jobs:", list(doc["jobs"]))
          PY
      - name: Enforce GitHub run-command size limit
        run: python simulation-lab/runner/test_workflow_run_command_limits.py
      - name: Run actionlint against TAC simulation workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/tac-simulation-lab.yml
