name: Free FedWatch Calculation Probe

on:
  push:
    branches:
      - test/cme-fedwatch-probe
    paths:
      - ".github/workflows/fedwatch-free-probe.yml"
      - "scripts/cme-fedwatch/free_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedwatch-free-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free FedWatch calculator
        continue-on-error: true
        run: python -m pip install cme-fedwatch
      - name: Inspect CME public settlement CSV fallback
        continue-on-error: true
        run: |
          mkdir -p artifacts
          url="https://www.cmegroup.com/ftp/pub/pub/settle/TCF/TCF_20261014.csv"
          code=$(curl --http1.1 -L --max-time 25 -sS -o artifacts/tcf-20261014.csv -w "%{http_code}" "$url" 2> artifacts/tcf-curl-stderr.txt || true)
          echo "csv_http_code=$code"
          cat artifacts/tcf-curl-stderr.txt
          if [ -f artifacts/tcf-20261014.csv ]; then
            echo "csv_bytes=$(wc -c < artifacts/tcf-20261014.csv)"
            head -n 8 artifacts/tcf-20261014.csv
            echo "--- keyword matches ---"
            grep -i -E "fed.?fund|federal funds|ZQ|30.?day" artifacts/tcf-20261014.csv | head -n 15 || true
          fi
      - name: Probe free public-settlement calculation
        continue-on-error: true
        run: python scripts/cme-fedwatch/free_probe.py
      - name: Upload free-probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedwatch-free-probe
          path: artifacts/cme-fedwatch-free-probe.json
          if-no-files-found: warn
          retention-days: 14
