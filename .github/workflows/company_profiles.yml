name: Update S&P 500 Company Profiles

on:
  workflow_dispatch:
  schedule:
    # Every Sunday 05:40 Taiwan time (Saturday 21:40 UTC)
    - cron: "40 21 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Update company profiles
        run: |
          python scripts/update_profiles.py

      - name: Validate company profile data
        run: |
          python scripts/validate_profiles.py

      - name: Commit updated company data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company_profiles.json
          git diff --cached --quiet || git commit -m "Update S&P 500 company profiles"
          git push
