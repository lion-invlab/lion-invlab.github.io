name: TAC Chart 3 merge verified S&P 500 daily increments

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAC main-native production pipeline"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tac-chart3-data-maintenance
  cancel-in-progress: false

jobs:
  resolve-main-run:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Checkout Main for exact Run lookup
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Resolve production Run that completed this workflow
        id: resolve
        env:
          PRODUCTION_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCTION_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def out(should_run, run_id=""):
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
                  f.write(f"should_run={str(should_run).lower()}\n")
                  f.write(f"run_id={run_id}\n")
          if os.environ.get("PRODUCTION_HEAD_BRANCH") != "main":
              out(False); raise SystemExit(0)
          workflow_run_id=str(os.environ["PRODUCTION_WORKFLOW_RUN_ID"])
          matches=[]
          for p in Path("production/runs").glob("TAC-*/run-context.json"):
              context=json.loads(p.read_text(encoding="utf-8"))
              if str(context.get("workflow_run_id")) == workflow_run_id:
                  matches.append(p.parent)
          if len(matches)!=1:
              print(f"No unique Main Run for completed workflow_run_id={workflow_run_id}; Chart 3 branch will be skipped.")
              out(False); raise SystemExit(0)
          run=matches[0]
          state_path=run/"run-state.json"
          if not state_path.is_file():
              out(False); raise SystemExit(0)
          state=json.loads(state_path.read_text(encoding="utf-8"))
          stages=state.get("stages",{})
          stage2=stages.get("STAGE_2",{}).get("status")
          stage3=stages.get("STAGE_3",{}).get("status")
          if state.get("run_id")!=run.name or stage2 not in ("PASS","PARTIAL") or stage3!="PASS":
              print(f"Run {run.name} did not complete Stage 2/3; Chart 3 branch will be skipped.")
              out(False); raise SystemExit(0)
          if not (run/"stage2-market-snapshot-receipt.json").is_file() or not (run/"stage3-calendar-receipt.json").is_file():
              out(False); raise SystemExit(0)
          print(f"Chart 3 handoff accepted for exact Main Run {run.name} (Stage2={stage2}, Stage3=PASS).")
          out(True,run.name)
          PY
  merge-and-commit:
    needs: [resolve-main-run]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.resolve-main-run.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check for pending S&P 500 increment ledger
        id: ledger
        run: |
          if [ -s data/tac-chart3/sp500_daily_increment.jsonl ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.ledger.outputs.pending == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test S&P 500 increment merge invariants
        if: steps.ledger.outputs.pending == 'true'
        run: |
          python .github/scripts/test_append_tac_sp500_daily_increment.py
          python .github/scripts/test_merge_tac_sp500_daily_increment.py
      - name: Merge verified daily increments and rebuild compact histories
        if: steps.ledger.outputs.pending == 'true'
        run: |
          python .github/scripts/merge_tac_sp500_daily_increment.py \
            --data-dir data/tac-chart3 \
            --builder .github/scripts/build_sp500_daily_compact.py
      - name: Verify compact snapshots and manifest alignment
        if: steps.ledger.outputs.pending == 'true'
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          data = Path("data/tac-chart3")
          recent = json.loads((data / "sp500_daily_close_1993-2026.compact.json").read_text())
          full = json.loads((data / "sp500_daily_close_1927-2026.compact.json").read_text())
          manifest = json.loads((data / "manifest.json").read_text())
          sp = manifest["sp500_data"]
          assert recent["start"] == "1993-12-31", recent["start"]
          assert full["start"] == "1927-12-30", full["start"]
          assert recent["end"] == full["end"], (recent["end"], full["end"])
          assert recent["rows"] <= full["rows"], (recent["rows"], full["rows"])
          assert full["rows"] >= 24000, full["rows"]
          assert sp["end"] == full["end"]
          assert sp["rows"] == full["rows"]
          assert sp["dataset_sha256"] == full["source_dataset_sha256"]
          assert sp["git_blob_sha1"] == hashlib.sha1(
              b"blob " + str((data / "sp500_daily_close_1927-2026.compact.json").stat().st_size).encode() + b"\0" +
              (data / "sp500_daily_close_1927-2026.compact.json").read_bytes()
          ).hexdigest()
          print("S&P 500 compact snapshots and manifest are aligned.")
          PY
      - name: Commit merged Chart 3 S&P 500 data
        if: steps.ledger.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tac-chart3/sp500_daily_close_1993-2026.compact.json data/tac-chart3/sp500_daily_close_1927-2026.compact.json data/tac-chart3/manifest.json
          if git diff --cached --quiet; then
            echo "No S&P 500 compact data changes."
          else
            git commit -m "data(chart3): merge verified S&P 500 daily increments"
            git push origin HEAD:main
          fi
