name: CME FedWatch Isolated Probe

on:
  push:
    branches:
      - test/cme-fedwatch-probe
    paths:
      - ".github/workflows/cme-fedwatch-probe.yml"
      - "scripts/cme-fedwatch/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cme-fedwatch-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free FedWatch calculator
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install cme-fedwatch
      - name: Probe free public-settlement calculation
        continue-on-error: true
        run: python scripts/cme-fedwatch/free_probe.py
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Diagnose CME HTTP connectivity (HTTP/1.1)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set +e
          curl --http1.1 -L --max-time 35 --retry 1 --retry-delay 2 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36" -D artifacts/cme-http-headers.txt -o artifacts/cme-http-body.html -w "http_code=%{http_code}\nremote_ip=%{remote_ip}\ntime_total=%{time_total}\nurl_effective=%{url_effective}\n" "https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html" > artifacts/cme-curl-summary.txt 2> artifacts/cme-curl-stderr.txt
          curl_status=$?
          echo "curl_exit_code=$curl_status" >> artifacts/cme-curl-summary.txt
          head -c 1000 artifacts/cme-http-body.html > artifacts/cme-http-body-preview.txt 2>/dev/null || true
          cat artifacts/cme-curl-summary.txt
          cat artifacts/cme-curl-stderr.txt
      - name: Probe CME FedWatch page
        continue-on-error: true
        run: node scripts/cme-fedwatch/probe.mjs
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cme-fedwatch-probe
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
