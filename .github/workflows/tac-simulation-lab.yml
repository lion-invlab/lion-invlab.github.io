name: TAC isolated simulation lab

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - "simulation-lab/**"
      - "!simulation-lab/runs/**"
      - "!simulation-lab/output/**"
      - ".github/workflows/tac-simulation-lab.yml"
      - ".github/workflows/tac-key-levels-live.yml"

permissions:
  contents: write

concurrency:
  group: tac-simulation-lab-focus-tabs-20261107
  cancel-in-progress: true

jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout simulation branch only
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema beautifulsoup4 pandas yfinance pandas-market-calendars

      - name: Run deterministic self-tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tac_wr_lock.py --self-test
          python scripts/validate_tac_daily_snapshot.py --self-test
          python simulation-lab/runner/calendar_source_guard.py --self-test
          python scripts/assemble_tac_daily_snapshot.py --self-test
          python scripts/render_tac_market_snapshot_to_html.py --help >/dev/null
          python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json --data simulation-lab/fixtures/report-data-2026-11-09.json --report-date 2026-11-09 --self-test
          python simulation-lab/runner/collect_key_levels_ohlc.py --self-test

      - name: Set up Node for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Validate simulation dual mother five-zone layout
        run: python simulation-lab/runner/validate_dual_mothers.py

      - name: Capture verified live OHLC for five US cash indices
        run: |
          python simulation-lab/runner/collect_key_levels_ohlc.py --allow-manual --report-date 2026-11-12 --report-data simulation-lab/fixtures/report-data-2026-11-12.json --output simulation-lab/output/key-levels-live.json

      - name: Assemble actual 2026-11-12 weekday review from verified report data
        run: |
          python simulation-lab/runner/build_review_html.py --data simulation-lab/fixtures/report-data-2026-11-12.json --key-levels-live simulation-lab/output/key-levels-live.json --output simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html --expected-master-sha 6fe79308eca71db5dd54308fd35efe3900451081

      - name: Compare 2026-11-12 review against approved weekday mother
        run: node simulation-lab/runner/visual_regression.mjs simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html weekdays 2026-11-12

      - name: Validate calendar counts and non-comparable EPS display
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          p = Path("simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html")
          soup = BeautifulSoup(p.read_text(encoding="utf-8"), "html.parser")
          econ = soup.select("#calendar .econ-event")
          earnings = soup.select("#earnings .earnings-accordion")
          assert len(econ) == 16, f"expected 16 main economic events, got {len(econ)}"
          assert len(earnings) == 48, f"expected 48 main earnings events, got {len(earnings)}"
          all_text = soup.get_text(" ", strip=True)
          assert "數值高於預期（EPS口徑待核實）" not in all_text
          assert "數值低於預期（EPS口徑待核實）" not in all_text
          on = next((x for x in earnings if "On Holding" in x.get_text(" ", strip=True)), None)
          assert on is not None
          on_text = on.get_text(" ", strip=True)
          for expected in ("CHF 0.48", "US$0.48", "CHF 0.931B", "US$1.140B"):
              assert expected in on_text, f"On Holding currency label missing: {expected}"
          ec = next((x for x in earnings if "Ecopetrol S.A." in x.get_text(" ", strip=True)), None)
          assert ec is not None
          ec_text = ec.get_text(" ", strip=True)
          assert "已延期；改期至" in ec_text, "Ecopetrol postponement status was not rendered"
          assert "即將公布；11/13" not in ec_text, "postponed earnings must not be labelled as simply upcoming"
          print("PASS: main calendar counts; pending EPS comparisons non-directional; CHF/USD split; postponed event status")
          PY



      - name: Keep review output isolated to simulation branch artifact
        run: test -s simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html

      - name: Record isolated run metadata
        if: always()
        shell: bash
        run: |
          mkdir -p simulation-lab/output
          {
            echo "branch=simulation/tac-process-lab-2026-11-06"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "main_write_scope=read-only; simulation branch artifact only"
            echo "production_deploy=forbidden"
          } > simulation-lab/output/runner-metadata.txt

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-simulation-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-lab/output/
          if-no-files-found: error
          retention-days: 7
