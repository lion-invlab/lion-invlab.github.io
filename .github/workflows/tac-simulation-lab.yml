name: TAC isolated simulation lab

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - "simulation-lab/**"
      - ".github/workflows/tac-simulation-lab.yml"
      - ".github/workflows/tac-key-levels-live.yml"

permissions:
  contents: write

concurrency:
  group: tac-simulation-lab-focus-tabs-20261107
  cancel-in-progress: true

jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout simulation branch only
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema beautifulsoup4 pandas yfinance pandas-market-calendars

      - name: Run deterministic self-tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tac_wr_lock.py --self-test
          python scripts/validate_tac_daily_snapshot.py --self-test
          python scripts/assemble_tac_daily_snapshot.py --self-test
          python scripts/render_tac_market_snapshot_to_html.py --help >/dev/null
          python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json --data simulation-lab/fixtures/report-data-2026-11-09.json --report-date 2026-11-09 --self-test
          python simulation-lab/runner/collect_key_levels_ohlc.py --self-test

      - name: Set up Node for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Validate simulation dual mother five-zone layout
        run: python simulation-lab/runner/validate_dual_mothers.py

      - name: Build 11/09 key levels from normalized source OHLC input
        run: python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json --data simulation-lab/fixtures/report-data-2026-11-09.json --report-date 2026-11-09

      - name: Capture live 11/06 cash-index OHLC for 11/09 key-levels (integration probe)
        run: |
          python simulation-lab/runner/collect_key_levels_ohlc.py --allow-manual --report-date 2026-11-09 --output simulation-lab/output/key-levels-live.json
      - name: Assemble 11/09 Monday simulation review HTML from approved Monday mother
        run: |
          python simulation-lab/runner/build_review_html.py --data simulation-lab/fixtures/report-data-2026-11-09.json --key-levels-live simulation-lab/output/key-levels-live.json --output simulation-lab/output/TAC_投資早報_2026-11-09_審核版.html --expected-master-sha 0169319111f5cd0b7ff6ac3d4546e9ed2d57b0f7

      - name: Compare assembled HTML against approved Monday mother
        run: node simulation-lab/runner/visual_regression.mjs simulation-lab/output/TAC_投資早報_2026-11-09_審核版.html monday 2026-11-09

      - name: Assemble and visually verify Tue-Fri weekday mother (deterministic replay)
        run: |
          set -euo pipefail
          cp simulation-lab/fixtures/report-data-2026-11-09.json simulation-lab/output/report-data-weekday-replay.json
          cp simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json simulation-lab/output/key-levels-weekday-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("report-data-weekday-replay.json", "key-levels-weekday-replay.json"):
              path = Path("simulation-lab/output") / name
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["report_date"] = "2026-11-10"
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/output/key-levels-weekday-replay.json --data simulation-lab/output/report-data-weekday-replay.json --report-date 2026-11-10
          python simulation-lab/runner/build_review_html.py --data simulation-lab/output/report-data-weekday-replay.json --output simulation-lab/output/TAC_投資早報_2026-11-10_週二至週五相容性測試.html --expected-master-sha 6fe79308eca71db5dd54308fd35efe3900451081
          node simulation-lab/runner/visual_regression.mjs simulation-lab/output/TAC_投資早報_2026-11-10_週二至週五相容性測試.html weekdays 2026-11-10

      - name: Assemble actual 2026-11-10 weekday review from verified report data
        run: |
          python simulation-lab/runner/build_review_html.py --data simulation-lab/fixtures/report-data-2026-11-10.json --output simulation-lab/output/TAC_投資早報_2026-11-10_審核版.html --expected-master-sha 6fe79308eca71db5dd54308fd35efe3900451081

      - name: Compare 2026-11-10 review against approved weekday mother
        run: node simulation-lab/runner/visual_regression.mjs simulation-lab/output/TAC_投資早報_2026-11-10_審核版.html weekdays 2026-11-10

      - name: Publish approved review preview to main (preview path only)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s simulation-lab/output/TAC_投資早報_2026-11-10_審核版.html
          mkdir -p main-preview
          git worktree add main-preview origin/main
          install -D simulation-lab/output/TAC_投資早報_2026-11-10_審核版.html main-preview/preview/2026-11-10-simulation.html
          cd main-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- preview/2026-11-10-simulation.html
          if git diff --cached --quiet; then
            echo "Preview already matches; no main commit needed."
          else
            git commit -m "Publish 2026-11-10 TAC simulation review preview"
            git push origin HEAD:main
          fi
          test -s preview/2026-11-10-simulation.html
          git status --short
          echo "Published only preview/2026-11-10-simulation.html"

      - name: Record isolated run metadata
        if: always()
        shell: bash
        run: |
          mkdir -p simulation-lab/output
          {
            echo "branch=simulation/tac-process-lab-2026-11-06"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "main_write_scope=preview/2026-11-10-simulation.html only, after QA pass"
            echo "production_deploy=forbidden"
          } > simulation-lab/output/runner-metadata.txt

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-simulation-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-lab/output/
          if-no-files-found: error
          retention-days: 7
