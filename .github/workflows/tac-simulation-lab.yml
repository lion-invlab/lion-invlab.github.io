name: TAC isolated simulation lab

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - "simulation-lab/**"
      - "schemas/tac-earnings-record-v2.schema.json"
      - "!simulation-lab/runs/**"
      - "!simulation-lab/output/**"
      - "!simulation-lab/analysis/**"
      - ".github/workflows/tac-simulation-lab.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "build：組裝並驗收；qa-only：只驗收既有同日 preview，不抓資料、不重建"
        required: true
        default: build
        type: choice
        options:
          - build
          - qa-only
      report_date:
        description: "台灣報告日期 YYYY-MM-DD；build 可留白使用最新 fixture，qa-only 必填"
        required: false
        type: string
      report_path:
        description: "qa-only 目標；必須是 preview/YYYY-MM-DD-simulation.html"
        required: false
        type: string
      run_optional_probes:
        description: "額外研究來源探測（Equibles／ORTEX／Investing.com）；日常早報預設關閉"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Each push is isolated by commit SHA; a follow-up smoke run must not cancel
  # an explicitly tagged date-matched build/QA run. Manual runs serialize by report date.
  group: tac-simulation-lab-${{ github.event_name == 'workflow_dispatch' && inputs.report_date || github.sha }}
  cancel-in-progress: true

jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout simulation branch only
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check jsonschema beautifulsoup4 pandas yfinance pandas-market-calendars

      - name: Materialize SHA-locked simulation Monday and weekday mothers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simulation-lab/output
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from bs4 import BeautifulSoup
          manifest=json.loads(Path('simulation-lab/baseline/mother-template-manifest.json').read_text(encoding='utf-8'))
          for key, filename in [('monday','monday-mother-template.html'),('weekdays','weekday-mother-template.html')]:
              source=Path('simulation-lab/baseline')/filename
              target=Path('simulation-lab/output')/filename
              target.write_bytes(source.read_bytes())
              raw=target.read_bytes()
              actual=subprocess.check_output(['git','hash-object',str(source)],text=True).strip()
              expected=manifest['templates'][key]['simulation_blob_sha']
              assert actual==expected, f'{key} simulation mother SHA mismatch: {actual} != {expected}'
              soup=BeautifulSoup(raw,'lxml')
              fed=soup.select('#fed .fc-fomc-weekly-events')
              assert len(fed)==1, f'{key} Fed weekly agenda slot missing or duplicated'
              assert len(fed[0].select('.fc-fomc-weekly-events-title'))==1
              assert len(fed[0].select('.fc-fomc-weekly-events-list'))==1
              assert len(fed[0].select('.fc-fomc-weekly-event-template'))==1
              assert len(fed[0].select('.fc-fomc-weekly-events-empty'))==1
              evidence={'path':str(target),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                        'git_blob_sha':actual,'expected_simulation_blob_sha':expected,
                        'official_mother_blob_sha':manifest['templates'][key]['blob_sha'],
                        'parser':'lxml','html_elements':len(soup.find_all(True)),
                        'ids':len([x for x in soup.find_all(id=True)]),
                        'scripts':len(soup.find_all('script')),'styles':len(soup.find_all('style')),
                        'fed_agenda_slot_count':len(fed)}
              print(json.dumps(evidence,ensure_ascii=False))
              Path(f'simulation-lab/output/{key}-mother-transfer-evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          PY

      - name: Probe Equibles analyst estimates API (read-only, simulation only)
        if: false # Latest snapshot probe already completed; avoid spending quota again during history pagination.
        shell: bash
        env:
          EQUIBLES_API_KEY: ${{ secrets.EQUIBLES_API_KEY }}
        run: |
          set -euo pipefail
          python simulation-lab/runner/equibles_analyst_estimates_probe.py

      - name: Probe remaining Equibles historical snapshots (read-only, simulation only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_optional_probes
        shell: bash
        env:
          EQUIBLES_API_KEY: ${{ secrets.EQUIBLES_API_KEY }}
        run: |
          set -euo pipefail
          python simulation-lab/runner/equibles_historical_snapshot_remainder_probe.py

      - name: Probe ORTEX TEST consensus API (read-only, simulation only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_optional_probes
        shell: bash
        run: |
          set -euo pipefail
          python simulation-lab/runner/probe_ortex_test.py --output simulation-lab/output/ortex-test-probe.json

      - name: Test Investing.com earnings page parser
        shell: bash
        run: python simulation-lab/runner/investing_earnings_probe.py --self-test --output /tmp/investing-probe.json --archive-dir /tmp/investing-raw

      - name: Probe Investing.com earnings pages (read-only, simulation only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_optional_probes
        shell: bash
        run: python simulation-lab/runner/investing_earnings_probe.py --output simulation-lab/output/investing-earnings-probe.json --archive-dir simulation-lab/output/investing-raw

      - name: Test append-only PIT consensus snapshot store
        shell: bash
        run: python simulation-lab/runner/test_consensus_snapshot_store.py

      - name: Compile simulation render and validation code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile simulation-lab/runner/build_review_html.py simulation-lab/runner/validate_review_artifact.py simulation-lab/runner/project_w47_yahoo_consensus.py simulation-lab/runner/test_w47_consensus_projection.py simulation-lab/runner/probe_yfinance_estimate_methodology.py simulation-lab/runner/validate_mother_dom_contract.py
          node --check simulation-lab/runner/visual_regression.mjs
          node --check simulation-lab/runner/interaction_smoke.mjs

      - name: Run deterministic self-tests
        shell: bash
        run: |
          set -euo pipefail
          # SIM-1.3 retires WR-lock / daily-snapshot / legacy renderer prerequisites.
          python simulation-lab/runner/calendar_source_guard.py --self-test
          python simulation-lab/runner/collect_earnings_price_reactions.py --self-test
          python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json --data simulation-lab/fixtures/report-data-2026-11-09.json --report-date 2026-11-09 --self-test
          python simulation-lab/runner/collect_key_levels_ohlc.py --self-test
          python simulation-lab/runner/validate_dual_mothers.py
          python simulation-lab/runner/test_fear_greed_marker.py
          python simulation-lab/runner/test_summary_headline.py
          python simulation-lab/runner/test_earnings_comparison_status.py
          python simulation-lab/runner/test_earnings_judgment_engine.py
          python simulation-lab/runner/test_earnings_schema_audit.py
          python simulation-lab/runner/test_earnings_health_dom_preservation.py
          python simulation-lab/runner/test_earnings_card_dom_preservation.py
          python simulation-lab/runner/test_report_layer_earnings_status.py
          python simulation-lab/runner/test_calendar_impact_overrides.py
          python simulation-lab/runner/test_1123_fixture.py
          python simulation-lab/runner/test_quote_type_guard.py
          python simulation-lab/runner/test_builder_calendar_panel_preservation.py
          echo "PASS: calendar panel shell preservation regression guard (frozen prototypes)"
          python simulation-lab/runner/preflight_1123_overrides.py
          python simulation-lab/runner/validate_earnings_v2.py --self-test

      - name: Audit W46 PIT projection (read-only, simulation data only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_optional_probes
        shell: bash
        run: python simulation-lab/runner/audit_simulation_pit_projection.py --report-date 2026-11-16 --output simulation-lab/output/w46-pit-projection-audit.json

      - name: Probe Yahoo EPS methodology metadata (simulation only)
        if: false # skip stale 2026-11-15 methodology capture; current run uses main W47 source records
        shell: bash
        run: |
          set -euo pipefail
          python simulation-lab/runner/probe_yfinance_estimate_methodology.py --capture simulation-lab/output/yahoo-finance-pre-release-capture-20261115.json --output simulation-lab/output/yfinance-methodology-probe.json --tickers BIDU,NVDA,WMT,BEKE,ARMK,TSN,JD,DIS,HD,TGT,LOW,TJX,PANW,P,BABA,NTES,PDD,WSM,ROST,INTU,KEYS

      - name: Audit authoritative main earnings schema (read-only)
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DATE="$(TZ=Asia/Taipei date +%F)"
          python simulation-lab/runner/audit_earnings_schema.py --report-date "${REPORT_DATE}" --output simulation-lab/output/earnings-schema-audit.json --migration-csv simulation-lab/output/earnings-migration-preview.csv

      - name: Resolve report date, fixture, weekday mother and SHA
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        shell: bash
        env:
          INPUT_REPORT_DATE: ${{ github.event.inputs.report_date }}
          INPUT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_REPORT_DATE}" ]]; then
            REPORT_DATE="${INPUT_REPORT_DATE}"
          elif [[ "${INPUT_COMMIT_MESSAGE}" =~ \[build-tac-report:([0-9]{4}-[0-9]{2}-[0-9]{2})\] ]]; then
            REPORT_DATE="${BASH_REMATCH[1]}"
          else
            REPORT_DATE="$(python - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("simulation-lab/fixtures").glob("report-data-????-??-??.json"))
          if not files:
              raise SystemExit("No report-data-YYYY-MM-DD.json fixture exists")
          print(re.search(r"(\d{4}-\d{2}-\d{2})", files[-1].name).group(1))
          PY
          )"
          fi
          python - "${REPORT_DATE}" <<'PY'
          import sys, json
          from datetime import date
          from pathlib import Path
          d = date.fromisoformat(sys.argv[1])
          if d.weekday() > 4:
              raise SystemExit(f"Weekend report date is not allowed: {d}")
          fixture = Path(f"simulation-lab/fixtures/report-data-{d.isoformat()}.json")
          if not fixture.is_file():
              raise SystemExit(f"Missing date-matched fixture: {fixture}; refusing to reuse another date")
          data = json.loads(fixture.read_text(encoding="utf-8"))
          if data.get("report_date") != d.isoformat():
              raise SystemExit(f"Fixture report_date mismatch: {data.get('report_date')!r} != {d}")
          if data.get("timezone") != "Asia/Taipei":
              raise SystemExit("Fixture timezone must be Asia/Taipei")
          PY
          TEMPLATE_KEY="$(python - "${REPORT_DATE}" <<'PY'
          import sys
          from datetime import date
          print("monday" if date.fromisoformat(sys.argv[1]).weekday() == 0 else "weekdays")
          PY
          )"
          if [[ "${TEMPLATE_KEY}" == "weekdays" ]]; then
            MOTHER_FILE="simulation-lab/output/weekday-mother-template.html"
          else
            MOTHER_FILE="simulation-lab/output/monday-mother-template.html"
          fi
          EXPECTED_SHA="$(python - "${TEMPLATE_KEY}" <<'PY'
          import json, sys
          m = json.loads(open("simulation-lab/baseline/mother-template-manifest.json", encoding="utf-8").read())
          print(m["templates"][sys.argv[1]]["simulation_blob_sha"])
          PY
          )"
          echo "REPORT_DATE=${REPORT_DATE}" >> "$GITHUB_ENV"
          echo "REPORT_DATA=simulation-lab/fixtures/report-data-${REPORT_DATE}.json" >> "$GITHUB_ENV"
          echo "TEMPLATE_KEY=${TEMPLATE_KEY}" >> "$GITHUB_ENV"
          echo "MOTHER_FILE=${MOTHER_FILE}" >> "$GITHUB_ENV"
          echo "EXPECTED_MASTER_SHA=${EXPECTED_SHA}" >> "$GITHUB_ENV"
          echo "REPORT_OUTPUT=preview/${REPORT_DATE}-simulation.html" >> "$GITHUB_ENV"
          echo "REPORT_EVIDENCE=preview/${REPORT_DATE}-simulation.qa.json" >> "$GITHUB_ENV"
          echo "Resolved report_date=${REPORT_DATE}; template=${TEMPLATE_KEY}; master_sha=${EXPECTED_SHA}"

      - name: Resolve QA-only existing review target
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'qa-only'
        shell: bash
        env:
          INPUT_REPORT_DATE: ${{ github.event.inputs.report_date }}
          INPUT_REPORT_PATH: ${{ github.event.inputs.report_path }}
        run: |
          set -euo pipefail
          [[ -n "${INPUT_REPORT_DATE}" ]] || { echo "qa-only requires report_date"; exit 1; }
          python - "${INPUT_REPORT_DATE}" <<'PY'
          from datetime import date
          import sys
          d=date.fromisoformat(sys.argv[1])
          if d.weekday()>4: raise SystemExit("Weekend report date is not allowed")
          PY
          REPORT_DATE="${INPUT_REPORT_DATE}"
          EXPECTED_PATH="preview/${REPORT_DATE}-simulation.html"
          REPORT_OUTPUT="${INPUT_REPORT_PATH:-${EXPECTED_PATH}}"
          [[ "${REPORT_OUTPUT}" == "${EXPECTED_PATH}" ]] || { echo "qa-only path must be ${EXPECTED_PATH}"; exit 1; }
          TEMPLATE_KEY="$(python - "${REPORT_DATE}" <<'PY'
          from datetime import date
          import sys
          print("monday" if date.fromisoformat(sys.argv[1]).weekday()==0 else "weekdays")
          PY
          )"
          if [[ "${TEMPLATE_KEY}" == "weekdays" ]]; then
            MOTHER_FILE="simulation-lab/output/weekday-mother-template.html"
          else
            MOTHER_FILE="simulation-lab/output/monday-mother-template.html"
          fi
          EXPECTED_SHA="$(python - "${TEMPLATE_KEY}" <<'PY'
          import json,sys
          m=json.loads(open("simulation-lab/baseline/mother-template-manifest.json",encoding="utf-8").read())
          print(m["templates"][sys.argv[1]]["simulation_blob_sha"])
          PY
          )"
          test -s "${REPORT_OUTPUT}" || { echo "Existing review HTML not found: ${REPORT_OUTPUT}"; exit 1; }
          echo "REPORT_DATE=${REPORT_DATE}" >> "$GITHUB_ENV"
          echo "REPORT_OUTPUT=${REPORT_OUTPUT}" >> "$GITHUB_ENV"
          echo "REPORT_EVIDENCE=preview/${REPORT_DATE}-simulation.qa.json" >> "$GITHUB_ENV"
          echo "TEMPLATE_KEY=${TEMPLATE_KEY}" >> "$GITHUB_ENV"
          echo "MOTHER_FILE=${MOTHER_FILE}" >> "$GITHUB_ENV"
          echo "EXPECTED_MASTER_SHA=${EXPECTED_SHA}" >> "$GITHUB_ENV"
          echo "QA_ONLY=true" >> "$GITHUB_ENV"
          echo "QA-only target locked: ${REPORT_OUTPUT}"

      - name: Project Yahoo pre-release consensus onto main W47 (read-only)
        if: false # skip stale 2026-11-15 capture; use fresh report-layer projection from current main W47 calendar
        shell: bash
        run: |
          set -euo pipefail
          test -s simulation-lab/output/yahoo-finance-pre-release-capture-20261115.json
          test -s simulation-lab/output/yfinance-methodology-probe.json
          git fetch --no-tags origin main
          MAIN_W47="$RUNNER_TEMP/2026-W47.json"
          git show FETCH_HEAD:data/calendar/weeks/2026-W47.json > "$MAIN_W47"
          python simulation-lab/runner/project_w47_yahoo_consensus.py \
            --calendar "$MAIN_W47" \
            --capture simulation-lab/output/yahoo-finance-pre-release-capture-20261115.json \
            --yfinance-methodology simulation-lab/output/yfinance-methodology-probe.json \
            --output simulation-lab/output/w47-yahoo-consensus-projection.json \
            --expected-calendar-blob-sha "$(git rev-parse FETCH_HEAD:data/calendar/weeks/2026-W47.json)"

      - name: Skip cash-index OHLC collector (SIM-1.3 D4 requires ChatGPT direct verification)
        if: false # Do not use repo collector, schedule, or external OHLC artifact for key levels.
        run: |
          echo "Key levels are manually verified by ChatGPT from same-day cash-index OHLC in the report fixture."

      - name: Capture released earnings price reactions for the selected report date
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: |
          python simulation-lab/runner/collect_earnings_price_reactions.py --report-date "${REPORT_DATE}" --output simulation-lab/output/earnings-price-reactions.json

      - name: Assemble date-driven review from the matching fixture and approved mother
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        shell: bash
        run: |
          set -euo pipefail
          CONSENSUS_ARGS=()
          if [[ -s simulation-lab/output/w47-yahoo-consensus-projection.json ]]; then
            CONSENSUS_ARGS=(--earnings-consensus-projection simulation-lab/output/w47-yahoo-consensus-projection.json)
          fi
          python simulation-lab/runner/build_review_html.py --data "${REPORT_DATA}" --price-reactions simulation-lab/output/earnings-price-reactions.json --output "${REPORT_OUTPUT}" --expected-master-sha "${EXPECTED_MASTER_SHA}" "${CONSENSUS_ARGS[@]}"

      - name: Set up Node for browser QA
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'qa-only')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify Traditional Chinese fonts for visual QA
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          tc_family="$(fc-match -f '%{family}' 'Noto Sans CJK TC')"
          echo "Traditional Chinese font package resolved to: ${tc_family}"
          echo "${tc_family}" | grep -Eqi 'Noto Sans CJK TC'
          mkdir -p "${HOME}/.config/fontconfig"
          cat > "${HOME}/.config/fontconfig/fonts.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias>
              <family>Noto Sans TC</family>
              <prefer><family>Noto Sans CJK TC</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          font_match="$(fc-match -f '%{family}' 'Noto Sans TC')"
          echo "Noto Sans TC resolved to: ${font_match}"
          echo "${font_match}" | grep -Eqi 'Noto Sans CJK TC'

      - name: Install Playwright Chromium for browser QA
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'qa-only')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: |
          npm install --no-save playwright
          # ubuntu-latest already carries Chromium's runtime libraries; install only the browser binary to avoid a slow apt dependency pass.
          npx playwright install chromium
      - name: Test navigation tabs accordions and source links
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'qa-only')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: node simulation-lab/runner/interaction_smoke.mjs "${REPORT_OUTPUT}" simulation-lab/output/interaction-smoke.json

      # Includes the summary section-heading font-size parity audit at desktop, tablet and mobile widths.
      - name: Compare review against the date-selected approved mother
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'qa-only')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: node simulation-lab/runner/visual_regression.mjs "${REPORT_OUTPUT}" "${TEMPLATE_KEY}" "${REPORT_DATE}"

      - name: Verify mother-owned DOM structure unchanged
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'qa-only')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: python simulation-lab/runner/validate_mother_dom_contract.py --mother "${MOTHER_FILE}" --report "${REPORT_OUTPUT}" --template "${TEMPLATE_KEY}"

      - name: Independently validate exact review artifact and provenance
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'qa-only')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: python simulation-lab/runner/validate_review_artifact.py --report "${REPORT_OUTPUT}" --report-date "${REPORT_DATE}"

      - name: Validate date, authoritative calendar counts, 44 indicators and news shape
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: |
          python - "${REPORT_DATE}" "${REPORT_DATA}" "${REPORT_OUTPUT}" <<'PY'
          import json, sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          sys.path.insert(0, "simulation-lab/runner")
          from calendar_source_guard import load_authoritative_calendar
          report_date, data_path, html_path = sys.argv[1:]
          data = json.loads(Path(data_path).read_text(encoding="utf-8"))
          html = BeautifulSoup(Path(html_path).read_text(encoding="utf-8"), "html.parser")
          assert data["report_date"] == report_date
          assert html.select_one('meta[name="report-date"]')["content"] == report_date
          calendar = load_authoritative_calendar(report_date)
          expected_econ = calendar["current"]["economic_count"]
          expected_earnings = calendar["current"]["earnings_count"]
          actual_econ = len(html.select("#calendar .econ-event"))
          actual_earnings = len(html.select("#earnings .earnings-accordion"))
          assert actual_econ == expected_econ, f"economic calendar mismatch: {actual_econ}/{expected_econ}"
          assert actual_earnings == expected_earnings, f"earnings calendar mismatch: {actual_earnings}/{expected_earnings}"
          indicators = (
              list(data.get("global_markets", {}).values()) +
              list(data.get("bonds", {}).values()) +
              list(data.get("fx", {}).values()) +
              list(data.get("energy", {}).values()) +
              list(data.get("metals", {}).values()) +
              list(data.get("risk", {}).values()) +
              [{"display": value} for value in data.get("sectors", {}).values()]
          )
          assert len(indicators) == 44, f"expected 44 indicator fields, got {len(indicators)}"
          # A CFD index reference may never be rendered as a cash-index close.
          # Keep the row explicitly pending until a cash/official index source is captured.
          cfd_rows = [
              name for name, item in data.get("global_markets", {}).items()
              if item.get("source", {}).get("quote_type") == "cfd_index_reference_series"
              and (item.get("display") != "待核實" or item.get("change_display") != "待核實")
          ]
          assert not cfd_rows, f"CFD index values must be suppressed, not rendered as cash closes: {cfd_rows}"
          assert len(data.get("focus_news", [])) == 5, "global focus news must contain 5 stories"
          assert len({x.get("title") for x in data["focus_news"]}) == 5, "duplicate focus news titles"
          assert len(data.get("headlines", [])) == 10, "market headlines must contain 10 stories"
          print(f"PASS: report_date={report_date}; calendar={actual_econ}/{expected_econ}; earnings={actual_earnings}/{expected_earnings}; indicators=44; focus=5; headlines=10")
          PY

      - name: Seal QA evidence to the exact review HTML blob
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        shell: bash
        run: |
          set -euo pipefail
          python - "${REPORT_OUTPUT}" "${REPORT_DATE}" "${REPORT_EVIDENCE}" <<'PY'
          import hashlib, json, re, subprocess, sys
          from pathlib import Path
          from bs4 import BeautifulSoup, Comment
          report_path, report_date, evidence_path = sys.argv[1:]
          raw = Path(report_path).read_bytes()
          soup = BeautifulSoup(raw, "html.parser")
          comment = next((str(x) for x in soup.find_all(string=lambda x: isinstance(x, Comment) and "TAC_BUILD_PROVENANCE" in str(x))), None)
          if not comment: raise SystemExit("missing TAC_BUILD_PROVENANCE")
          match = re.search(r"TAC_BUILD_PROVENANCE\s+(\{.*\})", comment, re.S)
          if not match: raise SystemExit("malformed TAC_BUILD_PROVENANCE")
          provenance = json.loads(match.group(1))
          # SIM-1.4 DRAFT §7.4: independently gate the analysis actually rendered in the final HTML.
          fixture_path = Path(f"simulation-lab/fixtures/report-data-{report_date}.json")
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          bluf = soup.select_one("#overview > section.grid.two > article.card.bluf")
          if bluf is None:
              raise SystemExit("content analysis gate: summary card missing")
          title_node = bluf.select_one("h1")
          summary_body = bluf.select_one(".key, .bluf-content, p")
          if title_node is None or title_node.get_text(" ", strip=True) != fixture.get("summary_title"):
              raise SystemExit("content analysis gate: summary headline mismatch")
          if summary_body is None:
              raise SystemExit("content analysis gate: summary body missing")
          summary_text = summary_body.get_text(" ", strip=True)
          summary_points = fixture.get("summary_points", [])
          required_labels = ["市場主軸", "基本面分歧", "操作建議"]
          if [x.get("label") for x in summary_points] != required_labels:
              raise SystemExit("content analysis gate: summary must contain the three required Monday blocks")
          for point in summary_points:
              if not point.get("text") or point["text"] not in summary_text:
                  raise SystemExit(f"content analysis gate: summary point not rendered: {point.get('label')}")
          action = summary_points[2]["text"]
          for token in ("中性偏防禦", "加碼", "減碼", "不追價"):
              if token not in action:
                  raise SystemExit(f"content analysis gate: operation plan missing {token}")
          market_comments = fixture.get("market_comments", {})
          def normalize_analysis_text(value):
              return re.sub(r"\\s+", " ", str(value or "")).strip()
          def comment_body(value):
              text = str(value or "")
              return text.split("｜", 1)[1].strip() if "｜" in text else text.strip()
          region_rows = [
              ("#tac-global-panel-0", 0, "美股"),
              ("#tac-global-panel-1", 1, "亞股"),
              ("#tac-global-panel-2", 3, "歐股"),
          ]
          for selector, index, label in region_rows:
              panel = soup.select_one(selector)
              note = panel.select_one(".market-reason") if panel else None
              expected = market_comments.get("global_markets", [])[index]
              if note is None or normalize_analysis_text(comment_body(expected)) not in normalize_analysis_text(note.get_text(" ", strip=True)):
                  raise SystemExit(f"content analysis gate: {label} commentary not rendered in its correct panel")
          # Legacy region slots must not retain cross-region commentary.
          for selector, index, label in (("#asia", 1, "亞洲舊槽位"), ("#tac-region-panel-2", 3, "歐洲舊槽位")):
              panel = soup.select_one(selector)
              note = panel.select_one(".market-reason") if panel else None
              expected = market_comments.get("global_markets", [])[index]
              if note is not None and comment_body(expected) not in note.get_text(" ", strip=True):
                  raise SystemExit(f"content analysis gate: {label} contains stale or mismapped commentary")
          asset_rows = [
              ("#tac-assets-panel-0", "sectors", "產業"),
              ("#bonds", "bonds", "債券"),
              ("#fx", "fx", "匯率"),
              ("#tac-assets-panel-3", "energy", "原油"),
              ("#tac-assets-panel-4", "metals", "貴金屬"),
          ]
          for selector, key, label in asset_rows:
              panel = soup.select_one(selector)
              note = panel.select_one(".market-reason") if panel else None
              expected = market_comments.get(key, "")
              if not expected or note is None or normalize_analysis_text(comment_body(expected)) not in normalize_analysis_text(note.get_text(" ", strip=True)):
                  raise SystemExit(f"content analysis gate: {label} commentary missing or not rendered")
              if not any(token in expected for token in ("操作", "投資含意", "投資應對")):
                  raise SystemExit(f"content analysis gate: {label} commentary lacks an investment response")
              if re.search(r"\\d+(?:\\.\\d+)?%", expected):
                  raise SystemExit(f"content analysis gate: {label} commentary repeats a percentage quote")
          observation = fixture.get("observation", {})
          observation_text = observation.get("text", "") if isinstance(observation, dict) else str(observation)
          market_panel = soup.select_one(".focus-panel.focus-market")
          if not observation_text or market_panel is None or observation_text not in market_panel.get_text(" ", strip=True):
              raise SystemExit("content analysis gate: market observation missing from rendered focus panel")
          if not any(token in observation_text for token in ("投資決策", "操作", "配置")) or not any(token in observation_text for token in ("若", "如果")):
              raise SystemExit("content analysis gate: market observation lacks decision implication or invalidation condition")
          sentiment = fixture.get("sentiment", "")
          sentiment_panel = soup.select_one("#sentiment")
          if not sentiment or sentiment_panel is None or sentiment not in sentiment_panel.get_text(" ", strip=True):
              raise SystemExit("content analysis gate: market sentiment interpretation missing")
          for i, comment in enumerate(market_comments.get("global_markets", [])):
              if i in (0, 1, 3) and re.search(r"\\d+(?:\\.\\d+)?%", comment):
                  raise SystemExit(f"content analysis gate: regional commentary {i} repeats a percentage quote")
              if i in (0, 1, 3) and not any(token in comment for token in ("投資含意", "操作", "投資應對")):
                  raise SystemExit(f"content analysis gate: regional commentary {i} lacks an investment response")
          analysis_sections_checked = ["summary", "market_sentiment", "market_observation", "US", "Asia", "Europe", "sectors", "bonds", "FX", "energy", "metals"]
          unsupported_causal_claims = []
          duplicate_quote_restatements = []
          actionability_findings = []
          interaction_path = Path("simulation-lab/output/interaction-smoke.json")
          visual_path = Path("simulation-lab/output/visual/visual-regression.json")
          interaction = json.loads(interaction_path.read_text(encoding="utf-8"))
          visual = json.loads(visual_path.read_text(encoding="utf-8"))
          if interaction.get("status") != "PASS" or interaction.get("page_errors"):
              raise SystemExit("interaction evidence is not PASS")
          if visual.get("failures") or visual.get("report_date") != report_date:
              raise SystemExit("visual evidence is not PASS or report date mismatch")
          expected_widths = [1440, 768, 412, 390, 360, 320]
          actual_widths = [v.get("width") for v in visual.get("viewports", [])]
          if actual_widths != expected_widths:
              raise SystemExit(f"visual viewport evidence mismatch: {actual_widths}")
          blockers = provenance.get("review_ready_blockers", [])
          data_audit = provenance.get("data_audit", {})
          evidence = {
              "status": "QA_PASSED",
              "review_ready": bool(provenance.get("review_ready", not blockers)),
              "review_ready_blockers": blockers,
              "data_audit": data_audit,
              "branch": "simulation/tac-process-lab-2026-11-06",
              "report_path": report_path,
              "report_date": report_date,
              "report_git_blob_sha": subprocess.check_output(["git", "hash-object", report_path], text=True).strip(),
              "report_sha256": hashlib.sha256(raw).hexdigest(),
              "build_commit_sha": provenance["build_commit_sha"],
              "builder_blob_sha": provenance["builder_blob_sha"],
              "fixture_blob_sha": provenance["fixture_blob_sha"],
              "template_blob_sha": provenance["template_blob_sha"],
              "manifest_blob_sha": provenance["manifest_blob_sha"],
              "qa_contract_blob_sha": provenance["qa_contract_blob_sha"],
              "active_rules_blob_sha": provenance["active_rules_blob_sha"],
              "candidate_rules_blob_sha": provenance["candidate_rules_blob_sha"],
              "candidate_builder_path": provenance["builder_path"],
              "candidate_builder_blob_sha": provenance["builder_blob_sha"],
              "data_review_ready": bool(provenance.get("review_ready", not blockers)),
              "content_analysis_gate": "PASS",
              "analysis_sections_checked": analysis_sections_checked,
              "unsupported_causal_claims": unsupported_causal_claims,
              "duplicate_quote_restatements": duplicate_quote_restatements,
              "actionability_findings": actionability_findings,
              "sim14_builder_approval": "NOT_APPROVED",
              "sim14_review_ready": False,
              "sim14_blockers": ["SIM-1.4 remains DRAFT; candidate Builder has not been explicitly approved as the unique entry point"],
              "calendar_main_commit_sha": provenance["calendar_main_commit_sha"],
              "calendar_current_blob_sha": provenance["calendar_current_blob_sha"],
              "calendar_previous_blob_sha": provenance["calendar_previous_blob_sha"],
              "interaction_evidence_sha256": hashlib.sha256(interaction_path.read_bytes()).hexdigest(),
              "visual_evidence_sha256": hashlib.sha256(visual_path.read_bytes()).hexdigest(),
              "viewports": actual_widths,
              "workflow_run_id": "${{ github.run_id }}",
              "workflow_run_attempt": "${{ github.run_attempt }}"
          }
          Path(evidence_path).write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Keep review output isolated to simulation branch artifact
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'qa-only')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report'))
        run: test -s "${REPORT_OUTPUT}"

      - name: Persist QA-passed review HTML on simulation branch
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report')))
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${REPORT_OUTPUT}" "${REPORT_EVIDENCE}"
          REVIEW_BLOB_SHA="$(git hash-object "${REPORT_OUTPUT}")"
          EVIDENCE_BLOB_SHA="$(git hash-object "${REPORT_EVIDENCE}")"
          if git diff --cached --quiet; then
            echo "No review HTML changes to persist"
            exit 0
          fi
          git commit -m "[skip ci] Store QA-passed ${REPORT_DATE} review HTML"
          git fetch origin simulation/tac-process-lab-2026-11-06
          git rebase origin/simulation/tac-process-lab-2026-11-06
          # Revalidate after rebase so a concurrent mother/manifest change cannot
          # leave a QA-passed HTML artifact attached to a different approved baseline.
          python simulation-lab/runner/validate_review_artifact.py --report "${REPORT_OUTPUT}" --report-date "${REPORT_DATE}"
          RECHECK_BLOB_SHA="$(git show "HEAD:${REPORT_OUTPUT}" | git hash-object --stdin)"
          RECHECK_EVIDENCE_SHA="$(git show "HEAD:${REPORT_EVIDENCE}" | git hash-object --stdin)"
          test "${REVIEW_BLOB_SHA}" = "${RECHECK_BLOB_SHA}" || { echo "Review artifact SHA changed during persistence"; exit 1; }
          test "${EVIDENCE_BLOB_SHA}" = "${RECHECK_EVIDENCE_SHA}" || { echo "QA evidence SHA changed during persistence"; exit 1; }
          echo "QA-passed review artifact committed; html_blob_sha=${RECHECK_BLOB_SHA}; evidence_blob_sha=${RECHECK_EVIDENCE_SHA}"
          git push origin "HEAD:simulation/tac-process-lab-2026-11-06"
          git fetch origin simulation/tac-process-lab-2026-11-06
          REMOTE_HTML_SHA="$(git show "origin/simulation/tac-process-lab-2026-11-06:${REPORT_OUTPUT}" | git hash-object --stdin)"
          REMOTE_EVIDENCE_SHA="$(git show "origin/simulation/tac-process-lab-2026-11-06:${REPORT_EVIDENCE}" | git hash-object --stdin)"
          test "${REVIEW_BLOB_SHA}" = "${REMOTE_HTML_SHA}" || { echo "Remote preview HTML read-back SHA mismatch"; exit 1; }
          test "${EVIDENCE_BLOB_SHA}" = "${REMOTE_EVIDENCE_SHA}" || { echo "Remote QA sidecar read-back SHA mismatch"; exit 1; }
          echo "Remote read-back PASS; html_blob_sha=${REMOTE_HTML_SHA}; evidence_blob_sha=${REMOTE_EVIDENCE_SHA}"

      - name: Record isolated run metadata
        if: always()
        shell: bash
        run: |
          mkdir -p simulation-lab/output
          {
            echo "branch=simulation/tac-process-lab-2026-11-06"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "report_date=${REPORT_DATE:-self-test-only}"
            echo "main_write_scope=read-only"
            echo "production_deploy=forbidden"
          } > simulation-lab/output/runner-metadata.txt

      - name: Archive ORTEX TEST raw probe evidence on simulation branch
        # Failed QA runs are already preserved by the always() artifact upload;
        # never create a second branch writer while a failed run is unwinding.
        if: success() && hashFiles('simulation-lab/output/ortex-test-probe.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simulation-lab/runs
          cp simulation-lab/output/ortex-test-probe.json "simulation-lab/runs/ortex-test-probe-${GITHUB_RUN_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "simulation-lab/runs/ortex-test-probe-${GITHUB_RUN_ID}.json"
          if git diff --cached --quiet; then
            echo "No ORTEX probe evidence to archive"
            exit 0
          fi
          git commit -m "[skip ci] Archive ORTEX TEST probe ${GITHUB_RUN_ID}"
          # Rebase against the freshest remote head and retry a non-fast-forward
          # race without force-pushing or overwriting another writer.
          for attempt in 1 2 3; do
            git fetch origin simulation/tac-process-lab-2026-11-06
            git rebase origin/simulation/tac-process-lab-2026-11-06
            if git push origin "HEAD:simulation/tac-process-lab-2026-11-06"; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Archive push failed after 3 safe rebase attempts" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            simulation-lab/output/
            ${{ env.REPORT_OUTPUT }}
            ${{ env.REPORT_EVIDENCE }}

          if-no-files-found: warn
          retention-days: 7
