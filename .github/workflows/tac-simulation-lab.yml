name: TAC isolated simulation lab

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - "simulation-lab/**"
      - "!simulation-lab/runs/**"
      - "!simulation-lab/output/**"
      - ".github/workflows/tac-simulation-lab.yml"
      - ".github/workflows/tac-key-levels-live.yml"

permissions:
  contents: write

concurrency:
  group: tac-simulation-lab-focus-tabs-20261107
  cancel-in-progress: true

jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout simulation branch only
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema beautifulsoup4 pandas yfinance pandas-market-calendars

      - name: Run deterministic self-tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tac_wr_lock.py --self-test
          python scripts/validate_tac_daily_snapshot.py --self-test
          python scripts/assemble_tac_daily_snapshot.py --self-test
          python scripts/render_tac_market_snapshot_to_html.py --help >/dev/null
          python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json --data simulation-lab/fixtures/report-data-2026-11-09.json --report-date 2026-11-09 --self-test
          python simulation-lab/runner/collect_key_levels_ohlc.py --self-test

      - name: Set up Node for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Validate simulation dual mother five-zone layout
        run: python simulation-lab/runner/validate_dual_mothers.py

      - name: Capture verified live OHLC for five US cash indices
        run: |
          python simulation-lab/runner/collect_key_levels_ohlc.py --allow-manual --report-date 2026-11-11 --output simulation-lab/output/key-levels-live.json

      - name: Assemble actual 2026-11-11 weekday review from verified report data
        run: |
          python simulation-lab/runner/build_review_html.py --data simulation-lab/fixtures/report-data-2026-11-11.json --key-levels-live simulation-lab/output/key-levels-live.json --output simulation-lab/output/TAC_投資早報_2026-11-11_審核版.html --expected-master-sha 6fe79308eca71db5dd54308fd35efe3900451081

      - name: Compare 2026-11-11 review against approved weekday mother
        run: node simulation-lab/runner/visual_regression.mjs simulation-lab/output/TAC_投資早報_2026-11-11_審核版.html weekdays 2026-11-11



      - name: Publish the approved simulation review preview only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s simulation-lab/output/TAC_投資早報_2026-11-11_審核版.html
          cp simulation-lab/output/TAC_投資早報_2026-11-11_審核版.html /tmp/TAC_投資早報_2026-11-11_審核版.html
          git fetch origin main
          git checkout -B tac-preview-2026-11-11 FETCH_HEAD
          mkdir -p preview
          cp /tmp/TAC_投資早報_2026-11-11_審核版.html preview/2026-11-11-simulation.html
          git add preview/2026-11-11-simulation.html
          staged_files="$(git diff --cached --name-only)"
          test "$staged_files" = "preview/2026-11-11-simulation.html"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish 2026-11-11 TAC simulation review preview"
          git push origin HEAD:main
          git fetch origin main
          git show origin/main:preview/2026-11-11-simulation.html | grep -q "</html>"
          git checkout -B simulation/tac-process-lab-2026-11-06 origin/simulation/tac-process-lab-2026-11-06

      - name: Record isolated run metadata
        if: always()
        shell: bash
        run: |
          mkdir -p simulation-lab/output
          {
            echo "branch=simulation/tac-process-lab-2026-11-06"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "main_write_scope=preview/2026-11-11-simulation.html only; all other main files forbidden"
            echo "production_deploy=forbidden"
          } > simulation-lab/output/runner-metadata.txt

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-simulation-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-lab/output/
          if-no-files-found: error
          retention-days: 7
