name: TAC isolated simulation lab

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - "simulation-lab/**"
      - "!simulation-lab/runs/**"
      - "!simulation-lab/output/**"
      - ".github/workflows/tac-simulation-lab.yml"
      - ".github/workflows/tac-key-levels-live.yml"

permissions:
  contents: write

concurrency:
  group: tac-simulation-lab-focus-tabs-20261107
  cancel-in-progress: true

jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout simulation branch only
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema beautifulsoup4 pandas yfinance pandas-market-calendars

      - name: Run deterministic self-tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tac_wr_lock.py --self-test
          python scripts/validate_tac_daily_snapshot.py --self-test
          python simulation-lab/runner/calendar_source_guard.py --self-test
          python simulation-lab/runner/collect_earnings_price_reactions.py --self-test
          python scripts/assemble_tac_daily_snapshot.py --self-test
          python scripts/render_tac_market_snapshot_to_html.py --help >/dev/null
          python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json --data simulation-lab/fixtures/report-data-2026-11-09.json --report-date 2026-11-09 --self-test
          python simulation-lab/runner/collect_key_levels_ohlc.py --self-test

      - name: Set up Node for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Validate simulation dual mother five-zone layout
        run: python simulation-lab/runner/validate_dual_mothers.py

      - name: Capture verified live OHLC for five US cash indices
        run: |
          python simulation-lab/runner/collect_key_levels_ohlc.py --allow-manual --report-date 2026-11-12 --report-data simulation-lab/fixtures/report-data-2026-11-12.json --output simulation-lab/output/key-levels-live.json

      - name: Capture published earnings price reactions from Yahoo Finance
        run: python simulation-lab/runner/collect_earnings_price_reactions.py --report-date 2026-11-12 --output simulation-lab/output/earnings-price-reactions.json

      - name: Assemble actual 2026-11-12 weekday review from verified report data
        run: |
          python simulation-lab/runner/build_review_html.py --data simulation-lab/fixtures/report-data-2026-11-12.json --key-levels-live simulation-lab/output/key-levels-live.json --price-reactions simulation-lab/output/earnings-price-reactions.json --output simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html --expected-master-sha 6fe79308eca71db5dd54308fd35efe3900451081

      - name: Compare 2026-11-12 review against approved weekday mother
        run: node simulation-lab/runner/visual_regression.mjs simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html weekdays 2026-11-12

      - name: Validate calendar counts and non-comparable EPS display
        run: |
          python - <<'PY'
          import json
          from bs4 import BeautifulSoup
          from pathlib import Path
          p = Path("simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html")
          soup = BeautifulSoup(p.read_text(encoding="utf-8"), "html.parser")
          econ = soup.select("#calendar .econ-event")
          earnings = soup.select("#earnings .earnings-accordion")
          assert len(econ) == 16, f"expected 16 main economic events, got {len(econ)}"
          assert len(earnings) == 48, f"expected 48 main earnings events, got {len(earnings)}"
          report_data = json.loads(Path("simulation-lab/fixtures/report-data-2026-11-12.json").read_text(encoding="utf-8"))
          focus = report_data["focus_news"]
          assert len(focus) == 5, f"expected 5 global focus stories, got {len(focus)}"
          assert len({x["title"] for x in focus}) == 5, "duplicate focus news titles"
          for story in focus:
              assert story["url"].startswith(("https://hk.investing.com/", "https://news.cnyes.com/")), f"focus source outside Cnyes/Investing.com: {story['url']}"
              assert "2026-11-11 12:00" <= story["published_at_tw"] <= "2026-11-12 05:25", f"focus story outside 05:25 selection window: {story['published_at_tw']}"
          assert len(report_data["headlines"]) == 10, "market hot headlines must contain 10 stories"
          assert "Ciena" in report_data["headlines"][-1]["title"], "index recap was not replaced by the Ciena AI optics story"
          assert "三大指數" not in report_data["headlines"][-1]["title"], "market hot headline repeats index close list"
          assert report_data["global_markets"]["費城半導體指數"]["display"] == "10,564.1"
          assert report_data["global_markets"]["費城半導體指數"]["change_display"] == "+5.66%"
          assert report_data["global_markets"]["羅素2000指數"]["display"] == "2,846.26"
          assert report_data["global_markets"]["羅素2000指數"]["change_display"] == "+0.88%"
          assert report_data["metals"]["黃金期貨 GC"]["display"] == "3,994.30"
          assert report_data["metals"]["黃金期貨 GC"]["change_display"] == "-0.89%"
          assert report_data["metals"]["白銀期貨 SI"]["display"] == "51.24"
          assert report_data["metals"]["白銀期貨 SI"]["change_display"] == "+0.03%"
          for label, expected in (("2年期美債殖利率","4.748%"),("10年期美債殖利率","5.021%"),("30年期美債殖利率","5.358%")):
              bond = report_data["bonds"][label]
              assert bond["display"] == "休市"
              assert bond["source"]["quote_type"] == "market_closed_no_valid_quote"
              assert "無有效" in bond["change_display"]
          assert report_data["risk"]["move"]["display"] == "休市"
          indicator_rows = (
              list(report_data["global_markets"].values()) +
              list(report_data["bonds"].values()) +
              list(report_data["fx"].values()) +
              list(report_data["energy"].values()) +
              list(report_data["metals"].values()) +
              list(report_data["risk"].values()) +
              [{"display": value} for value in report_data["sectors"].values()]
          )
          assert len(indicator_rows) == 44, f"expected 44 indicators, got {len(indicator_rows)}"
          assert sum(1 for row in indicator_rows if row.get("display") == "休市") == 4, "three Treasury yields and MOVE should remain closed without valid cutoff quotes"
          assert "russell2000" not in report_data.get("key_levels_overrides", {}), "CFD Russell override must not be used for ^RUT cash index"
          levels = json.loads(Path("simulation-lab/output/key-levels-live.json").read_text(encoding="utf-8"))
          sox_level = next(x for x in levels["key_levels"]["items"] if x["key"] == "sox")
          rut_level = next(x for x in levels["key_levels"]["items"] if x["key"] == "russell2000")
          assert "C 10,564.11" in sox_level["ohlc"], f"SOX close mismatch: {sox_level['ohlc']}"
          assert "C 2,846.26" in rut_level["ohlc"], f"Russell cash close mismatch: {rut_level['ohlc']}"
          reactions = json.loads(Path("simulation-lab/output/earnings-price-reactions.json").read_text(encoding="utf-8"))
          assert reactions["main_commit_sha"], "price reaction source commit SHA missing"
          assert reactions["calendar_blob_sha"], "price reaction calendar blob SHA missing"
          assert reactions["reaction_count"] == reactions["eligible_count"], f"unresolved eligible earnings price reactions: {reactions['reaction_count']}/{reactions['eligible_count']}"
          assert reactions["unavailable_count"] == 0, f"unavailable eligible earnings reactions remain: {reactions['unavailable_count']}"
          all_text = soup.get_text(" ", strip=True)
          assert "數值高於預期（EPS口徑待核實）" not in all_text
          assert "數值低於預期（EPS口徑待核實）" not in all_text
          assert "無有效 11/11 收盤／CFD 報價" in all_text, "Treasury holiday no-valid-quote status was not rendered"
          assert "2年期美債殖利率" in all_text and "10年期美債殖利率" in all_text and "30年期美債殖利率" in all_text
          assert "公告後首個交易日收盤" in all_text, "verified earnings price reactions were not rendered into HTML"
          reaction_cards = [x for x in earnings if "公告後首個交易日收盤" in x.get_text(" ", strip=True)]
          assert len(reaction_cards) == reactions["reaction_count"], f"HTML price reaction cards mismatch: {len(reaction_cards)} vs {reactions['reaction_count']}"
          for card in reaction_cards:
              price_field = next((f for f in card.select(".earnings-detail-field") if f.select_one("label") and f.select_one("label").get_text(" ", strip=True) == "股價當日表現"), None)
              assert price_field and price_field.select_one(".earnings-detail-value a[href^='https://']"), "price reaction source link missing"
          on = next((x for x in earnings if "On Holding" in x.get_text(" ", strip=True)), None)
          assert on is not None
          on_text = on.get_text(" ", strip=True)
          for expected in ("CHF 0.48", "US$0.48", "CHF 0.931B", "US$1.140B"):
              assert expected in on_text, f"On Holding currency label missing: {expected}"
          ec = next((x for x in earnings if "Ecopetrol S.A." in x.get_text(" ", strip=True)), None)
          assert ec is not None
          ec_text = ec.get_text(" ", strip=True)
          assert "已延期；改期至" in ec_text, "Ecopetrol postponement status was not rendered"
          assert "即將公布；11/13" not in ec_text, "postponed earnings must not be labelled as simply upcoming"
          vylor = next((x for x in earnings if "Vylor" in x.get_text(" ", strip=True)), None)
          assert vylor is not None
          vylor_text = vylor.get_text(" ", strip=True)
          assert "電話會議 22:00" in vylor_text, "Vylor webcast time must be labelled as call time"
          assert "財報發布：盤後（發布時間待核實）；電話會議：22:00" in vylor_text, "Vylor release/call times must not be conflated"
          nebius = next((x for x in earnings if "Nebius Group" in x.get_text(" ", strip=True)), None)
          assert nebius is not None and "財報發布：盤前（發布時間待核實）；電話會議：21:00" in nebius.get_text(" ", strip=True)
          print("PASS: main calendar counts; pending EPS non-directional; currencies split; postponed status; release vs call time")
          PY



      - name: Keep review output isolated to simulation branch artifact
        run: test -s simulation-lab/output/TAC_投資早報_2026-11-12_審核版.html

      - name: Record isolated run metadata
        if: always()
        shell: bash
        run: |
          mkdir -p simulation-lab/output
          {
            echo "branch=simulation/tac-process-lab-2026-11-06"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "main_write_scope=read-only; simulation branch artifact only"
            echo "production_deploy=forbidden"
          } > simulation-lab/output/runner-metadata.txt

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-simulation-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-lab/output/
          if-no-files-found: error
          retention-days: 7
