name: TAC isolated simulation lab

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - "simulation-lab/**"
      - "!simulation-lab/runs/**"
      - "!simulation-lab/output/**"
      - ".github/workflows/tac-simulation-lab.yml"
  workflow_dispatch:
    inputs:
      report_date:
        description: "台灣報告日期 YYYY-MM-DD；留白時自動選最新 fixture"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tac-simulation-lab-${{ github.event.inputs.report_date || 'push-smoke' }}
  cancel-in-progress: true

jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout simulation branch only
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check jsonschema beautifulsoup4 pandas yfinance pandas-market-calendars

      - name: Run deterministic self-tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tac_wr_lock.py --self-test
          python scripts/validate_tac_daily_snapshot.py --self-test
          python simulation-lab/runner/calendar_source_guard.py --self-test
          python simulation-lab/runner/collect_earnings_price_reactions.py --self-test
          python scripts/assemble_tac_daily_snapshot.py --self-test
          python scripts/render_tac_market_snapshot_to_html.py --help >/dev/null
          python simulation-lab/runner/key_levels_builder.py --ohlc simulation-lab/fixtures/key-levels-ohlc-2026-11-09.json --data simulation-lab/fixtures/report-data-2026-11-09.json --report-date 2026-11-09 --self-test
          python simulation-lab/runner/collect_key_levels_ohlc.py --self-test
          python simulation-lab/runner/validate_dual_mothers.py
          python simulation-lab/runner/test_fear_greed_marker.py
          python simulation-lab/runner/test_summary_headline.py
          python simulation-lab/runner/test_earnings_comparison_status.py
          python simulation-lab/runner/test_earnings_judgment_engine.py
          python simulation-lab/runner/test_earnings_schema_audit.py
          python simulation-lab/runner/validate_earnings_v2.py --self-test

      - name: Audit authoritative main earnings schema (read-only)
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DATE="$(TZ=Asia/Taipei date +%F)"
          python simulation-lab/runner/audit_earnings_schema.py --report-date "${REPORT_DATE}" --output simulation-lab/output/earnings-schema-audit.json --migration-csv simulation-lab/output/earnings-migration-preview.csv

      - name: Resolve report date, fixture, weekday mother and SHA
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        shell: bash
        env:
          INPUT_REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_REPORT_DATE}" ]]; then
            REPORT_DATE="${INPUT_REPORT_DATE}"
          else
            REPORT_DATE="$(python - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path("simulation-lab/fixtures").glob("report-data-????-??-??.json"))
          if not files:
              raise SystemExit("No report-data-YYYY-MM-DD.json fixture exists")
          print(re.search(r"(\d{4}-\d{2}-\d{2})", files[-1].name).group(1))
          PY
          )"
          fi
          python - "${REPORT_DATE}" <<'PY'
          import sys, json
          from datetime import date
          from pathlib import Path
          d = date.fromisoformat(sys.argv[1])
          if d.weekday() > 4:
              raise SystemExit(f"Weekend report date is not allowed: {d}")
          fixture = Path(f"simulation-lab/fixtures/report-data-{d.isoformat()}.json")
          if not fixture.is_file():
              raise SystemExit(f"Missing date-matched fixture: {fixture}; refusing to reuse another date")
          data = json.loads(fixture.read_text(encoding="utf-8"))
          if data.get("report_date") != d.isoformat():
              raise SystemExit(f"Fixture report_date mismatch: {data.get('report_date')!r} != {d}")
          if data.get("timezone") != "Asia/Taipei":
              raise SystemExit("Fixture timezone must be Asia/Taipei")
          PY
          TEMPLATE_KEY="$(python - "${REPORT_DATE}" <<'PY'
          import sys
          from datetime import date
          print("monday" if date.fromisoformat(sys.argv[1]).weekday() == 0 else "weekdays")
          PY
          )"
          EXPECTED_SHA="$(python - "${TEMPLATE_KEY}" <<'PY'
          import json, sys
          m = json.loads(open("simulation-lab/baseline/mother-template-manifest.json", encoding="utf-8").read())
          print(m["templates"][sys.argv[1]]["simulation_blob_sha"])
          PY
          )"
          echo "REPORT_DATE=${REPORT_DATE}" >> "$GITHUB_ENV"
          echo "REPORT_DATA=simulation-lab/fixtures/report-data-${REPORT_DATE}.json" >> "$GITHUB_ENV"
          echo "TEMPLATE_KEY=${TEMPLATE_KEY}" >> "$GITHUB_ENV"
          echo "EXPECTED_MASTER_SHA=${EXPECTED_SHA}" >> "$GITHUB_ENV"
          echo "REPORT_OUTPUT=simulation-lab/output/TAC_投資早報_${REPORT_DATE}_審核版.html" >> "$GITHUB_ENV"
          echo "Resolved report_date=${REPORT_DATE}; template=${TEMPLATE_KEY}; master_sha=${EXPECTED_SHA}"

      - name: Capture cash-index OHLC for the selected report date
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: |
          python simulation-lab/runner/collect_key_levels_ohlc.py --allow-manual --report-date "${REPORT_DATE}" --report-data "${REPORT_DATA}" --output simulation-lab/output/key-levels-live.json

      - name: Capture released earnings price reactions for the selected report date
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: |
          python simulation-lab/runner/collect_earnings_price_reactions.py --report-date "${REPORT_DATE}" --output simulation-lab/output/earnings-price-reactions.json

      - name: Assemble date-driven review from the matching fixture and approved mother
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: |
          python simulation-lab/runner/build_review_html.py --data "${REPORT_DATA}" --key-levels-live simulation-lab/output/key-levels-live.json --price-reactions simulation-lab/output/earnings-price-reactions.json --output "${REPORT_OUTPUT}" --expected-master-sha "${EXPECTED_MASTER_SHA}"

      - name: Set up Node for browser QA
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium for browser QA
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test navigation tabs accordions and source links
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: node simulation-lab/runner/interaction_smoke.mjs "${REPORT_OUTPUT}" simulation-lab/output/interaction-smoke.json

      # Includes the summary section-heading font-size parity audit at desktop, tablet and mobile widths.
      - name: Compare review against the date-selected approved mother
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: node simulation-lab/runner/visual_regression.mjs "${REPORT_OUTPUT}" "${TEMPLATE_KEY}" "${REPORT_DATE}"

      - name: Validate date, authoritative calendar counts, 44 indicators and news shape
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: |
          python - "${REPORT_DATE}" "${REPORT_DATA}" "${REPORT_OUTPUT}" <<'PY'
          import json, sys
          from pathlib import Path
          from bs4 import BeautifulSoup
          sys.path.insert(0, "simulation-lab/runner")
          from calendar_source_guard import load_authoritative_calendar
          report_date, data_path, html_path = sys.argv[1:]
          data = json.loads(Path(data_path).read_text(encoding="utf-8"))
          html = BeautifulSoup(Path(html_path).read_text(encoding="utf-8"), "html.parser")
          assert data["report_date"] == report_date
          assert html.select_one('meta[name="report-date"]')["content"] == report_date
          calendar = load_authoritative_calendar(report_date)
          expected_econ = calendar["current"]["economic_count"]
          expected_earnings = calendar["current"]["earnings_count"]
          actual_econ = len(html.select("#calendar .econ-event"))
          actual_earnings = len(html.select("#earnings .earnings-accordion"))
          assert actual_econ == expected_econ, f"economic calendar mismatch: {actual_econ}/{expected_econ}"
          assert actual_earnings == expected_earnings, f"earnings calendar mismatch: {actual_earnings}/{expected_earnings}"
          indicators = (
              list(data.get("global_markets", {}).values()) +
              list(data.get("bonds", {}).values()) +
              list(data.get("fx", {}).values()) +
              list(data.get("energy", {}).values()) +
              list(data.get("metals", {}).values()) +
              list(data.get("risk", {}).values()) +
              [{"display": value} for value in data.get("sectors", {}).values()]
          )
          assert len(indicators) == 44, f"expected 44 indicator fields, got {len(indicators)}"
          assert len(data.get("focus_news", [])) == 5, "global focus news must contain 5 stories"
          assert len({x.get("title") for x in data["focus_news"]}) == 5, "duplicate focus news titles"
          assert len(data.get("headlines", [])) == 10, "market headlines must contain 10 stories"
          print(f"PASS: report_date={report_date}; calendar={actual_econ}/{expected_econ}; earnings={actual_earnings}/{expected_earnings}; indicators=44; focus=5; headlines=10")
          PY

      - name: Keep review output isolated to simulation branch artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]'))
        run: test -s "${REPORT_OUTPUT}"

      - name: Persist QA-passed review HTML on simulation branch
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report]')))
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${REPORT_OUTPUT}"
          if git diff --cached --quiet; then
            echo "No review HTML changes to persist"
            exit 0
          fi
          git commit -m "[skip ci] Store QA-passed ${REPORT_DATE} review HTML"
          git fetch origin simulation/tac-process-lab-2026-11-06
          git rebase origin/simulation/tac-process-lab-2026-11-06
          git push origin "HEAD:simulation/tac-process-lab-2026-11-06"

      - name: Record isolated run metadata
        if: always()
        shell: bash
        run: |
          mkdir -p simulation-lab/output
          {
            echo "branch=simulation/tac-process-lab-2026-11-06"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "report_date=${REPORT_DATE:-self-test-only}"
            echo "main_write_scope=read-only"
            echo "production_deploy=forbidden"
          } > simulation-lab/output/runner-metadata.txt

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation-lab/output/
          if-no-files-found: warn
          retention-days: 7
