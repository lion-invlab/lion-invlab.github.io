name: TAC earnings schema v2 isolated tests

on:
  push:
    branches:
      - earnings-schema-v2-cutover-2026-11-13
    paths:
      - "scripts/tac_earnings_*.py"
      - "scripts/test_tac_earnings_*.py"
      - "schemas/tac-earnings-record-v2.schema.json"
      - ".github/workflows/tac-earnings-schema-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earnings-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: earnings-schema-v2-cutover-2026-11-13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run deterministic tests
        run: |
          python scripts/test_tac_earnings_judgment.py
          python scripts/test_tac_earnings_render.py
          python scripts/validate_tac_earnings_v2.py --self-test
          python scripts/preview_tac_earnings_v2_migration.py --self-test
          python scripts/preview_tac_earnings_v2_migration.py --files data/calendar/weeks/2026-W45.json data/calendar/weeks/2026-W46.json
