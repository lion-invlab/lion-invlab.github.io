name: TAC Approved Master Browser Regression

on:
  push:
    branches:
      - qa/tac-master-browser-regression-2026-10-28
    paths:
      - ".github/workflows/tac-master-browser-regression.yml"
      - "scripts/tac-master-browser-regression.mjs"
      - "母版專區/TAC_母版_週一_2026-10-26.html"
      - "母版專區/TAC_母版_週二至週五_2026-10-28.html"

permissions:
  contents: read

concurrency:
  group: tac-approved-master-browser-regression
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test approved Monday and weekday masters
        run: node scripts/tac-master-browser-regression.mjs
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-approved-master-browser-results
          path: artifacts/tac-master-browser/
          if-no-files-found: warn
          retention-days: 7
