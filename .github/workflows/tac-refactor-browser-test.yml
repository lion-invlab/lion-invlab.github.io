name: TAC Refactor Browser Regression Test

on:
  push:
    branches:
      - tac-design-system-work-2026-10-24
    paths:
      - "refactor-work/run-browser-tests.trigger"

concurrency:
  group: tac-refactor-browser-regression
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated refactor branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright pixelmatch pngjs
          npx playwright install --with-deps chromium

      - name: Build self-contained candidate
        run: python refactor-work/build-candidate.py refactor-work/candidate-build.html

      - name: Run desktop and mobile smoke tests
        run: |
          node refactor-work/visual-smoke-test.mjs
          node refactor-work/instrument-typography-audit.mjs
          node refactor-work/panel-child-geometry-diagnostic.mjs

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-refactor-browser-results
          path: |
            refactor-work/browser-results/
            refactor-work/candidate-build.html
          if-no-files-found: warn
          retention-days: 7
