name: TAC Chart 3 synchronized release QA (research branch)

on:
  push:
    branches:
      - research/chart3-synchronized-release-20261118
    paths:
      - ".github/scripts/build_tac_chart3_synchronized_release.py"
      - ".github/scripts/test_tac_chart3_synchronized_release.py"
      - ".github/scripts/prepare_sp500_research_import.py"
      - ".github/scripts/test_prepare_sp500_research_import.py"
      - ".github/workflows/chart3-synchronized-release-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart3-synchronized-release-research-qa
  cancel-in-progress: false

jobs:
  synchronized-release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/chart3-synchronized-release-20261118
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synchronized release unit tests
        run: |
          python .github/scripts/test_tac_chart3_synchronized_release.py
          python .github/scripts/test_prepare_sp500_research_import.py
