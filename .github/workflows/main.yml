name: Update S&P 500 Volatility Data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 21 * * 0-4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Update volatility data
        run: |
          python scripts/update_data.py
          python scripts/update_tac_watchlist.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update volatility data including TAC watchlist"
          git push
