name: TAC Weekly Calendar DB Prototype
on:
  pull_request:
    paths:
      - 'data/calendar/**'
      - 'scripts/tac_weekly_calendar_db.py'
      - 'scripts/tac_calendar_html_renderer.py'
      - 'tests/test_tac_weekly_calendar_db.py'
      - 'tests/test_tac_calendar_html_renderer.py'
      - '.github/workflows/tac-weekly-calendar-db-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate W44 archive candidate
        run: python scripts/tac_weekly_calendar_db.py validate --file data/calendar/weeks/2026-W44.json
      - name: Validate W45 current week
        run: python scripts/tac_weekly_calendar_db.py validate --file data/calendar/weeks/2026-W45.json
      - name: Build W45 Monday calendar snapshot
        run: >-
          python scripts/tac_weekly_calendar_db.py snapshot
          --file data/calendar/weeks/2026-W45.json
          --previous-week-file data/calendar/weeks/2026-W44.json
          --report-date 2026-11-02
          --output /tmp/tac-weekly-calendar-snapshot.json

      - name: Build W45 data quality report
        run: >-
          python scripts/tac_weekly_calendar_db.py quality-report
          --file data/calendar/weeks/2026-W45.json
          --output /tmp/tac-weekly-calendar-quality-report.json

      - name: Render Monday master from W45 snapshot
        run: >-
          python scripts/tac_calendar_html_renderer.py
          --template "母版專區/TAC_母版_週一_2026-10-28_最終定版.html"
          --snapshot /tmp/tac-weekly-calendar-snapshot.json
          --output /tmp/tac-2026-11-02-monday-review.html
          --mode monday

      - name: Render weekday master from W45 snapshot
        run: >-
          python scripts/tac_calendar_html_renderer.py
          --template "母版專區/TAC_母版_週二至週五_2026-10-28_最終定版.html"
          --snapshot /tmp/tac-weekly-calendar-snapshot.json
          --output /tmp/tac-2026-11-02-weekday-review.html
          --mode weekday

      - name: Verify rendered review HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          monday = Path('/tmp/tac-2026-11-02-monday-review.html').read_text(encoding='utf-8')
          weekday = Path('/tmp/tac-2026-11-02-weekday-review.html').read_text(encoding='utf-8')
          required = ('id="calendar"', 'id="earnings"', 'week-econ-tabs', 'week-earnings-tabs', 'id="sp500-earnings-health"')
          for marker in required:
              assert marker in monday, f"Monday output missing {marker}"
              assert marker in weekday, f"Weekday output missing {marker}"
          assert 'id="last-week-calendar"' in monday
          assert 'id="last-week-earnings"' in monday
          assert 'id="last-week-calendar"' not in weekday
          assert 'id="last-week-earnings"' not in weekday
          for html in (monday, weekday):
              assert 'TAC' in html
              assert '<html' in html.lower() and '</html>' in html.lower()
          print('Monday and weekday HTML render smoke tests passed.')
          PY

      - name: Upload rendered review previews
        uses: actions/upload-artifact@v4
        with:
          name: tac-2026-11-02-calendar-render-previews
          path: |
            /tmp/tac-2026-11-02-monday-review.html
            /tmp/tac-2026-11-02-weekday-review.html
            /tmp/tac-weekly-calendar-quality-report.json
          if-no-files-found: error
          retention-days: 5

      - name: Test next-week database initialization
        run: >-
          python scripts/tac_weekly_calendar_db.py init
          --week-of 2026-11-09
          --output /tmp/tac-weekly-calendar-W46.json
          --wr-version 3.8
      - name: Validate initialized next-week database
        run: >-
          python scripts/tac_weekly_calendar_db.py validate
          --file /tmp/tac-weekly-calendar-W46.json
