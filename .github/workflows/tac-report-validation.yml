name: TAC Daily Report Structural Gate

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "index.html"
      - "TAC_WORK_RULES.md"
      - "scripts/tac_wr_lock.py"
      - "review/*.html"
      - "preview/*.html"
      - "scripts/validate_tac_report.py"
      - "scripts/validate_tac_layout_contract.py"
      - "scripts/validate_tac_daily_snapshot.py"
      - "scripts/assemble_tac_daily_snapshot.py"
      - "scripts/validate_tac_market_mapping.py"
      - "scripts/tac_market_field_map.json"
      - "scripts/validate_tac_html_binding.py"
      - "scripts/tac_html_binding_map.json"
      - "母版專區/mother-template-manifest.json"
      - "母版專區/母版結構驗收清單.md"
      - "scripts/fetch_tac_treasury_yields.py"
      - "scripts/fetch_tac_treasury_fred_fallback.py"
      - "scripts/fetch_tac_global_indices.py"
      - "scripts/fetch_tac_sector_etfs.py"
      - "schemas/tac-daily-market-snapshot.schema.json"
      - "data/market/snapshots/*.json"
      - "scripts/tac_browser_layout_regression.mjs"
      - ".github/workflows/tac-report-validation.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "*.html"
      - "scripts/assemble_tac_daily_snapshot.py"
      - "index.html"
      - "TAC_WORK_RULES.md"
      - "scripts/tac_wr_lock.py"
      - "review/*.html"
      - "preview/*.html"
      - "scripts/validate_tac_report.py"
      - "scripts/validate_tac_layout_contract.py"
      - "scripts/validate_tac_daily_snapshot.py"
      - "scripts/validate_tac_market_mapping.py"
      - "scripts/tac_market_field_map.json"
      - "scripts/validate_tac_html_binding.py"
      - "scripts/tac_html_binding_map.json"
      - "母版專區/mother-template-manifest.json"
      - "母版專區/母版結構驗收清單.md"
      - "scripts/fetch_tac_treasury_yields.py"
      - "scripts/fetch_tac_treasury_fred_fallback.py"
      - "scripts/fetch_tac_global_indices.py"
      - "scripts/fetch_tac_sector_etfs.py"
      - "schemas/tac-daily-market-snapshot.schema.json"
      - "scripts/tac_browser_layout_regression.mjs"
      - ".github/workflows/tac-report-validation.yml"
  schedule:
    # 04:25 and 04:50 Asia/Taipei, Monday-Friday (UTC Sunday-Thursday)
    - cron: "25 20 * * 0-4" # 04:25 Asia/Taipei — calendar DB lock
    - cron: "50 20 * * 0-4" # 04:50 Asia/Taipei — morning report lock
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  # Daily lock bootstrap: runs in a real Git checkout, then relays the exact
  # lock artifact to the ChatGPT report automation through issue #319.
  daily-wr-lock:
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve latest main WR and create this run's lock
        id: wr-lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          mkdir -p artifacts
          python scripts/tac_wr_lock.py --ref origin/main --output artifacts/tac-wr-lock.json
          cat artifacts/tac-wr-lock.json

      - name: Upload exact WR lock artifact
        id: lock-artifact
        uses: actions/upload-artifact@v4
        with:
          name: tac-wr-lock-${{ github.run_id }}
          path: artifacts/tac-wr-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Relay run and artifact identity to ChatGPT
        if: success()
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.lock-artifact.outputs.artifact-id }}
        with:
          script: |
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('artifacts/tac-wr-lock.json', 'utf8'));
            const body = [
              '## TAC WR Lock — daily bootstrap',
              '',
              '- Status: **SUCCESS**',
              '- Trigger: ' + context.eventName,
              '- Taiwan run date: ' + lock.locked_at_taipei.slice(0, 10),
              '- Workflow run: ' + context.runId,
              '- Run attempt: ' + process.env.GITHUB_RUN_ATTEMPT,
              '- Artifact ID: ' + process.env.ARTIFACT_ID,
              '- Artifact name: tac-wr-lock-' + context.runId,
              '- Main commit: ' + lock.wr_commit_sha,
              '- WR version: ' + lock.wr_version,
              '- WR blob SHA: ' + lock.wr_blob_sha,
              '- WR content SHA-256: ' + lock.wr_content_sha256,
              '- Locked at (Taipei): ' + lock.locked_at_taipei,
              '',
              'Exact lock JSON from the uploaded artifact:',
              '```json',
              JSON.stringify(lock, null, 2),
              '```',
              '',
              'The ChatGPT report automation must download this exact artifact and compare its contents with this relay and the current main WR before proceeding.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 319,
              body
            });
            core.info('Appended WR lock relay record to issue #319');

  # Authenticated ChatGPT-to-runner handoff. Only the pinned repository owner
  # can submit a versioned fragment on ordinary issue #319.
  snapshot-comment-intake:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 319 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.id == 335424146 &&
      contains(github.event.comment.body, '<!-- TAC_MARKET_SNAPSHOT_V1_BEGIN -->') &&
      contains(github.event.comment.body, '<!-- TAC_MARKET_SNAPSHOT_V1_END -->')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout the exact current main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot schema validator
        run: python -m pip install jsonschema

      - name: Resolve current main WR lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          main_sha="$(git rev-parse origin/main)"
          git checkout --detach "$main_sha"
          mkdir -p "$RUNNER_TEMP/tac-snapshot-handoff"
          python scripts/tac_wr_lock.py --ref "$main_sha" --output "$RUNNER_TEMP/tac-snapshot-handoff/wr-lock.json"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "TAC_WR_LOCK_FILE=$RUNNER_TEMP/tac-snapshot-handoff/wr-lock.json" >> "$GITHUB_ENV"

      - name: Authenticate and extract issue comment payload
        run: |
          set -euo pipefail
          python scripts/ingest_tac_snapshot_comment.py \
            --event "$GITHUB_EVENT_PATH" \
            --lock "$RUNNER_TEMP/tac-snapshot-handoff/wr-lock.json" \
            --fragment-out "$RUNNER_TEMP/tac-snapshot-handoff/fragment.json" \
            --metadata-out "$RUNNER_TEMP/tac-snapshot-handoff/metadata.json"

      - name: Assemble and validate the official Snapshot
        shell: bash
        run: |
          set -euo pipefail
          report_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["report_date"])' "$RUNNER_TEMP/tac-snapshot-handoff/metadata.json")"
          trading_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["trading_date"])' "$RUNNER_TEMP/tac-snapshot-handoff/metadata.json")"
          generated_at="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Taipei")).isoformat())')"
          snapshot="$RUNNER_TEMP/tac-snapshot-handoff/snapshot.json"
          python scripts/assemble_tac_daily_snapshot.py \
            --report-date "$report_date" \
            --trading-date "$trading_date" \
            --generated-at "$generated_at" \
            --fragment "$RUNNER_TEMP/tac-snapshot-handoff/fragment.json" \
            --output "$snapshot"
          python scripts/validate_tac_daily_snapshot.py --file "$snapshot"
          echo "REPORT_DATE=$report_date" >> "$GITHUB_ENV"
          echo "SNAPSHOT_TEMP=$snapshot" >> "$GITHUB_ENV"

      - name: Commit the validated dated Snapshot to main
        shell: bash
        run: |
          set -euo pipefail
          snapshot_path="data/market/snapshots/$REPORT_DATE.json"
          if [ -e "$snapshot_path" ]; then
            echo "Refusing to overwrite the existing dated Snapshot: $snapshot_path" >&2
            exit 1
          fi
          git fetch origin main --prune
          if [ "$(git rev-parse origin/main)" != "${{ steps.lock.outputs.main_sha }}" ]; then
            echo "main advanced after WR lock creation; refusing a stale-lock commit" >&2
            exit 1
          fi
          mkdir -p data/market/snapshots
          cp "$SNAPSHOT_TEMP" "$snapshot_path"
          git add "$snapshot_path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add TAC market Snapshot $REPORT_DATE"
          git push origin HEAD:main
          echo "## TAC Snapshot intake: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report date: $REPORT_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "- WR lock commit: ${{ steps.lock.outputs.main_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot: $snapshot_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve assembled Snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-market-snapshot-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/tac-snapshot-handoff/
          if-no-files-found: warn
          retention-days: 14

  structural-gate:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock authoritative TAC Work Rules revision
        id: wr-lock
        shell: bash
        run: |
          git fetch origin main --prune
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            wr_ref="HEAD"
          else
            wr_ref="origin/main"
          fi
          mkdir -p artifacts
          python scripts/tac_wr_lock.py --ref "$wr_ref" --output artifacts/tac-wr-lock.json
          echo "TAC_WR_LOCK_FILE=artifacts/tac-wr-lock.json" >> "$GITHUB_ENV"
          echo "## TAC Work Rules lock" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/tac-wr-lock.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TAC Work Rules lock record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-wr-lock-${{ github.run_id }}
          path: artifacts/tac-wr-lock.json
          if-no-files-found: error

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test TAC Work Rules lock parser
        run: python scripts/tac_wr_lock.py --self-test

      - name: Install snapshot schema validator
        run: python -m pip install jsonschema requests beautifulsoup4

      - name: Test TAC market snapshot schema
        run: python scripts/validate_tac_daily_snapshot.py --self-test

      - name: Test TAC snapshot fragment assembler
        run: python scripts/assemble_tac_daily_snapshot.py --self-test

      - name: Validate and reassemble committed TAC market snapshots
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          snapshots=(data/market/snapshots/*.json)
          if [ ${#snapshots[@]} -eq 0 ]; then
            echo "No dated market snapshots found; skipping."
            exit 0
          fi
          mkdir -p artifacts
          for snapshot in "${snapshots[@]}"; do
            echo "Validating committed snapshot: $snapshot"
            python scripts/validate_tac_daily_snapshot.py --file "$snapshot" --allow-historical-wr
            python - "$snapshot" <<'PY'
          import json, pathlib, sys
          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          fragment = {
              "report_date": source["meta"]["report_date"],
              "trading_date": source["meta"]["trading_date"],
              **{key: source[key] for key in (
                  "global_indices", "sectors", "bonds", "fx", "energy",
                  "precious_metals", "risk_indicators", "fedwatch"
              )}
          }
          pathlib.Path("artifacts/tac-market-snapshot-fragment.json").write_text(
              json.dumps(fragment, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
            output="artifacts/assembled-$(basename "$snapshot")"
            python scripts/assemble_tac_daily_snapshot.py \
              --report-date "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["meta"]["report_date"])' "$snapshot")" \
              --trading-date "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["meta"]["trading_date"])' "$snapshot")" \
              --fragment artifacts/tac-market-snapshot-fragment.json \
              --output "$output"
            python scripts/validate_tac_daily_snapshot.py --file "$output"
            python - "$snapshot" "$output" <<'PY'
          import json, pathlib, sys
          source = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assembled = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          groups = (
              "global_indices", "sectors", "bonds", "fx", "energy",
              "precious_metals", "risk_indicators", "fedwatch"
          )
          for key in groups:
              if source[key] != assembled[key]:
                  raise SystemExit(f"FAIL: assembled {key} differs from committed snapshot")
          print("PASS: committed market data preserved through official assembler")
          PY
          done

      - name: Validate market-field contract against both approved masters
        run: |
          python scripts/validate_tac_market_mapping.py --html "母版專區/TAC_母版_週一_2026-10-28_最終定版.html"
          python scripts/validate_tac_market_mapping.py --html "母版專區/TAC_母版_週二至週五_2026-10-28_最終定版.html"

      # Re-run on binding validator revisions as well as mapping changes.
      - name: Validate snapshot-to-HTML binding slots in both approved mothers
        run: python scripts/validate_tac_html_binding.py

      - name: Test Treasury collector parser
        run: python scripts/fetch_tac_treasury_yields.py --self-test

      - name: Test documented FRED Treasury fallback collector
        run: python scripts/fetch_tac_treasury_fred_fallback.py --self-test

      - name: Test Investing.com HK global indices collector
        run: python scripts/fetch_tac_global_indices.py --self-test

      - name: Test Investing.com HK 11 sector ETF collector
        run: python scripts/fetch_tac_sector_etfs.py --self-test

      # Live source collection is exercised by the dedicated manual source-probe
      # workflow; structural validation remains deterministic and network-independent.

      # Live market-source probes belong to the production data-collection step,
      # not this deterministic structural gate. Avoid stale fixed-date network reads here.

      - name: Self-test DOM layout contract
        run: python scripts/validate_tac_layout_contract.py --self-test

      - name: Validate dated report structure
        run: python scripts/validate_tac_report.py --changed-only

      - name: Detect changed canonical preview
        id: preview
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          report="$(printf '%s\n' "$changed" | grep -E '^preview/20[0-9]{2}-[0-9]{2}-[0-9]{2}\.html$' | head -n 1 || true)"
          echo "path=$report" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for browser regression
        if: steps.preview.outputs.path != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        if: steps.preview.outputs.path != ''
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile layout regression
        if: steps.preview.outputs.path != ''
        env:
          REPORT_PATH: ${{ steps.preview.outputs.path }}
        run: node scripts/tac_browser_layout_regression.mjs --report "$REPORT_PATH" --output artifacts/tac-layout

      - name: Upload layout regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-layout-regression-${{ github.run_id }}
          path: artifacts/tac-layout/
          if-no-files-found: warn

      - name: Open or update failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const title = `TAC report validation failed: ${sha.slice(0, 7)}`;
            const body = [
              "## TAC Daily Report Structural Gate failed",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${sha}`,
              `- Branch: ${context.ref}`,
              `- Event: ${context.eventName}`,
              "",
              "Do not treat this report as ready for review and do not deploy it.",
              "Inspect the failed job logs, correct the underlying report or validator issue, then rerun the gate."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const match = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
              core.info(`Updated existing failure issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created failure issue #${created.data.number}`);
            }
