name: TAC Daily Report Structural Gate

on:
  push:
    branches: ["main"]
    paths:
      - "2026-*.html"
      - "review/2026-*-review.html"
      - "preview/2026-*.html"
      - "demo-2026-10-26.html"
      - "scripts/validate_tac_report.py"
      - "scripts/validate_tac_layout_contract.py"
      - "scripts/validate_tac_daily_snapshot.py"
      - "scripts/assemble_tac_daily_snapshot.py"
      - "scripts/render_tac_daily_report.py"
      - "scripts/validate_tac_market_mapping.py"
      - "scripts/tac_market_field_map.json"
      - "scripts/validate_tac_html_binding.py"
      - "scripts/tac_html_binding_map.json"
      - "母版專區/mother-template-manifest.json"
      - "母版專區/母版結構驗收清單.md"
      - "scripts/fetch_tac_treasury_yields.py"
      - "scripts/fetch_tac_treasury_fred_fallback.py"
      - "scripts/fetch_tac_global_indices.py"
      - "schemas/tac-daily-market-snapshot.schema.json"
      - "scripts/tac_browser_layout_regression.mjs"
      - ".github/workflows/tac-report-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "2026-*.html"
      - "review/2026-*-review.html"
      - "preview/2026-*.html"
      - "demo-2026-10-26.html"
      - "scripts/validate_tac_report.py"
      - "scripts/validate_tac_layout_contract.py"
      - "scripts/validate_tac_daily_snapshot.py"
      - "scripts/validate_tac_market_mapping.py"
      - "scripts/tac_market_field_map.json"
      - "scripts/validate_tac_html_binding.py"
      - "scripts/tac_html_binding_map.json"
      - "母版專區/mother-template-manifest.json"
      - "母版專區/母版結構驗收清單.md"
      - "scripts/fetch_tac_treasury_yields.py"
      - "scripts/fetch_tac_treasury_fred_fallback.py"
      - "scripts/fetch_tac_global_indices.py"
      - "schemas/tac-daily-market-snapshot.schema.json"
      - "scripts/tac_browser_layout_regression.mjs"
      - ".github/workflows/tac-report-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot schema validator
        run: python -m pip install jsonschema requests beautifulsoup4

      - name: Test TAC market snapshot schema
        run: python scripts/validate_tac_daily_snapshot.py --self-test

      - name: Test TAC snapshot fragment assembler
        run: python scripts/assemble_tac_daily_snapshot.py --self-test

      - name: Test TAC snapshot HTML renderer against both approved mothers
        run: python scripts/render_tac_daily_report.py --self-test

      - name: Validate market-field contract against both approved masters
        run: |
          python scripts/validate_tac_market_mapping.py --html "母版專區/TAC_母版_週一_2026-10-28_最終定版.html"
          python scripts/validate_tac_market_mapping.py --html "母版專區/TAC_母版_週二至週五_2026-10-28_最終定版.html"

      # Re-run on binding validator revisions as well as mapping changes.
      - name: Validate snapshot-to-HTML binding slots in both approved mothers
        run: python scripts/validate_tac_html_binding.py

      - name: Test Treasury collector parser
        run: python scripts/fetch_tac_treasury_yields.py --self-test

      - name: Test documented FRED Treasury fallback collector
        run: python scripts/fetch_tac_treasury_fred_fallback.py --self-test

      - name: Test Investing.com HK global indices collector
        run: python scripts/fetch_tac_global_indices.py --self-test

      - name: Optional live read-only probe of 17 indices (non-blocking; retain partial data for audit)
        continue-on-error: true
        run: |
          python scripts/fetch_tac_global_indices.py --trading-date "2026-10-30" --report-date "2026-11-02" --output "/tmp/tac-global-indices-2026-10-30.json"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/tac-global-indices-2026-10-30.json").read_text())
          records = data["global_indices"]
          verified = [k for k, v in records.items() if v["status"] == "verified"]
          pending = [k for k, v in records.items() if v["status"] != "verified"]
          print(f"Live source result: {len(verified)}/17 verified; {len(pending)}/17 pending")
          print("Verified:", ", ".join(verified) or "none")
          print("Pending:", ", ".join(pending) or "none")
          print("Per-index provenance:")
          provenance_errors = []
          for key, record in records.items():
              source = record.get("source") or {}
              print(
                  f"{key}: status={record.get('status')} "
                  f"value={record.get('value')} change={record.get('change')} "
                  f"source={source.get('name')} url={source.get('url')} "
                  f"data_date={source.get('data_date')} "
                  f"quote_type={source.get('quote_type')} "
                  f"instrument={source.get('instrument')} "
                  f"observed_at={source.get('observed_at')} "
                  f"fallback_used={record.get('fallback_used')} "
                  f"fallback_reason={record.get('fallback_reason')}"
              )
              if record.get("status") == "verified":
                  required = ("name", "url", "data_date", "quote_type", "instrument", "observed_at")
                  missing = [field for field in required if not source.get(field)]
                  if missing:
                      provenance_errors.append(f"{key}: missing source fields {missing}")
                  if source.get("data_date") != data["trading_date"]:
                      provenance_errors.append(
                          f"{key}: source date {source.get('data_date')} != "
                          f"fragment trading date {data['trading_date']}"
                      )
                  if record.get("fallback_used") and not record.get("fallback_reason"):
                      provenance_errors.append(f"{key}: fallback used without a recorded reason")
                  if not record.get("fallback_used") and source.get("name") != "Investing.com 香港站":
                      provenance_errors.append(
                          f"{key}: non-primary source marked as primary ({source.get('name')})"
                      )
                  if record.get("fallback_used") and source.get("name") != "Yahoo Finance":
                      provenance_errors.append(
                          f"{key}: unexpected fallback source ({source.get('name')})"
                      )
          if len(records) != 17:
              raise SystemExit(f"Expected 17 index records, found {len(records)}")
          if data.get("report_date") != "2026-11-02":
              provenance_errors.append(f"report_date mismatch: {data.get('report_date')}")
          if data.get("trading_date") != "2026-10-30":
              provenance_errors.append(f"trading_date mismatch: {data.get('trading_date')}")
          if provenance_errors:
              raise SystemExit("Source provenance validation failed: " + "; ".join(provenance_errors))
          if pending:
              raise SystemExit(
                  f"Incomplete live index coverage: {len(verified)}/17 verified; "
                  f"{len(pending)}/17 pending. Partial data is retained for review, "
                  "but the complete-market-data gate must fail."
              )
          if len(verified) != 17:
              raise SystemExit(f"Expected 17 verified indices, found {len(verified)}")
          PY

      - name: Confirm global-index collector rejects incomplete run arguments
        run: |
          if python scripts/fetch_tac_global_indices.py --report-date "2026-11-02" --output "/tmp/should-not-fetch.json" 2> /tmp/tac-source-args.err; then
            echo "FAIL: collector accepted missing trading date"
            exit 1
          fi
          grep -q -- "--trading-date" /tmp/tac-source-args.err
          echo "PASS: collector rejects incomplete run arguments"

      - name: Fetch official Treasury 2Y/10Y/30Y data (read-only test)
        run: |
          python scripts/fetch_tac_treasury_yields.py \
            --trading-date "2026-10-30" \
            --report-date "2026-11-02" \
            --output "/tmp/tac-treasury-yields-2026-10-30.json"

      - name: Assemble verified market fragments into a dated TAC snapshot
        if: success()
        run: |
          python scripts/assemble_tac_daily_snapshot.py \
            --report-date "2026-11-02" \
            --trading-date "2026-10-30" \
            --fragment "/tmp/tac-global-indices-2026-10-30.json" \
            --fragment "/tmp/tac-treasury-yields-2026-10-30.json" \
            --output "/tmp/tac-daily-snapshot-2026-11-02.json"

      - name: Render dated TAC review HTML from the approved Monday mother
        if: success()
        run: |
          python scripts/render_tac_daily_report.py \
            --snapshot "/tmp/tac-daily-snapshot-2026-11-02.json" \
            --output "/tmp/tac-daily-review-2026-11-02.html"

      - name: Upload live market-data probe JSON for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-market-data-probe-${{ github.run_id }}
          path: |
            /tmp/tac-global-indices-2026-10-30.json
            /tmp/tac-treasury-yields-2026-10-30.json
            /tmp/tac-daily-snapshot-2026-11-02.json
            /tmp/tac-daily-review-2026-11-02.html
          if-no-files-found: warn
          retention-days: 14

      - name: Test DOM layout contract
        run: python scripts/validate_tac_layout_contract.py --self-test

      - name: Validate dated report structure
        run: python scripts/validate_tac_report.py --changed-only

      - name: Detect changed canonical preview
        id: preview
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          report="$(printf '%s\n' "$changed" | grep -E '^preview/2026-[0-9]{2}-[0-9]{2}\.html$' | head -n 1 || true)"
          echo "path=$report" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for browser regression
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile layout regression
        env:
          REPORT_PATH: ${{ steps.preview.outputs.path }}
        run: |
          if [ -z "$REPORT_PATH" ]; then
            REPORT_PATH="母版專區/TAC_母版_週二至週五_2026-10-28_最終定版.html"
          fi
          node scripts/tac_browser_layout_regression.mjs --report "$REPORT_PATH" --output artifacts/tac-layout

      - name: Upload layout regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-layout-regression-${{ github.run_id }}
          path: artifacts/tac-layout/
          if-no-files-found: warn

      - name: Open or update failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const title = `TAC report validation failed: ${sha.slice(0, 7)}`;
            const body = [
              "## TAC Daily Report Structural Gate failed",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${sha}`,
              `- Branch: ${context.ref}`,
              `- Event: ${context.eventName}`,
              "",
              "Do not treat this report as ready for review and do not deploy it.",
              "Inspect the failed job logs, correct the underlying report or validator issue, then rerun the gate."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const match = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
              core.info(`Updated existing failure issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created failure issue #${created.data.number}`);
            }
