name: TAC Daily Report Structural Gate

on:
  push:
    branches: ["main"]
    paths:
      - "2026-*.html"
      - "review/2026-*-review.html"
      - "preview/2026-*.html"
      - "demo-2026-10-26.html"
      - "scripts/validate_tac_report.py"
      - ".github/workflows/tac-report-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "2026-*.html"
      - "review/2026-*-review.html"
      - "preview/2026-*.html"
      - "demo-2026-10-26.html"
      - "scripts/validate_tac_report.py"
      - ".github/workflows/tac-report-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dated report structure
        run: python scripts/validate_tac_report.py

      # Keep a durable, deduplicated alert when the structural gate fails.
      # Pages deployment listens for this workflow's success only.
      - name: Open or update failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const title = `TAC report validation failed: ${sha.slice(0, 7)}`;
            const body = [
              "## TAC Daily Report Structural Gate failed",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${sha}`,
              `- Branch: ${context.ref}`,
              `- Event: ${context.eventName}`,
              "",
              "Do not treat this report as ready for review and do not deploy it.",
              "Inspect the failed job logs, correct the underlying report or validator issue, then rerun the gate."
            ].join("\\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const match = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body
              });
              core.info(`Updated existing failure issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created failure issue #${created.data.number}`);
            }
