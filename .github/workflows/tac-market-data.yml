name: TAC Market Data Collection (Review Branch)
# Manual refresh requested for 2026-10-27 05:10 Asia/Taipei review; schedule and workflow behavior unchanged.
# Manual rerun trigger 2026-10-26T19:xx+08:00: refresh SOX/VIX/MOVE/CNN/FedWatch snapshots for review.

on:
  push:
    branches:
      - tac-test-2026-10-23
    paths:
      - ".github/workflows/tac-market-data.yml"
      - "scripts/collect_tac_market_data.py"
      - "scripts/collect_tac_news.py"
      - "scripts/capture_fedwatch.mjs"
  workflow_dispatch:
  schedule:
    # 04:10 Taiwan time, Mon-Fri (20:10 UTC, previous day)
    - cron: "10 20 * * 0-4"

permissions:
  contents: write

concurrency:
  group: tac-market-data-review
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: tac-test-2026-10-23
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --upgrade pip requests
      - name: Collect market indicators and key levels
        id: collect
        continue-on-error: true
        run: python scripts/collect_tac_market_data.py
      - name: Set up Node.js for FedWatch rendered fallback
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser for FedWatch evidence
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture rendered CME FedWatch page and embedded frames
        id: fedwatch_browser
        continue-on-error: true
        run: node scripts/capture_fedwatch.mjs
      - name: Collect Cnyes news candidates
        id: news
        continue-on-error: true
        run: python scripts/collect_tac_news.py
      - name: Commit market and news snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tac_market_snapshot.json
          if [ -f data/tac_news_snapshot.json ]; then git add data/tac_news_snapshot.json; fi
          if [ -f data/fedwatch_snapshot.html ]; then git add data/fedwatch_snapshot.html; fi
          git diff --cached --quiet || git commit -m "Collect TAC market and Cnyes news snapshots"
          git push
      - name: Upload FedWatch browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-fedwatch-browser-evidence
          path: data/fedwatch-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail run if market validation incomplete
        if: steps.collect.outcome != 'success'
        run: |
          echo "Collection incomplete; inspect data/tac_market_snapshot.json and workflow logs."
          exit 1
      - name: Fail run if news collection unavailable
        if: steps.news.outcome != 'success'
        run: |
          echo "News collection unavailable; inspect data/tac_news_snapshot.json and workflow logs."
          exit 1
