name: TAC Market Data Collection (Review Branch)

on:
  workflow_dispatch:
  schedule:
    # 04:10 Taiwan time, Mon-Fri (20:10 UTC, previous day)
    - cron: "10 20 * * 0-4"

permissions:
  contents: write

concurrency:
  group: tac-market-data-review
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: tac-test-2026-10-23
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --upgrade pip requests
      - name: Collect market indicators and key levels
        id: collect
        continue-on-error: true
        run: python scripts/collect_tac_market_data.py
      - name: Commit dated snapshot and FedWatch source snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tac_market_snapshot.json
          if [ -f data/fedwatch_snapshot.html ]; then git add data/fedwatch_snapshot.html; fi
          git diff --cached --quiet || git commit -m "Collect TAC market data snapshot"
          git push
      - name: Fail run if validation incomplete
        if: steps.collect.outcome != 'success'
        run: |
          echo "Collection incomplete; inspect data/tac_market_snapshot.json and workflow logs."
          exit 1
