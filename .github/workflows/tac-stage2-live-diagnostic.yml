name: TAC Stage 2 live 44-row diagnostic
on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - .github/workflows/tac-stage2-live-diagnostic.yml
      - simulation-lab/runner/stage2_market_fixture_bootstrap.py
      - simulation-lab/runner/test_stage2_market_fixture_bootstrap.py
      - simulation-lab/runner/browser_verify_market_history.py
      - simulation-lab/runner/validate_market_snapshot.py
      - simulation-lab/runner/test_validate_market_snapshot.py
      - simulation-lab/runner/validate_chatgpt_web_observations.py
      - simulation-lab/runner/test_validate_chatgpt_web_observations.py
  workflow_dispatch:
    inputs:
      report_date:
        description: "Taiwan report date YYYY-MM-DD"
        required: true
        default: "2026-11-26"
        type: string
permissions:
  contents: read
concurrency:
  group: tac-stage2-live-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stage2-live-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Simulation branch only
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Stage 2 dependencies
        run: python -m pip install --disable-pip-version-check playwright
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Confirm date-matched fixture and screenshot sidecar
        id: inputs
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date || '2026-11-26' }}
        run: |
          set -euo pipefail
          FIXTURE="simulation-lab/fixtures/report-data-${REPORT_DATE}.json"
          test -f "$FIXTURE" || { echo "Missing fixture: $FIXTURE"; exit 1; }
          python - "$FIXTURE" "$REPORT_DATE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d.get("report_date")==sys.argv[2], "fixture report_date mismatch"
          assert d.get("trading_date"), "fixture trading_date missing"
          print("report_date="+d["report_date"])
          print("trading_date="+d["trading_date"])
          PY
          SIDE_CAR="simulation-lab/input/market-screenshot-observations-${REPORT_DATE}.json"
          if [[ -f "$SIDE_CAR" ]]; then
            echo "screenshot_sidecar=present" >> "$GITHUB_OUTPUT"
          else
            echo "screenshot_sidecar=absent" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p simulation-lab/output/stage2-diagnostic
      - name: Test zero-value Stage 2 fixture bootstrap
        run: python simulation-lab/runner/test_stage2_market_fixture_bootstrap.py
      - name: Test direct web observations against blank market inputs
        run: python simulation-lab/runner/test_validate_chatgpt_web_observations.py
      - name: Test pending and closed market snapshot states
        run: python simulation-lab/runner/test_validate_market_snapshot.py
      - name: Create zero-value 44-row market input
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date || '2026-11-26' }}
        run: |
          set -euo pipefail
          python simulation-lab/runner/stage2_market_fixture_bootstrap.py blank \
            --data "simulation-lab/fixtures/report-data-${REPORT_DATE}.json" \
            --output simulation-lab/output/stage2-diagnostic/report-data-blank.json
      - name: Run direct Investing.com Historical Data browser capture
        id: capture
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date || '2026-11-26' }}
        run: |
          set -euo pipefail
          python simulation-lab/runner/browser_verify_market_history.py \
            --fixture "simulation-lab/output/stage2-diagnostic/report-data-blank.json" \
            --report-date "$REPORT_DATE" \
            --output simulation-lab/output/stage2-diagnostic/market-history-browser-observations.json \
            --timeout-ms 15000 --concurrency 2
      - name: Populate fresh market Fixture from current-run observations
        shell: bash
        run: |
          set -euo pipefail
          python simulation-lab/runner/stage2_market_fixture_bootstrap.py apply \
            --data simulation-lab/output/stage2-diagnostic/report-data-blank.json \
            --observations simulation-lab/output/stage2-diagnostic/market-history-browser-observations.json \
            --output simulation-lab/output/stage2-diagnostic/report-data-populated.json
      - name: Build 44-row source manifest
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date || '2026-11-26' }}
        run: |
          set -euo pipefail
          python simulation-lab/runner/build_market_source_verification_manifest.py \
            --data simulation-lab/output/stage2-diagnostic/report-data-populated.json \
            --report-date "$REPORT_DATE" \
            --observations simulation-lab/output/stage2-diagnostic/market-history-browser-observations.json \
            --output simulation-lab/output/stage2-diagnostic/market-source-verification-manifest.json
      - name: Validate 44-row market snapshot
        shell: bash
        env:
          REPORT_DATE: ${{ inputs.report_date || '2026-11-26' }}
        run: |
          set -euo pipefail
          python simulation-lab/runner/validate_market_snapshot.py \
            --data simulation-lab/output/stage2-diagnostic/report-data-populated.json \
            --report-date "$REPORT_DATE" \
            --output simulation-lab/output/stage2-diagnostic/market-snapshot-audit.json
      - name: Emit Stage 2 diagnostic summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("simulation-lab/output/stage2-diagnostic/market-history-browser-observations.json")
          if p.exists():
              d=json.loads(p.read_text(encoding="utf-8"))
              print(json.dumps({
                  "report_date":d.get("report_date"),
                  "trading_date":d.get("trading_date"),
                  "row_count":d.get("row_count"),
                  "verified_count":d.get("verified_count"),
                  "status_counts":d.get("status_counts"),
                  "screenshot_only_count":d.get("screenshot_only_count"),
                  "mixed_field_count":d.get("mixed_field_count"),
                  "historical_page_read_count":d.get("historical_page_read_count"),
              },ensure_ascii=False,indent=2))
          else:
              print("No observation bundle was produced.")
          PY
      - name: Upload Stage 2 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-stage2-diagnostic-${{ inputs.report_date || '2026-11-26' }}
          path: |
            simulation-lab/output/stage2-diagnostic/
            simulation-lab/output/stage2-diagnostic/report-data-blank.json
            simulation-lab/output/stage2-diagnostic/report-data-populated.json
          if-no-files-found: warn
          retention-days: 14
