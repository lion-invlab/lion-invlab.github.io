name: TAC Live Source Probe - Isolated Draft Branch

on:
  push:
    branches:
      - tac-json-html-renderer-2026-10-31
    paths:
      - ".github/workflows/tac-live-source-probe-branch.yml"
      - "scripts/fetch_tac_global_indices.py"
      - "scripts/fetch_tac_sector_etfs.py"
      - "scripts/fetch_tac_treasury_yields.py"
      - "scripts/fetch_tac_fx.py"
      - "scripts/fetch_tac_risk_indicators.py"
      - "scripts/fetch_tac_commodities.py"

permissions:
  contents: read

concurrency:
  group: tac-live-source-probe-draft-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated draft branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Validate collector parsers
        run: |
          python scripts/fetch_tac_global_indices.py --self-test
          python scripts/fetch_tac_sector_etfs.py --self-test
          python scripts/fetch_tac_fx.py --self-test
          python scripts/fetch_tac_risk_indicators.py --self-test
          python scripts/fetch_tac_commodities.py --self-test
      - name: Retrieve exact-date Investing.com HK global indices
        run: |
          python scripts/fetch_tac_global_indices.py \
            --trading-date "2026-10-30" \
            --report-date "2026-11-02" \
            --output "artifacts/tac-global-indices-2026-10-30.json"
      - name: Retrieve exact-date Investing.com HK 11 sector ETFs
        run: |
          python scripts/fetch_tac_sector_etfs.py \
            --trading-date "2026-10-30" \
            --report-date "2026-11-02" \
            --output "artifacts/tac-sector-etfs-2026-10-30.json"
      - name: Retrieve official U.S. Treasury 2Y/10Y/30Y yields
        run: |
          python scripts/fetch_tac_treasury_yields.py \
            --trading-date "2026-10-30" \
            --report-date "2026-11-02" \
            --output "artifacts/tac-treasury-yields-2026-10-30.json"
      - name: Retrieve exact-date FX DXY and five currency pairs
        run: |
          python scripts/fetch_tac_fx.py \
            --trading-date "2026-10-30" \
            --report-date "2026-11-02" \
            --output "artifacts/tac-fx-2026-10-30.json"
      - name: Retrieve VIX MOVE and CNN Fear and Greed
        run: |
          python scripts/fetch_tac_risk_indicators.py \
            --trading-date "2026-10-30" \
            --report-date "2026-11-02" \
            --output "artifacts/tac-risk-indicators-2026-10-30.json"
      - name: Retrieve WTI Brent GC and SI futures data
        run: |
          python scripts/fetch_tac_commodities.py \
            --trading-date "2026-10-30" \
            --report-date "2026-11-02" \
            --output "artifacts/tac-commodities-2026-10-30.json"
      - name: Upload source fragments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-live-source-probe-2026-10-30
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 7
