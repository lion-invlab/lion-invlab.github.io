name: Probe MacroMicro FedWatch Source

on:
  push:
    branches:
      - test/cme-fedwatch-probe
    paths:
      - ".github/workflows/macromicro-fedwatch-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macromicro-fedwatch-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public MacroMicro series and chart pages
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          for url in \
            "https://en.macromicro.me/series/484/probability-fed-rate" \
            "https://www.macromicro.me/charts/77/probability-fed-rate-hike" \
            "https://en.macromicro.me/macro/us"; do
            echo "===== URL: $url ====="
            curl --http1.1 -L --max-time 20 -sS -A "Mozilla/5.0" -D artifacts/headers.txt -o artifacts/page.html -w "http_code=%{http_code} final_url=%{url_effective} bytes=%{size_download}\n" "$url"
            echo "--- likely data/API references ---"
            grep -Eo 'https?[^" ]+|/api/[^" ]+|/series/[^" ]+|[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,3}\.[0-9]{1,2} ?%' artifacts/page.html | grep -Ei 'api|series|probab|2026-|%' | head -n 25
            echo "--- page text matches ---"
            grep -ioE '.{0,90}(FedWatch|Rate Hike Probability|Latest Stats|22\.70%|31\.50%).{0,120}' artifacts/page.html | head -n 10
          done
          echo "Probe complete; pages are public webpage probes only, no account credentials used."
          