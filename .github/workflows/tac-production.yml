name: TAC main-native production pipeline

on:
  schedule:
    # 04:45 Asia/Taipei, Monday-Friday (UTC Sunday-Thursday).
    - cron: "45 20 * * 0-4"
  push:
    branches: [main]
    paths:
      - "production/**"
      - ".github/workflows/tac-production.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate, capture Stages 1-3, or build Stages 4-6 from the exact captured Run."
        required: true
        default: validate
        type: choice
        options: [validate, capture, build]
      report_date:
        description: "台灣報告日期 YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tac-main-production
  cancel-in-progress: false

jobs:
  validate-main-production:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[build-tac-report:')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record main-only provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          if grep -RIlE 'simulation-lab/|simulation/tac-process-lab-2026-11-06' --include='*.py' --include='*.mjs' production/runner | grep -q .; then
            echo "Production runtime contains a Simulation path dependency." >&2
            grep -RIlE 'simulation-lab/|simulation/tac-process-lab-2026-11-06' --include='*.py' --include='*.mjs' production/runner || true
            exit 1
          fi
          echo "MAIN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Main-only checkout verified: $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 lxml jsonschema pandas yfinance pandas-market-calendars playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile main production modules
        env:
          PYTHONPATH: production/runner
        run: python -m compileall -q production/runner

      - name: Syntax-check browser QA modules
        run: |
          node --check production/runner/visual_regression.mjs
          node --check production/runner/interaction_smoke.mjs

      - name: Validate SHA-locked production mothers and manifest
        env:
          PYTHONPATH: production/runner
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'production/config/mother-template-manifest.json').read_text(encoding='utf-8'))
          for key, path in [('monday','production/templates/monday-mother-template.html'),('weekdays','production/templates/weekday-mother-template.html')]:
              raw=(root/path).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
              expected=manifest['templates'][key]['blob_sha']
              assert blob==expected, (key,blob,expected)
          print('PASS: production mother blob SHA matches Manifest')
          PY
          python production/runner/validate_dual_mothers.py

      - name: Run Stage 2 and pre-build deterministic tests
        env:
          PYTHONPATH: production/runner
        run: |
          python -m unittest -v \
            test_create_run_fixture \
            test_stage3_calendar_projection \
            test_prepare_stage4_research_bundle \
            test_stage4_content_validation \
            test_stage4_sim_compatibility \
            test_stage2_market_fixture_bootstrap \
            test_stage2_screenshot_inputs \
            test_validate_chatgpt_web_observations \
            test_market_source_verification_manifest \
            test_build_stage2_receipt \
            test_validate_market_snapshot \
            test_quote_type_guard \
            test_stage2_field_provenance \
            test_browser_http_classification \
            test_sp500_chart3_handoff \
            test_prebuild_stage_inputs

      - name: Run Builder and earnings deterministic tests
        env:
          PYTHONPATH: production/runner
        run: |
          python -m unittest -v \
            test_builder_output_guard \
            test_builder_calendar_panel_preservation \
            test_earnings_card_dom_preservation \
            test_earnings_health_dom_preservation \
            test_earnings_judgment_engine \
            test_earnings_schema_audit \
            test_report_layer_earnings_status \
            test_summary_headline \
            test_market_analysis_slots \
            test_fear_greed_marker \
            test_builder_approval \
            test_stage56_handoff

      - name: Run full candidate Builder against isolated test fixtures
        env:
          PYTHONPATH: production/runner
        run: python production/runner/test_full_candidate_builder.py

      - name: Verify mother-owned DOM contract on generated candidates
        env:
          PYTHONPATH: production/runner
        run: |
          python production/runner/validate_mother_dom_contract.py \
            --mother production/templates/monday-mother-template.html \
            --report production/runs/candidate-validation/2026-11-23-candidate.html \
            --template monday
          python production/runner/validate_mother_dom_contract.py \
            --mother production/templates/weekday-mother-template.html \
            --report production/runs/candidate-validation/2026-11-20-candidate.html \
            --template weekdays

      - name: Upload main production validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-main-production-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production/runs/candidate-validation/
          if-no-files-found: warn
          retention-days: 14

  capture-and-calendar:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'capture') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: write
    concurrency:
      group: tac-main-production-build
      cancel-in-progress: false
    steps:
      - name: Checkout main only with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Stage 1-3 dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 lxml jsonschema pandas yfinance pandas-market-calendars playwright
          python -m playwright install --with-deps chromium
      - name: Resolve report date and unique Run ID
        shell: bash
        env:
          REQUESTED_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_REPORT_DATE:-}" ]; then REPORT_DATE="$REQUESTED_REPORT_DATE"; else REPORT_DATE="$(TZ=Asia/Taipei date +%F)"; fi
          [[ "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          RUN_ID="TAC-$REPORT_DATE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RUN_DIR="production/runs/$RUN_ID"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - name: Stage 1 — create a fresh blank-first Run
        run: |
          set -euo pipefail
          python production/runner/create_run_fixture.py --report-date "$REPORT_DATE" --run-id "$RUN_ID"
          test -s "$RUN_DIR/run-context.json"
          test -s "$RUN_DIR/report-data.json"
          test -s "$RUN_DIR/stage1-receipt.json"
      - name: Stage 2 — capture 44 market indicators with four-page concurrency
        run: |
          set -euo pipefail
          python production/runner/run_stage2.py --run-dir "$RUN_DIR" --concurrency 4
          test -s "$RUN_DIR/stage2-market-snapshot-receipt.json"
          test -s "$RUN_DIR/stage2-run-summary.json"
      - name: Commit only verified S&P 500 Chart 3 increment and dispatch merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="data/tac-chart3/sp500_daily_increment.jsonl"
          if ! git status --porcelain -- "$LEDGER" | grep -q .; then
            echo "No new verified S&P 500 increment; Chart 3 handoff is a no-op."
            echo "CHART3_MERGE_RUN_ID=NOT_REQUIRED" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$LEDGER"
          mapfile -t STAGED < <(git diff --cached --name-only)
          test "${#STAGED[@]}" -eq 1 && test "${STAGED[0]}" = "$LEDGER"
          git commit -m "data(chart3): verified S&P 500 increment $REPORT_DATE"
          git push origin HEAD:main
          CHART3_COMMIT="$(git rev-parse HEAD)"
          BEFORE_IDS="$(gh api "repos/lion-invlab/lion-invlab.github.io/actions/workflows/tac-chart3-sp500-increment-merge.yml/runs?branch=main&per_page=30" --jq '[.workflow_runs[].id]')"
          gh api -X POST "repos/lion-invlab/lion-invlab.github.io/actions/workflows/tac-chart3-sp500-increment-merge.yml/dispatches" -f ref=main
          export CHART3_COMMIT BEFORE_IDS
          python - <<'PY'
          import json, os, subprocess, time
          repo="lion-invlab/lion-invlab.github.io"
          old=set(json.loads(os.environ["BEFORE_IDS"]))
          target=os.environ["CHART3_COMMIT"]
          deadline=time.time()+1800
          selected=None
          while time.time()<deadline:
              raw=subprocess.check_output(["gh","api",f"repos/{repo}/actions/workflows/tac-chart3-sp500-increment-merge.yml/runs?branch=main&per_page=30"],text=True)
              matches=[r for r in json.loads(raw).get("workflow_runs",[]) if r.get("id") not in old and r.get("head_sha")==target and r.get("event")=="workflow_dispatch"]
              if matches:
                  selected=sorted(matches,key=lambda r:r.get("created_at",""),reverse=True)[0]
                  if selected.get("status")=="completed": break
              time.sleep(15)
          if not selected or selected.get("status")!="completed" or selected.get("conclusion")!="success":
              raise SystemExit("Chart 3 S&P 500 merge workflow did not complete successfully")
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write(f"CHART3_MERGE_RUN_ID={selected['id']}\n")
          print(json.dumps({"status":"PASS","chart3_commit":target,"merge_run_id":selected["id"]}))
          PY
      - name: Fetch latest main after Chart 3 merge
        run: |
          git fetch origin main
          git merge --ff-only origin/main
      - name: Stage 3 — read-only pinned calendar and earnings projection
        run: |
          set -euo pipefail
          python production/runner/run_stage3.py --run-dir "$RUN_DIR"
          test -s "$RUN_DIR/stage3-calendar-receipt.json"
          python production/runner/prepare_stage4_research_bundle.py --run-dir "$RUN_DIR"
          test -s "$RUN_DIR/stage4-research-bundle.json"
          test -s "$RUN_DIR/stage4-research-bundle-receipt.json"
      - name: Create capture handoff receipt
        env:
          CHART3_MERGE_RUN_ID: ${{ env.CHART3_MERGE_RUN_ID }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          run=Path(os.environ["RUN_DIR"])
          context=json.loads((run/"run-context.json").read_text())
          stage2=json.loads((run/"stage2-market-snapshot-receipt.json").read_text())
          summary=json.loads((run/"stage2-run-summary.json").read_text())
          stage3=json.loads((run/"stage3-calendar-receipt.json").read_text())
          receipt={"schema_version":"1.0","status":"AWAITING_EDITORIAL_INPUT",
            "run_id":context["run_id"],"report_date":context["report_date"],
            "market_snapshot_sha256":summary["market_snapshot_sha256"],
            "stage2_status":stage2["status"],"stage2_pending_rows":stage2.get("pending_rows",[]),
            "chart3_handoff":summary.get("chart3_handoff"),
            "research_bundle_path":f"{run.as_posix()}/stage4-research-bundle.json",
            "research_bundle_sha256":json.loads((run/"stage4-research-bundle-receipt.json").read_text())["bundle_sha256"],
            "research_bundle_unresolved_market_rows":json.loads((run/"stage4-research-bundle-receipt.json").read_text())["unresolved_market_rows"],
            "chart3_merge_workflow_run_id":os.environ.get("CHART3_MERGE_RUN_ID","NOT_REQUIRED"),
            "current_week":stage3["current_week"]["week_id"],"previous_week":stage3["previous_week"]["week_id"],
            "editorial_input_path":f"production/input/report-content-{context['report_date']}.json",
            "next_action":"Read stage4-research-bundle.json; generate Stage 4 editorial content bound to run_id, market_snapshot_sha256 and research_bundle_sha256; commit with [build-tac-report:YYYY-MM-DD]."}
          (run/"capture-stage-receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Commit only this Run's Stage 1-3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR"
          mapfile -t STAGED < <(git diff --cached --name-only)
          test "${#STAGED[@]}" -gt 0
          for path in "${STAGED[@]}"; do
            [[ "$path" == "$RUN_DIR/"* ]] || { echo "Unexpected staged path: $path" >&2; exit 1; }
          done
          git commit -m "data(tac-production): capture Stage 1-3 $REPORT_DATE $RUN_ID"
          git push origin HEAD:main
      - name: Upload Stage 1-3 Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-main-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: warn
          retention-days: 30

  build-and-deliver:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'build') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-tac-report:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: write
    concurrency:
      group: tac-main-production-build
      cancel-in-progress: false
    steps:
      - name: Checkout main only with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 lxml jsonschema pandas yfinance pandas-market-calendars playwright
          python -m playwright install --with-deps chromium
          npm install --no-save playwright
          npx playwright install chromium
      - name: Resolve report date and exact captured Run
        shell: bash
        env:
          REQUESTED_REPORT_DATE: ${{ inputs.report_date }}
          TRIGGER_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_REPORT_DATE:-}" ]; then REPORT_DATE="$REQUESTED_REPORT_DATE"
          elif [[ "${TRIGGER_COMMIT_MESSAGE:-}" =~ \[build-tac-report:([0-9]{4}-[0-9]{2}-[0-9]{2})\] ]]; then REPORT_DATE="${BASH_REMATCH[1]}"
          else echo "::error::Build requires report_date or [build-tac-report:YYYY-MM-DD] marker."; exit 1; fi
          [[ "$REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          CONTENT_FILE="production/input/report-content-$REPORT_DATE.json"
          test -s "$CONTENT_FILE"
          RUN_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["run_id"])' "$CONTENT_FILE")"
          RUN_DIR="production/runs/$RUN_ID"
          for file in run-context.json report-data.json stage2-market-snapshot-receipt.json stage2-run-summary.json stage3-calendar-receipt.json capture-stage-receipt.json stage4-research-bundle.json stage4-research-bundle-receipt.json; do test -s "$RUN_DIR/$file"; done
          python - "$CONTENT_FILE" "$RUN_DIR" "$REPORT_DATE" <<'PY'
          import json,sys
          content=json.load(open(sys.argv[1],encoding="utf-8")); run_dir=sys.argv[2]; date=sys.argv[3]
          context=json.load(open(run_dir+"/run-context.json",encoding="utf-8"))
          summary=json.load(open(run_dir+"/stage2-run-summary.json",encoding="utf-8"))
          capture=json.load(open(run_dir+"/capture-stage-receipt.json",encoding="utf-8"))
          bundle=json.load(open(run_dir+"/stage4-research-bundle-receipt.json",encoding="utf-8"))
          assert content["report_date"]==date==context["report_date"]
          assert content["run_id"]==context["run_id"]
          assert content["market_snapshot_sha256"]==summary["market_snapshot_sha256"]
          assert content["research_bundle_sha256"]==bundle["bundle_sha256"]==capture["research_bundle_sha256"]
          print("PASS: Stage 4 editorial content is bound to exact captured Run, market snapshot and research bundle.")
          PY
          git cat-file -e "HEAD:$RUN_DIR/run-context.json"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "CONTENT_FILE=$CONTENT_FILE" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - name: Stage 4 — validate and merge current editorial research
        run: |
          set -euo pipefail
          python production/runner/run_stage4.py --run-dir "$RUN_DIR" --content "$CONTENT_FILE"
          test -s "$RUN_DIR/stage4-analysis-receipt.json"
      - name: Stage 5 — build exact mother and run full QA
        run: |
          set -euo pipefail
          python production/runner/run_stage5.py --run-dir "$RUN_DIR"
          test -s "$RUN_DIR/stage5-render-qa-receipt.json"
      - name: Stage 6 — deliver three preview files and verify Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python production/runner/run_stage6.py --run-dir "$RUN_DIR"
      - name: Upload complete Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-main-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: warn
          retention-days: 30
