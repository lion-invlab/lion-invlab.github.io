name: TAC main-native production pipeline

on:
  schedule:
    # Stage 1 starts 15 minutes before the Stage 2 worker: 03:45 Taiwan summer / 04:45 winter.
    - cron: "45 19 * * 1-5"
    - cron: "45 20 * * 1-5"
  push:
    branches: [main, "refactor/**"]
    paths:
      # Push events validate Main code and contracts only; production delivery is one scheduled / recover workflow run.
      # Run-scoped Stage artifacts are consumed by the active capture and delivery jobs, not push triggers.
      - "production/MASTER_WR.md"
      - "production/runner/**"
      - "production/stages/**"
      - "production/contracts/**"
      - "production/config/**"
      - "production/templates/**"
      - "production/input/*.schema.json"
      - "production/input/STAGE4_README.md"
      - ".github/workflows/tac-production.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate, run scheduled capture, manually recover a missed report date, or build Stages 4-6 from the exact captured Run."
        required: true
        default: validate
        type: choice
        options: [validate, recover, rerun]
      report_date:
        description: "台灣報告日期 YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tac-main-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-main-production:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the requested production ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record production-ref provenance
        shell: bash
        env:
          VALIDATION_BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$VALIDATION_BRANCH" in
            main|refactor/*) ;;
            *) echo "Production validation is limited to main and refactor branches." >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if grep -RIlE 'simulation-lab/|simulation/tac-process-lab-2026-11-06' --include='*.py' --include='*.mjs' production/runner | grep -q .; then
            echo "Production runtime contains a Simulation path dependency." >&2
            grep -RIlE 'simulation-lab/|simulation/tac-process-lab-2026-11-06' --include='*.py' --include='*.mjs' production/runner || true
            exit 1
          fi
          echo "MAIN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Production ref verified ($VALIDATION_BRANCH): $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 lxml jsonschema pandas yfinance pandas-market-calendars playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile main production modules
        env:
          PYTHONPATH: production/runner
        run: python -m compileall -q production/runner

      - name: Syntax-check browser QA modules
        run: |
          node --check production/runner/visual_regression.mjs
          node --check production/runner/interaction_smoke.mjs

      - name: Validate SHA-locked production mothers and manifest
        env:
          PYTHONPATH: production/runner
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'production/config/mother-template-manifest.json').read_text(encoding='utf-8'))
          for key, path in [('monday','production/templates/monday-mother-template.html'),('weekdays','production/templates/weekday-mother-template.html')]:
              raw=(root/path).read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\x00'+raw).hexdigest()
              expected=manifest['templates'][key]['blob_sha']
              assert blob==expected, (key,blob,expected)
          print('PASS: production mother blob SHA matches Manifest')
          PY
          python production/runner/validate_dual_mothers.py

      - name: Run Stage 2 and pre-build deterministic tests
        env:
          PYTHONPATH: production/runner
        run: |
          python -m unittest -v \
            test_create_run_fixture \
            test_run_state \
            test_accept_stage_submission \
            test_production_workflow_structure \
            test_stage2_close_wait \
            test_stage_wr_preflight \
            test_stage2_fedwatch \
            test_homepage_publication_lock \
            test_stage3_calendar_projection \
            test_prepare_stage4_research_bundle \
            test_stage4_content_validation \
            test_stage4_sim_compatibility \
            test_stage2_market_fixture_bootstrap \
            test_stage2_screenshot_inputs \
            test_validate_chatgpt_web_observations \
            test_market_source_verification_manifest \
            test_build_stage2_receipt \
            test_validate_market_snapshot \
            test_stage2_field_provenance \
            test_stage2_run_handoff \
            test_stage2_chart3_guard \
            test_browser_http_classification \
            test_sp500_chart3_handoff \
            test_prebuild_stage_inputs
          # Executable assertion scripts are not run by unittest import alone.
          python production/runner/test_stage2_screenshot_inputs.py
          python production/runner/test_validate_chatgpt_web_observations.py
          python production/runner/test_validate_market_snapshot.py
          python production/runner/test_prebuild_stage_inputs.py
          # test_quote_type_guard.py is deferred until the approved Simulation mothers are imported into Main; it currently reads a Simulation-only path unavailable in this main-only checkout.
          python production/runner/test_stage2_field_provenance.py
          # test_browser_http_classification.py belongs to the retired Playwright Stage 2 reader and is intentionally not run.
          python production/runner/test_market_source_verification_manifest.py
          python production/runner/test_build_stage2_receipt.py

      - name: Run Builder and earnings deterministic tests
        env:
          PYTHONPATH: production/runner
        run: |
          python -m unittest -v \
            test_builder_output_guard \
            test_builder_calendar_panel_preservation \
            test_earnings_card_dom_preservation \
            test_earnings_health_dom_preservation \
            test_earnings_judgment_engine \
            test_earnings_schema_audit \
            test_report_layer_earnings_status \
            test_summary_headline \
            test_market_analysis_slots \
            test_fear_greed_marker \
            test_builder_approval \
            test_stage56_handoff \
            test_stage5_scenario_qa

      - name: Run full candidate Builder against isolated test fixtures
        env:
          PYTHONPATH: production/runner
        run: python production/runner/test_full_candidate_builder.py

      - name: Verify mother-owned DOM contract on generated candidates
        env:
          PYTHONPATH: production/runner
        run: |
          python production/runner/validate_mother_dom_contract.py \
            --mother production/templates/monday-mother-template.html \
            --report production/runs/candidate-validation/2026-11-23-candidate.html \
            --template monday
          python production/runner/validate_mother_dom_contract.py \
            --mother production/templates/weekday-mother-template.html \
            --report production/runs/candidate-validation/2026-11-20-candidate.html \
            --template weekdays

      - name: Upload main production validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-main-production-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production/runs/candidate-validation/
          if-no-files-found: warn
          retention-days: 14

  schedule-window:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.dst.outputs.should_run }}
    steps:
      - name: Select the single post-close Taiwan trigger using New York DST
        id: dst
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          ny = now.astimezone(ZoneInfo("America/New_York"))
          expected_cron = "45 19 * * 1-5" if ny.dst() and ny.dst().total_seconds() else "45 20 * * 1-5"
          actual_cron = os.environ.get("SCHEDULE_CRON", "")
          should_run = actual_cron == expected_cron
          print(f"should_run={'true' if should_run else 'false'}")
          print(f"actual_cron={actual_cron}")
          print(f"expected_cron={expected_cron}")
          print(f"new_york_now={ny.isoformat()}")
          PY

  stage1-create-run:
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      report_date: ${{ steps.resolve.outputs.report_date }}
      run_dir: ${{ steps.resolve.outputs.run_dir }}
    needs: [schedule-window]
    if: ${{ github.ref == 'refs/heads/main' && always() && ((github.event_name == 'schedule' && needs['schedule-window'].outputs.should_run == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'recover' || inputs.mode == 'rerun'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main only with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh main before locking Stage 1 inputs
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
      - name: Stage 1 WR preflight before report-date or Run resolution
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "production/runner")
          from stage_wr_preflight import stage_wr_preflight
          evidence = stage_wr_preflight("STAGE_1")
          if evidence.get("status") != "PASS" or evidence.get("wr_loaded") is not True:
              raise SystemExit("Stage 1 WR preflight failed before Run resolution.")
          print(evidence)
          PY

      - name: Resolve report date and unique Run ID
        id: resolve
        shell: bash
        env:
          REQUESTED_REPORT_DATE: ${{ inputs.report_date }}
          DISPATCH_MODE: ${{ inputs.mode || '' }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_MODE" = "rerun" ] || { [ "$DISPATCH_MODE" = "recover" ] && [ -n "${REQUESTED_REPORT_DATE:-}" ]; }; then
            [ -n "${REQUESTED_REPORT_DATE:-}" ] || { echo "::error::Manual recovery/rerun requires an explicit Taiwan report_date (YYYY-MM-DD)."; exit 1; }
            REPORT_DATE="$REQUESTED_REPORT_DATE"
          elif [ -n "${REQUESTED_REPORT_DATE:-}" ]; then
            REPORT_DATE="$REQUESTED_REPORT_DATE"
          else
            REPORT_DATE="$(TZ=Asia/Taipei python - <<'PY'
          from datetime import date, timedelta
          today=date.today()
          if today.weekday()==5:
              # Saturday production creates the following Monday-dated report.
              print((today+timedelta(days=2)).isoformat())
          elif today.weekday() in (1,2,3,4):
              print(today.isoformat())
          else:
              raise SystemExit(f"No scheduled TAC production on Taiwan weekday {today.weekday()}; expected Tuesday-Saturday.")
          PY
          )"
          fi
          SUPERSEDES_RUN_ID="$(python - "$REPORT_DATE" <<'PY'
          import json, sys, os
          from pathlib import Path
          from datetime import date
          target=sys.argv[1]
          try:
              date.fromisoformat(target)
          except ValueError:
              raise SystemExit("Invalid report_date; expected YYYY-MM-DD.")
          matches=[]
          for context_path in Path("production/runs").glob("TAC-*/run-context.json"):
              context=json.loads(context_path.read_text(encoding="utf-8"))
              if context.get("report_date") == target:
                  matches.append(context_path.parent)
          matches.sort(key=lambda p: json.loads((p/"run-context.json").read_text(encoding="utf-8")).get("started_at",""))
          supersedes=""
          sys.path.insert(0, "production/runner")
          from run_state import validate_state
          if matches:
              mode=os.environ.get("DISPATCH_MODE")
              stable_id=f"TAC-{target}-{os.environ.get('GITHUB_RUN_ID','')}"
              same=next((p for p in matches if p.name==stable_id),None)
              if same is not None:
                  state_path=same/"run-state.json"
                  if not state_path.is_file():
                      raise SystemExit(f"Existing same-workflow Run {same.name} has no authoritative run-state; refusing overwrite.")
                  validate_state(json.loads(state_path.read_text(encoding="utf-8")),expected_run_id=stable_id)
                  print("")
                  sys.exit(0)
              # A later Run explicitly supersedes its predecessor. Superseded
              # Runs remain immutable evidence and must never be selected for recovery.
              superseded_ids=set()
              for context_path in matches:
                  context=json.loads(context_path.read_text(encoding="utf-8"))
                  superseded=context.get("supersedes_run_id")
                  if superseded:
                      superseded_ids.add(superseded)
              stateful=[p for p in matches if (p/"run-state.json").is_file() and p.name not in superseded_ids]
              if not stateful:
                  if mode=="recover":
                      raise SystemExit("No stateful Run exists to recover; legacy Runs are read-only and never reused.")
                  print("")
                  sys.exit(0)
              if mode not in ("recover","rerun"):
                  raise SystemExit(f"A stateful Run already exists for {target}; explicit recover/rerun mode is required.")
              if mode == "recover":
                  eligible=[]
                  for candidate in stateful:
                      state=json.loads((candidate/"run-state.json").read_text(encoding="utf-8"))
                      validate_state(state,expected_run_id=candidate.name)
                      if state.get("overall_status") not in ("RUNNING","PARTIAL","FAILED"):
                          continue
                      stages=state.get("stages") or {}
                      if stages.get("STAGE_5",{}).get("status") in ("PASS","PARTIAL") or stages.get("STAGE_6",{}).get("status")=="PASS":
                          continue
                      preview=[Path("preview")/f"{target}-review.html",Path("preview")/f"{target}-review.qa.json",Path("preview")/f"{target}-review.delivery.json"]
                      if any(path.exists() for path in preview):
                          continue
                      eligible.append(candidate)
                  if len(eligible)!=1:
                      raise SystemExit(f"Recovery requires exactly one valid unfinished Run with run-state; found {len(eligible)}.")
                  prior=eligible[0]
                  delivered_files=[
                      Path("preview/main")/f"{target}-review.html",
                      Path("preview/main")/f"{target}-review.qa.json",
                      Path("preview/main")/f"{target}-review.delivery.json"
                  ]
                  if ((prior/"stage5-render-qa-receipt.json").exists()
                      or (prior/"stage6-delivery-receipt.json").exists()
                      or any(path.exists() for path in delivered_files)):
                      raise SystemExit(f"Prior Run {prior.name} has Stage 5/6 or Preview evidence; recover is prohibited.")
              else:
                  if len(stateful)!=1:
                      raise SystemExit(f"Explicit rerun requires exactly one stateful prior Run; found {len(stateful)}.")
                  prior=stateful[0]
              supersedes=prior.name
          print(supersedes)
          PY
          )"
          RUN_ID="TAC-$REPORT_DATE-$GITHUB_RUN_ID"
          RESUME_EXISTING=false
          if [ "$DISPATCH_MODE" = "recover" ] && [ -n "$SUPERSEDES_RUN_ID" ]; then
            RUN_ID="$SUPERSEDES_RUN_ID"
            RESUME_EXISTING=true
            SUPERSEDES_RUN_ID=""
          fi
          RUN_DIR="production/runs/$RUN_ID"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "SUPERSEDES_RUN_ID=$SUPERSEDES_RUN_ID" >> "$GITHUB_ENV"
          echo "RESUME_EXISTING=$RESUME_EXISTING" >> "$GITHUB_ENV"
      - name: Stage 1 — create or resume the exact Run
        run: |
          set -euo pipefail
          if [ "$RESUME_EXISTING" = "true" ]; then
            python production/runner/create_run_fixture.py --report-date "$REPORT_DATE" --run-id "$RUN_ID" --resume-existing
          elif [ -n "${SUPERSEDES_RUN_ID:-}" ]; then
            python production/runner/create_run_fixture.py --report-date "$REPORT_DATE" --run-id "$RUN_ID" --supersedes-run-id "$SUPERSEDES_RUN_ID"
          else
            python production/runner/create_run_fixture.py --report-date "$REPORT_DATE" --run-id "$RUN_ID"
          fi
          test -s "$RUN_DIR/run-context.json"
          test -s "$RUN_DIR/report-data.json"
          test -s "$RUN_DIR/stage1-receipt.json"
          test -s "$RUN_DIR/run-state.json"
      - name: Publish Stage 1 handoff before Stage 2 starts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR/run-context.json" "$RUN_DIR/stage1-fixture.json" "$RUN_DIR/report-data.json" "$RUN_DIR/stage1-receipt.json" "$RUN_DIR/run-state.json"
          if git diff --cached --quiet; then
            echo "Stage 1 Run already exists and is unchanged; no duplicate handoff commit."
            exit 0
          fi
          mapfile -t STAGED < <(git diff --cached --name-only)
          test "${#STAGED[@]}" -eq 5
          for path in "${STAGED[@]}"; do
            [[ "$path" == "$RUN_DIR/"* ]] || { echo "Unexpected Stage 1 path: $path" >&2; exit 1; }
          done
          git commit -m "data(tac-production): initialize Stage 1 $REPORT_DATE $RUN_ID"
          git fetch origin main
          git rebase origin/main
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then PUSHED=true; break; fi
            git fetch origin main
            git rebase origin/main
          done
          test "$PUSHED" = true

  stage2-and-stage3:
    needs: [stage1-create-run]
    if: ${{ always() && needs['stage1-create-run'].result == 'success' }}
    outputs:
      run_id: ${{ needs['stage1-create-run'].outputs.run_id }}
      report_date: ${{ needs['stage1-create-run'].outputs.report_date }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: tac-main-production-build
      cancel-in-progress: false
    env:
      RUN_ID: ${{ needs['stage1-create-run'].outputs.run_id }}
      REPORT_DATE: ${{ needs['stage1-create-run'].outputs.report_date }}
      RUN_DIR: ${{ needs['stage1-create-run'].outputs.run_dir }}
    steps:
      - name: Checkout main for Stage 2 and Stage 3
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh main after Stage 1 handoff
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
      - name: Inspect authoritative Run state before resuming
        id: run-state
        run: |
          python - "$RUN_DIR" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"production/runner")
          from run_state import validate_state
          run=Path(sys.argv[1])
          context=json.loads((run/"run-context.json").read_text(encoding="utf-8"))
          state=json.loads((run/"run-state.json").read_text(encoding="utf-8"))
          validate_state(state,expected_run_id=context["run_id"])
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"stage2_status={state['stages']['STAGE_2']['status']}\n")
              f.write(f"stage3_status={state['stages']['STAGE_3']['status']}\n")
          print(json.dumps({"run_id":state["run_id"],"state_version":state["state_version"],
              "stage2":state["stages"]["STAGE_2"]["status"],"stage3":state["stages"]["STAGE_3"]["status"]},indent=2))
          PY
      - name: Install Stage 2-3 dependencies after Stage 1 handoff
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 lxml jsonschema pandas yfinance pandas-market-calendars playwright
          python -m playwright install --with-deps chromium
      - name: Wait for exact Run-scoped Stage 2 worker handoff
        if: ${{ steps.run-state.outputs.stage2_status != 'PASS' && steps.run-state.outputs.stage2_status != 'PARTIAL' }}
        shell: bash
        run: |
          set -euo pipefail
          # Wait for this Run's trading_date close.
          # A late recovery after that date's close proceeds immediately.
          python production/runner/wait_for_trading_date_close.py "$RUN_DIR/run-context.json"
          OBSERVATION_PATH="$RUN_DIR/market-history-web-observations.json"
          FOUND=false
          for attempt in $(seq 1 30); do
            git fetch origin main
            git merge --ff-only origin/main
            if git cat-file -e "HEAD:$OBSERVATION_PATH" 2>/dev/null; then
              python production/runner/accept_stage_submission.py --run-dir "$RUN_DIR" --stage STAGE_2
              FOUND=true
              break
            fi
            sleep 30
          done
          test "$FOUND" = true || { echo "::error::Stage 2 worker did not publish the exact Run-scoped observation bundle within 15 minutes."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR/run-state.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore(tac): accept Stage 2 Run-bound worker handoff $RUN_ID"
            git fetch origin main
            git rebase origin/main
            PUSHED=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then PUSHED=true; break; fi
              git fetch origin main
              git rebase origin/main
            done
            test "$PUSHED" = true
            git fetch origin main
            git merge --ff-only origin/main
          fi
      - name: Stage 2 — validate and freeze 44 market indicators
        if: ${{ steps.run-state.outputs.stage2_status != 'PASS' && steps.run-state.outputs.stage2_status != 'PARTIAL' }}
        run: |
          set -euo pipefail
          python production/runner/run_stage2.py --run-dir "$RUN_DIR" --concurrency 4
          test -s "$RUN_DIR/stage2-market-snapshot-receipt.json"
          test -s "$RUN_DIR/stage2-run-summary.json"
      - name: Persist Stage 2 snapshot and optional Chart 3 increment
        shell: bash
        run: |
          set -euo pipefail
          LEDGER="data/tac-chart3/sp500_daily_increment.jsonl"
          CHART3_STATUS="$(python - "$RUN_DIR/stage2-run-summary.json" <<'PY'
          import json,sys
          summary=json.load(open(sys.argv[1],encoding="utf-8"))
          print((summary.get("chart3_handoff") or {}).get("status","NOT_REQUIRED"))
          PY
          )"
          if [ "$CHART3_STATUS" = "APPENDED" ] || [ "$CHART3_STATUS" = "NOOP_IDENTICAL_OBSERVATION" ] || [ "$CHART3_STATUS" = "PASS" ]; then
            echo "CHART3_MERGE_STATUS=DEFERRED_UNTIL_AFTER_DELIVERY" >> "$GITHUB_ENV"
          else
            echo "CHART3_MERGE_STATUS=$CHART3_STATUS" >> "$GITHUB_ENV"
            if git ls-files --error-unmatch "$LEDGER" >/dev/null 2>&1; then
              git restore --source=HEAD --staged --worktree -- "$LEDGER"
            else
              rm -f "$LEDGER"
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR"
          if { [ "$CHART3_STATUS" = "APPENDED" ] || [ "$CHART3_STATUS" = "NOOP_IDENTICAL_OBSERVATION" ] || [ "$CHART3_STATUS" = "PASS" ]; } && [ -f "$LEDGER" ]; then git add -- "$LEDGER"; fi
          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -eq 0 ]; then
            echo "Stage 2 already PASS/PARTIAL; no new snapshot or Chart 3 increment to persist."
            exit 0
          fi
          for file in "${STAGED[@]}"; do
            case "$file" in "$RUN_DIR"/*|"$LEDGER") ;; *) echo "::error::Unexpected Stage 2 output path: $file"; exit 1 ;; esac
          done
          git commit -m "data(tac): persist Stage 2 snapshot and optional S&P 500 increment $RUN_ID"
          git fetch origin main
          git rebase origin/main
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then PUSHED=true; break; fi
            git fetch origin main
            git rebase origin/main
          done
          test "$PUSHED" = true
          git fetch origin main
          git merge --ff-only origin/main
      - name: Stage 3 — read-only pinned calendar and earnings projection
        if: ${{ steps.run-state.outputs.stage3_status != 'PASS' }}
        run: |
          set -euo pipefail
          python production/runner/run_stage3.py --run-dir "$RUN_DIR"
          test -s "$RUN_DIR/stage3-calendar-receipt.json"
          python production/runner/prepare_stage4_research_bundle.py --run-dir "$RUN_DIR"
          test -s "$RUN_DIR/stage4-research-bundle.json"
          test -s "$RUN_DIR/stage4-research-bundle-receipt.json"
      - name: Create capture handoff receipt
        env:
          CHART3_MERGE_STATUS: ${{ env.CHART3_MERGE_STATUS }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run=Path(os.environ["RUN_DIR"])
          context=json.loads((run/"run-context.json").read_text())
          stage2=json.loads((run/"stage2-market-snapshot-receipt.json").read_text())
          summary=json.loads((run/"stage2-run-summary.json").read_text())
          stage3=json.loads((run/"stage3-calendar-receipt.json").read_text())
          wr_path=Path("production/stages/STAGE_4_NEWS_ANALYSIS.md")
          wr_bytes=wr_path.read_bytes()
          wr_text=wr_bytes.decode("utf-8")
          wr_sha256=__import__("hashlib").sha256(wr_bytes).hexdigest()
          wr_blob_sha=subprocess.check_output(["git","rev-parse",f"HEAD:{wr_path.as_posix()}"],text=True).strip()
          pinned_wr_blob=((context.get("governance") or {}).get("blob_shas") or {}).get(wr_path.as_posix())
          if not pinned_wr_blob or wr_blob_sha!=pinned_wr_blob:
              raise SystemExit("Stage 4 WR Git blob SHA differs from Stage 1 governance pin.")
          receipt={"schema_version":"1.0","status":"AWAITING_EDITORIAL_INPUT",
            "stage4_work_instructions":{"path":wr_path.as_posix(),"sha256":wr_sha256,
              "git_blob_sha":wr_blob_sha,"full_text":wr_text},
            "capture_trigger":{"event_name":os.environ.get("GITHUB_EVENT_NAME"),
              "dispatch_mode":(os.environ.get("DISPATCH_MODE") or "schedule"),
              "workflow_run_id":os.environ.get("GITHUB_RUN_ID")},
            "run_id":context["run_id"],"report_date":context["report_date"],
            "supersedes_run_id":context.get("supersedes_run_id"),
            "market_snapshot_sha256":summary["market_snapshot_sha256"],
            "stage3_receipt_sha256":__import__("hashlib").sha256((run/"stage3-calendar-receipt.json").read_bytes()).hexdigest(),
            "stage2_status":stage2["status"],"stage2_pending_rows":stage2.get("pending_rows",[]),
            "chart3_handoff":summary.get("chart3_handoff"),
            "research_bundle_path":f"{run.as_posix()}/stage4-research-bundle.json",
            "research_bundle_sha256":json.loads((run/"stage4-research-bundle-receipt.json").read_text())["bundle_sha256"],
            "research_bundle_unresolved_market_rows":json.loads((run/"stage4-research-bundle-receipt.json").read_text())["unresolved_market_rows"],
            "chart3_merge_workflow_run_id":None,
            "chart3_merge_status":os.environ.get("CHART3_MERGE_STATUS","NOT_REQUIRED"),
            "current_week":stage3["current_week"]["week_id"],"previous_week":(stage3["previous_week"]["week_id"] if stage3.get("previous_week") else None),
            "editorial_input_path":f"{run.as_posix()}/stage4-editorial-content.json",
            "next_action":"FIRST read the complete stage4_work_instructions.full_text in this receipt. Then read stage4-research-bundle.json and generate editorial content bound to run_id, market_snapshot_sha256, research_bundle_sha256, stage3_receipt_sha256, and stage4_wr_sha256 equal to stage4_work_instructions.sha256. Only then trigger the Main Stage 4-6 continuation for this exact Run."}
          receipt_path=run/"capture-stage-receipt.json"
          if receipt_path.exists():
              existing=json.loads(receipt_path.read_text(encoding="utf-8"))
              checks={
                "run_id":context["run_id"],
                "report_date":context["report_date"],
                "market_snapshot_sha256":summary["market_snapshot_sha256"],
                "stage3_receipt_sha256":receipt["stage3_receipt_sha256"],
                "research_bundle_sha256":receipt["research_bundle_sha256"],
              }
              for key,value in checks.items():
                  if existing.get(key)!=value:
                      raise SystemExit(f"Existing capture-stage-receipt {key} mismatch; refusing overwrite.")
              if existing.get("stage4_work_instructions",{}).get("sha256")!=wr_sha256:
                  raise SystemExit("Existing capture-stage-receipt Stage 4 WR SHA mismatch; refusing overwrite.")
              print("Existing exact capture-stage-receipt verified; no rewrite.")
          else:
              receipt_path.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Commit only this Run's Stage 3 research handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR"
          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -eq 0 ]; then
            echo "Stage 3 already PASS and capture handoff is unchanged."
            exit 0
          fi
          for path in "${STAGED[@]}"; do
            [[ "$path" == "$RUN_DIR/"* ]] || { echo "::error::Unexpected Stage 3 path: $path"; exit 1; }
          done
          git commit -m "data(tac): persist Stage 3 calendar and research handoff $RUN_ID"
          git fetch origin main
          git rebase origin/main
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then PUSHED=true; break; fi
            git fetch origin main
            git rebase origin/main
          done
          test "$PUSHED" = true
          git fetch origin main
          git merge --ff-only origin/main
      - name: Upload complete Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-main-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: warn
          retention-days: 30

  build-and-deliver:
    needs: [stage2-and-stage3]
    if: ${{ always() && needs['stage2-and-stage3'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    # Stage 4-6 is the second half of the same scheduled Run; no push-triggered continuation.
    # Chart 3 is downstream and owns its separate data-maintenance lock.
    steps:
      - name: Checkout main only with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install production dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 lxml jsonschema pandas yfinance pandas-market-calendars playwright
          python -m playwright install --with-deps chromium
          npm install --no-save playwright
          npx playwright install chromium
      - name: Resolve exact Run and accept Stage 4 worker submission
        id: resolve
        shell: bash
        env:
          CAPTURE_RUN_ID: ${{ needs['stage2-and-stage3'].outputs.run_id }}
          CAPTURE_REPORT_DATE: ${{ needs['stage2-and-stage3'].outputs.report_date }}
        run: |
          set -euo pipefail
          RUN_ID="$CAPTURE_RUN_ID"
          REPORT_DATE="$CAPTURE_REPORT_DATE"
          test -n "$RUN_ID"
          test -n "$REPORT_DATE"
          RUN_DIR="production/runs/$RUN_ID"
          CONTENT_FILE="$RUN_DIR/stage4-editorial-content.json"
          test -s "$RUN_DIR/run-context.json"
          READY=false
          for attempt in $(seq 1 30); do
            git fetch origin main
            git merge --ff-only origin/main
            if [ -s "$CONTENT_FILE" ]; then
              python production/runner/accept_stage_submission.py --run-dir "$RUN_DIR" --stage STAGE_4
              READY=true
              break
            fi
            sleep 30
          done
          test "$READY" = true || { echo "::error::Stage 4 worker did not publish the exact Run-scoped editorial artifact within 15 minutes."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR/run-state.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore(tac): accept Stage 4 Run-bound worker handoff $RUN_ID"
            git fetch origin main
            git rebase origin/main
            PUSHED=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then PUSHED=true; break; fi
              git fetch origin main
              git rebase origin/main
            done
            test "$PUSHED" = true
            git fetch origin main
            git merge --ff-only origin/main
          fi
          python - "$CONTENT_FILE" "$RUN_DIR" "$REPORT_DATE" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          content_path=Path(sys.argv[1]); run_dir=Path(sys.argv[2]); report_date=sys.argv[3]
          content=json.loads(content_path.read_text(encoding="utf-8"))
          context=json.loads((run_dir/"run-context.json").read_text(encoding="utf-8"))
          state=json.loads((run_dir/"run-state.json").read_text(encoding="utf-8"))
          summary=json.loads((run_dir/"stage2-run-summary.json").read_text(encoding="utf-8"))
          capture=json.loads((run_dir/"capture-stage-receipt.json").read_text(encoding="utf-8"))
          bundle=json.loads((run_dir/"stage4-research-bundle-receipt.json").read_text(encoding="utf-8"))
          digest=hashlib.sha256(content_path.read_bytes()).hexdigest()
          stage3_sha=hashlib.sha256((run_dir/"stage3-calendar-receipt.json").read_bytes()).hexdigest()
          assert context["run_id"]==run_dir.name==content["run_id"]
          assert context["report_date"]==report_date==content["report_date"]
          assert state["run_id"]==context["run_id"]
          assert state["stages"]["STAGE_3"]["status"]=="PASS"
          assert state["stages"]["STAGE_4"]["status"] in ("SUBMITTED","PASS")
          if state["stages"]["STAGE_4"]["status"]=="SUBMITTED":
              assert state["stages"]["STAGE_4"]["output_sha256"]==digest
          else:
              assert state["stages"]["STAGE_4"]["input_sha256"]==digest
              assert (run_dir/"stage4-analysis-receipt.json").is_file()
          if state["stages"]["STAGE_5"]["status"] in ("PASS","PARTIAL"):
              assert (run_dir/"stage5-render-qa-receipt.json").is_file()
          if state["stages"]["STAGE_6"]["status"]=="PASS":
              assert (run_dir/"stage6-delivery-receipt.json").is_file()
          assert content["market_snapshot_sha256"]==summary["market_snapshot_sha256"]
          assert content["research_bundle_sha256"]==bundle["bundle_sha256"]==capture["research_bundle_sha256"]
          assert content["stage3_receipt_sha256"]==stage3_sha==capture["stage3_receipt_sha256"]
          stage4_wr_sha=capture["stage4_work_instructions"]["sha256"]
          assert content["stage4_wr_sha256"]==stage4_wr_sha
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"stage4_status={state['stages']['STAGE_4']['status']}\n")
              f.write(f"stage5_status={state['stages']['STAGE_5']['status']}\n")
              f.write(f"stage6_status={state['stages']['STAGE_6']['status']}\n")
          print("PASS: Stage 4 submission and all research evidence share the exact Run and SHA bindings.")
          PY
          git cat-file -e "HEAD:$RUN_DIR/run-context.json"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "CONTENT_FILE=$CONTENT_FILE" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - name: Stage 4 — validate and merge current editorial research
        id: stage4
        if: ${{ steps.resolve.outputs.stage4_status != 'PASS' }}
        run: |
          set -euo pipefail
          python production/runner/run_stage4.py --run-dir "$RUN_DIR" --content "$CONTENT_FILE"
          test -s "$RUN_DIR/stage4-analysis-receipt.json"
      - name: Persist Stage 4 receipt and state
        if: ${{ always() && steps.stage4.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR"
          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -eq 0 ]; then echo "No new Stage 4 Run evidence."; exit 0; fi
          for file in "${STAGED[@]}"; do case "$file" in "$RUN_DIR"/*) ;; *) echo "::error::Unexpected Run evidence path: $file"; exit 1 ;; esac; done
          git commit -m "chore(tac): persist Stage 4 receipts and state $RUN_ID"
          git fetch origin main
          git rebase origin/main
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then PUSHED=true; break; fi
            git fetch origin main
            git rebase origin/main
          done
          test "$PUSHED" = true
          git fetch origin main
          git merge --ff-only origin/main
      - name: Stage 5 — build exact mother and run full QA
        id: stage5
        if: ${{ steps.resolve.outputs.stage5_status != 'PASS' && steps.resolve.outputs.stage5_status != 'PARTIAL' }}
        run: |
          set -euo pipefail
          python production/runner/run_stage5.py --run-dir "$RUN_DIR"
          test -s "$RUN_DIR/stage5-render-qa-receipt.json"
          STATUS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["status"])' "$RUN_DIR/stage5-render-qa-receipt.json")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Stage 5 result: $STATUS"
      - name: Persist Stage 5 QA receipt and state
        if: ${{ always() && steps.stage5.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR"
          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -eq 0 ]; then echo "No new Stage 5 Run evidence."; exit 0; fi
          for file in "${STAGED[@]}"; do case "$file" in "$RUN_DIR"/*) ;; *) echo "::error::Unexpected Run evidence path: $file"; exit 1 ;; esac; done
          git commit -m "chore(tac): persist Stage 5 receipts and state $RUN_ID"
          git fetch origin main
          git rebase origin/main
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then PUSHED=true; break; fi
            git fetch origin main
            git rebase origin/main
          done
          test "$PUSHED" = true
          git fetch origin main
          git merge --ff-only origin/main
      - name: Stage 6 — deliver three preview files and verify Pages
        id: stage6
        if: ${{ (steps.resolve.outputs.stage5_status == 'PASS' || steps.stage5.outputs.status == 'REVIEW_READY') && steps.resolve.outputs.stage6_status != 'PASS' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python production/runner/run_stage6.py --run-dir "$RUN_DIR"
      - name: Stage 6 — preserve PARTIAL artifact without publishing
        if: ${{ steps.resolve.outputs.stage5_status == 'PARTIAL' || steps.stage5.outputs.status == 'PARTIAL' }}
        run: echo "Stage 5 is PARTIAL; retaining Run artifacts, skipping main/preview delivery."
      - name: Persist Stage 6 delivery receipt and final state
        if: ${{ always() && steps.stage6.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RUN_DIR"
          mapfile -t STAGED < <(git diff --cached --name-only)
          if [ "${#STAGED[@]}" -eq 0 ]; then echo "No new Stage 6 Run evidence."; exit 0; fi
          for file in "${STAGED[@]}"; do case "$file" in "$RUN_DIR"/*) ;; *) echo "::error::Unexpected Run evidence path: $file"; exit 1 ;; esac; done
          git commit -m "chore(tac): persist Stage 6 receipts and state $RUN_ID"
          git fetch origin main
          git rebase origin/main
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then PUSHED=true; break; fi
            git fetch origin main
            git rebase origin/main
          done
          test "$PUSHED" = true
          git fetch origin main
          git merge --ff-only origin/main
      - name: Upload complete Run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-main-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: warn
          retention-days: 30
