name: TAC Chart 2 browser QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/chart2-preview-browser-qa.yml"
      - ".github/scripts/test_chart2_preview_browser.py"
      - "research/tac-chart2/**"
      - "data/tac-chart2/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chart2-preview-browser-qa.yml"
      - ".github/scripts/test_chart2_preview_browser.py"
      - "research/tac-chart2/**"
      - "data/tac-chart2/**"

permissions:
  contents: read

concurrency:
  group: tac-chart2-browser-qa
  cancel-in-progress: false

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Chart 2 desktop and mobile browser QA
        run: python .github/scripts/test_chart2_preview_browser.py
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-chart2-browser-qa-${{ github.run_id }}
          path: artifacts/chart2-browser-qa/
          if-no-files-found: warn
          retention-days: 30
