name: TAC Chart 3 FRED-ALFRED historical ingestion

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - "research/tac-chart3/**"
      - ".github/workflows/tac-chart3-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tac-chart3-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated simulation branch
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify secret is configured without exposing it
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::Repository secret FRED_API_KEY is not available to this workflow."
            exit 1
          fi
          echo "FRED_API_KEY is present; value will not be printed."
      - name: Download current, initial-release and ALFRED vintage history
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/tac-chart3/tac_fred_alfred_download.py
      - name: Upload immutable ingestion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-chart3-fred-alfred-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tac-chart3/
          if-no-files-found: warn
          retention-days: 30
