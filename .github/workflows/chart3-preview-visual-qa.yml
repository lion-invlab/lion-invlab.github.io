name: TAC Chart 3 preview visual QA
# Re-run browser QA after history overlay checkbox changes

on:
  pull_request:
    paths:
      - "research/tac-chart3/chart3-preview.html"
      - "data/tac-chart3/sp500_daily_close_1927-2026.compact.json"
      - ".github/scripts/update_sp500_daily_incremental.py"
      - ".github/scripts/build_sp500_daily_compact.py"
      - ".github/scripts/test_chart3_preview_browser.py"
      - ".github/workflows/chart3-preview-visual-qa.yml"
  push:
    branches:
      - fix/chart3-sp500-investing-source-20261123
      - feat/chart3-sp500-incremental-20261114
    paths:
      - ".github/workflows/chart3-preview-visual-qa.yml"
      - ".github/scripts/test_chart3_preview_browser.py"
      - "research/tac-chart3/chart3-preview.html"
      - "data/tac-chart3/chart3_market_stress.json"
      - "data/tac-chart3/sp500_daily_close_1927-2026.compact.json"

permissions:
  contents: write

concurrency:
  group: tac-chart3-preview-visual-qa-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build latest S&P 500 history on isolated PR checkout
        run: |
          python .github/scripts/update_sp500_daily_incremental.py --data-dir data/tac-chart3 --overlap-calendar-days 30
          python .github/scripts/build_sp500_daily_compact.py --recent-compact data/tac-chart3/sp500_daily_close_1993-2026.compact.json --output data/tac-chart3/sp500_daily_close_1927-2026.compact.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/tac-chart3/sp500_daily_close_1927-2026.compact.json')
          d=json.loads(p.read_text())
          assert d['start'] == '1927-12-30'
          assert d['end'] >= '2026-11-20'
          assert d['rows'] >= 24000
          print({'start':d['start'],'end':d['end'],'rows':d['rows'],'sha256':d['source_dataset_sha256']})
          PY
      - name: Build standalone preview artifact
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html_path = Path("research/tac-chart3/chart3-preview.html")
          data_path = Path("data/tac-chart3/chart3_market_stress.json")
          html = html_path.read_text(encoding="utf-8")
          data = json.dumps(json.loads(data_path.read_text(encoding="utf-8")), ensure_ascii=False, separators=(",", ":"))
          fetch_call = "fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('圖表資料讀取失敗：HTTP '+r.status);return r.json()})"
          if fetch_call not in html:
              raise SystemExit("Expected data fetch call not found; standalone preview not generated")
          html = html.replace(fetch_call, "Promise.resolve(" + data + ")")
          out = Path("artifacts/chart3-preview-visual-qa/chart3-preview-standalone.html")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(html, encoding="utf-8")
          compact = Path("data/tac-chart3/sp500_daily_close_1927-2026.compact.json")
          if compact.exists():
              import shutil
              shutil.copy2(compact, out.parent / compact.name)
          print(f"Standalone preview generated: {out} ({out.stat().st_size} bytes)")
          PY
      - name: Render and validate desktop and mobile previews
        run: python .github/scripts/test_chart3_preview_browser.py
      - name: Persist QA-verified S&P 500 history to repair branch
        if: success() && github.event_name == 'push'
        run: |
          DATA_FILE=data/tac-chart3/sp500_daily_close_1927-2026.compact.json
          cp "$DATA_FILE" /tmp/sp500_daily_close_1927-2026.compact.json
          git fetch origin fix/chart3-sp500-investing-source-20261123
          git checkout -B fix/chart3-sp500-investing-source-20261123 origin/fix/chart3-sp500-investing-source-20261123
          cp /tmp/sp500_daily_close_1927-2026.compact.json "$DATA_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_FILE"
          if git diff --cached --quiet; then
            echo "Verified history is already current; no commit needed."
          else
            git commit -m "Persist QA-verified S&P 500 daily history"
            git push origin HEAD:fix/chart3-sp500-investing-source-20261123
          fi
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-chart3-preview-visual-qa-${{ github.run_id }}
          path: artifacts/chart3-preview-visual-qa/
          if-no-files-found: warn
          retention-days: 30
