name: TAC Chart 3 preview visual QA

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - ".github/workflows/chart3-preview-visual-qa.yml"
      - ".github/scripts/test_chart3_preview_browser.py"
      - "research/tac-chart3/chart3-preview.html"
      - "data/tac-chart3/chart3_market_stress.json"

permissions:
  contents: read

concurrency:
  group: tac-chart3-preview-visual-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated simulation branch
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render and validate desktop and mobile previews
        run: python .github/scripts/test_chart3_preview_browser.py
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-chart3-preview-visual-qa-${{ github.run_id }}
          path: artifacts/chart3-preview-visual-qa/
          if-no-files-found: warn
          retention-days: 30
