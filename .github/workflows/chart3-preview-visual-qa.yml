name: TAC Chart 3 preview visual QA
# Validate the exact pushed branch; never silently fall back to main.
# Regression coverage includes responsive axis bounds and long-range percentile display density.
# Zoom regression now crosses the eight-year weekly-detail threshold before asserting.
# Adaptive aggregation regression: quarterly >8y, monthly 2-8y, weekly <=2y.
# Restore low-opacity full-height gray event and drawdown shading; keep all intervals.

on:
  push:
    branches:
      - main
      - research/chart3-sp500-integration-20261114
    paths:
      - ".github/workflows/chart3-preview-visual-qa.yml"
      - ".github/scripts/test_chart3_preview_browser.py"
      - "research/tac-chart3/chart3-preview.html"
      - "data/tac-chart3/chart3_market_stress.json"
      - "data/tac-chart3/sp500_daily_close_1993-2026.compact.json"

permissions:
  contents: read

concurrency:
  group: tac-chart3-preview-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build standalone preview artifact
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html_path = Path("research/tac-chart3/chart3-preview.html")
          data_path = Path("data/tac-chart3/chart3_market_stress.json")
          html = html_path.read_text(encoding="utf-8")
          stress_data = json.dumps(json.loads(data_path.read_text(encoding="utf-8")), ensure_ascii=False, separators=(",", ":"))
          sp500_path = Path("data/tac-chart3/sp500_daily_close_1993-2026.compact.json")
          sp500_data = json.dumps(json.loads(sp500_path.read_text(encoding="utf-8")), ensure_ascii=False, separators=(",", ":"))
          for token, payload in [("fetchJson(DATA_URL)", stress_data), ("fetchJson(SP500_DATA_URL)", sp500_data)]:
              if token not in html:
                  raise SystemExit(f"Expected {token} call not found; standalone preview not generated")
              html = html.replace(token, "Promise.resolve(" + payload + ")")
          out = Path("artifacts/chart3-preview-visual-qa/chart3-preview-standalone.html")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(html, encoding="utf-8")
          print(f"Standalone preview generated: {out} ({out.stat().st_size} bytes)")
          PY
      - name: Render and validate desktop, mobile and 320px previews
        run: python .github/scripts/test_chart3_preview_browser.py
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-chart3-preview-visual-qa-${{ github.run_id }}
          path: artifacts/chart3-preview-visual-qa/
          if-no-files-found: warn
          retention-days: 30
