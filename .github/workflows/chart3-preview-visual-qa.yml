name: TAC Chart 3 preview visual QA
# Re-run browser QA after history overlay checkbox changes

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/chart3-full-migration-20261114
    paths:
      - ".github/workflows/chart3-preview-visual-qa.yml"
      - ".github/scripts/test_chart3_preview_browser.py"
      - "research/tac-chart3/chart3-preview.html"
      - "data/tac-chart3/chart3_market_stress.json"

permissions:
  contents: read

concurrency:
  group: tac-chart3-preview-visual-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build standalone preview artifact
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html_path = Path("research/tac-chart3/chart3-preview.html")
          data_path = Path("data/tac-chart3/chart3_market_stress.json")
          html = html_path.read_text(encoding="utf-8")
          data = json.dumps(json.loads(data_path.read_text(encoding="utf-8")), ensure_ascii=False, separators=(",", ":"))
          fetch_call = "fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('圖表資料讀取失敗：HTTP '+r.status);return r.json()})"
          if fetch_call not in html:
              raise SystemExit("Expected data fetch call not found; standalone preview not generated")
          html = html.replace(fetch_call, "Promise.resolve(" + data + ")")
          out = Path("artifacts/chart3-preview-visual-qa/chart3-preview-standalone.html")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(html, encoding="utf-8")
          print(f"Standalone preview generated: {out} ({out.stat().st_size} bytes)")
          PY
      - name: Render and validate desktop and mobile previews
        run: python .github/scripts/test_chart3_preview_browser.py
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-chart3-preview-visual-qa-${{ github.run_id }}
          path: artifacts/chart3-preview-visual-qa/
          if-no-files-found: warn
          retention-days: 30
