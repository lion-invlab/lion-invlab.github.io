name: TAC Chart 3 preview visual QA
# Browser QA consumes the S&P 500 snapshot already written by the SIM-1.4 early-report handoff; never fetch quotes here.

on:
  pull_request:
    paths:
      - "research/tac-chart3/chart3-preview.html"
      - "data/tac-chart3/sp500_daily_close_1927-2026.compact.json"
      - ".github/scripts/test_chart3_preview_browser.py"
      - ".github/workflows/chart3-preview-visual-qa.yml"
  push:
    branches:
      - fix/chart3-sp500-investing-source-20261123
      - feat/chart3-sp500-incremental-20261114
    paths:
      - ".github/workflows/chart3-preview-visual-qa.yml"
      - ".github/scripts/test_chart3_preview_browser.py"
      - "research/tac-chart3/chart3-preview.html"
      - "data/tac-chart3/chart3_market_stress.json"
      - "data/tac-chart3/sp500_daily_close_1927-2026.compact.json"

permissions:
  contents: read

concurrency:
  group: tac-chart3-preview-visual-qa-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout committed Chart 3 snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify committed S&P 500 snapshot (no quote fetch)
        run: |
          python - <<'PY'
          import base64, datetime as dt, hashlib, json, zlib
          from pathlib import Path
          p=Path("data/tac-chart3/sp500_daily_close_1927-2026.compact.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          assert obj["schema_version"]=="1.0.0" and obj["encoding"]=="zlib+base64"
          raw=zlib.decompress(base64.b64decode(obj["payload"],validate=True))
          off=0; ordinal=dt.date.fromisoformat(obj["start"]).toordinal(); close=0
          rows=[]; previous=None
          def varint(buf, pos):
              value=0; shift=0
              while True:
                  if pos>=len(buf) or shift>49: raise ValueError("truncated/overflow varint")
                  b=buf[pos]; pos+=1; value+=(b&127)*(2**shift)
                  if not b&128: return value,pos
                  shift+=7
          for _ in range(int(obj["rows"])):
              gap,off=varint(raw,off); ordinal+=gap
              zz,off=varint(raw,off); delta=zz//2 if zz%2==0 else -(zz//2)-1
              close+=delta
              day=dt.date.fromordinal(ordinal).isoformat()
              if previous is not None: assert day>previous, (previous,day)
              assert close>0, (day,close)
              rows.append((day,close)); previous=day
          assert off==len(raw) and len(rows)==int(obj["rows"])
          assert rows[0][0]=="1927-12-30" and rows[-1][0]==obj["end"]
          assert obj["end"]>="2026-11-20" and len(rows)>=24000
          canonical=("Date,Close\\n"+"".join(f"{d},{c/100:.2f}\\n" for d,c in rows)).encode()
          digest=hashlib.sha256(canonical).hexdigest()
          assert digest==obj["source_dataset_sha256"], (digest,obj["source_dataset_sha256"])
          print({"status":"PASS","mode":"committed_snapshot_only","start":rows[0][0],"end":rows[-1][0],"rows":len(rows),"dataset_sha256":digest})
          PY
      - name: Build standalone preview artifact
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html_path = Path("research/tac-chart3/chart3-preview.html")
          data_path = Path("data/tac-chart3/chart3_market_stress.json")
          html = html_path.read_text(encoding="utf-8")
          data = json.dumps(json.loads(data_path.read_text(encoding="utf-8")), ensure_ascii=False, separators=(",", ":"))
          fetch_call = "fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('圖表資料讀取失敗：HTTP '+r.status);return r.json()})"
          if fetch_call not in html:
              raise SystemExit("Expected data fetch call not found; standalone preview not generated")
          html = html.replace(fetch_call, "Promise.resolve(" + data + ")")
          out = Path("artifacts/chart3-preview-visual-qa/chart3-preview-standalone.html")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(html, encoding="utf-8")
          compact = Path("data/tac-chart3/sp500_daily_close_1927-2026.compact.json")
          if compact.exists():
              import shutil
              shutil.copy2(compact, out.parent / compact.name)
          print(f"Standalone preview generated: {out} ({out.stat().st_size} bytes)")
          PY
      - name: Render and validate desktop and mobile previews
        run: python .github/scripts/test_chart3_preview_browser.py
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-chart3-preview-visual-qa-${{ github.run_id }}
          path: artifacts/chart3-preview-visual-qa/
          if-no-files-found: warn
          retention-days: 30
