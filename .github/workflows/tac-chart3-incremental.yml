name: TAC Chart 3 incremental update (main branch trigger)

on:
  workflow_dispatch:
  # Run only after the Main report's build-and-deliver workflow has finished.
  # This keeps the shared Chart 3 data lock out of Stage 4-6 execution.
  workflow_run:
    workflows: ["TAC main-native production pipeline"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tac-chart3-data-maintenance
  cancel-in-progress: false

jobs:
  resolve-main-run:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Checkout Main for exact Run lookup
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Resolve production Run that completed this workflow
        id: resolve
        env:
          PRODUCTION_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCTION_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def out(should_run, run_id=""):
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
                  f.write(f"should_run={str(should_run).lower()}\n")
                  f.write(f"run_id={run_id}\n")
          if os.environ.get("PRODUCTION_HEAD_BRANCH") != "main":
              out(False); raise SystemExit(0)
          workflow_run_id=str(os.environ["PRODUCTION_WORKFLOW_RUN_ID"])
          matches=[]
          for p in Path("production/runs").glob("TAC-*/run-context.json"):
              context=json.loads(p.read_text(encoding="utf-8"))
              if str(context.get("workflow_run_id")) == workflow_run_id:
                  matches.append(p.parent)
          if not matches:
              print(f"No Main Run for completed workflow_run_id={workflow_run_id}; this was not a production capture run.")
              out(False); raise SystemExit(0)
          if len(matches)!=1:
              raise SystemExit(f"Integrity error: {len(matches)} Main Runs match workflow_run_id={workflow_run_id}.")
          run=matches[0]
          state_path=run/"run-state.json"
          if not state_path.is_file():
              raise SystemExit(f"Integrity error: {run.name} has no authoritative run-state.json.")
          state=json.loads(state_path.read_text(encoding="utf-8"))
          stages=state.get("stages",{})
          stage2=stages.get("STAGE_2",{}).get("status")
          stage3=stages.get("STAGE_3",{}).get("status")
          if state.get("run_id")!=run.name or stage2 not in ("PASS","PARTIAL") or stage3!="PASS":
              print(f"Run {run.name} did not complete Stage 2/3; Chart 3 branch will be skipped.")
              out(False); raise SystemExit(0)
          if not (run/"stage2-market-snapshot-receipt.json").is_file() or not (run/"stage3-calendar-receipt.json").is_file():
              raise SystemExit(f"Integrity error: {run.name} is PASS for Stage 2/3 but a required receipt is missing.")
          print(f"Chart 3 handoff accepted for exact Main Run {run.name} (Stage2={stage2}, Stage3=PASS).")
          out(True,run.name)
          PY
  update:
    needs: [resolve-main-run]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs['resolve-main-run'].outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test incremental invariants
        run: |
          python .github/scripts/test_tac_chart3_incremental.py
          python .github/scripts/test_build_tac_chart3_visualization.py
          python .github/scripts/test_tac_chart3_asof_snapshot.py
      - name: Fetch new vintage events and reconcile current snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python .github/scripts/tac_chart3_incremental.py --data-dir data/tac-chart3 --overlap 5
      - name: Build chart-ready dataset and verify source hashes
        run: python .github/scripts/build_tac_chart3_visualization.py --data-dir data/tac-chart3
      - name: Validate point-in-time reconstruction against current snapshots
        run: python .github/scripts/build_tac_chart3_asof_snapshot.py --data-dir data/tac-chart3 --as-of-latest-plus-one --output /tmp/tac-chart3-asof-current.json
      - name: Commit only if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tac-chart3
          if git diff --cached --quiet; then
            echo "No new vintage or current data; baseline checkpoint left unchanged."
          else
            git commit -m "data(chart3): incremental FRED-ALFRED vintage update"
            # S&P 500 merge and ALFRED updates share this data-maintenance lock.
            # Rebase remains a defensive safeguard for unrelated Main writers.
            git fetch origin main
            git rebase origin/main
            PUSHED=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                PUSHED=true
                break
              fi
              git fetch origin main
              git rebase origin/main
            done
            test "$PUSHED" = true
          fi
