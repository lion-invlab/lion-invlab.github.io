name: TAC Chart 3 incremental update (simulation branch trigger)

on:
  push:
    branches:
      - simulation/tac-process-lab-2026-11-06
    paths:
      - ".github/scripts/tac_chart3_incremental_trigger.py"

permissions:
  contents: write

concurrency:
  group: tac-chart3-incremental
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated simulation branch
        uses: actions/checkout@v4
        with:
          ref: simulation/tac-process-lab-2026-11-06
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test incremental invariants
        run: python .github/scripts/test_tac_chart3_incremental.py
      - name: Fetch new vintage events and reconcile current snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python .github/scripts/tac_chart3_incremental.py --data-dir data/tac-chart3 --overlap 5
      - name: Commit only if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tac-chart3
          if git diff --cached --quiet; then
            echo "No new vintage or current data; baseline checkpoint left unchanged."
          else
            git commit -m "data(chart3): incremental FRED-ALFRED vintage update"
            git push origin HEAD:simulation/tac-process-lab-2026-11-06
          fi
