name: TAC Chart 3 incremental update (main branch trigger)

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/tac_chart3_incremental_trigger.py"
      - ".github/scripts/update_sp500_daily_incremental.py"
      - ".github/scripts/build_sp500_daily_compact.py"
      - ".github/workflows/tac-chart3-incremental.yml"

permissions:
  contents: write

concurrency:
  group: tac-chart3-incremental
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test incremental invariants
        run: |
          python .github/scripts/test_tac_chart3_incremental.py
          python .github/scripts/test_build_tac_chart3_visualization.py
          python .github/scripts/test_tac_chart3_asof_snapshot.py
          python .github/scripts/test_sp500_daily_incremental.py
      - name: Update S&P 500 daily close history (overlap + idempotent upsert)
        run: |
          python .github/scripts/update_sp500_daily_incremental.py --data-dir data/tac-chart3 --overlap-calendar-days 30
          python .github/scripts/build_sp500_daily_compact.py \
            --recent-compact data/tac-chart3/sp500_daily_close_1993-2026.compact.json \
            --output data/tac-chart3/sp500_daily_close_1927-2026.compact.json
      - name: Fetch new vintage events and reconcile current snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python .github/scripts/tac_chart3_incremental.py --data-dir data/tac-chart3 --overlap 5
      - name: Build chart-ready dataset and verify source hashes
        run: python .github/scripts/build_tac_chart3_visualization.py --data-dir data/tac-chart3
      - name: Validate point-in-time reconstruction against current snapshots
        run: python .github/scripts/build_tac_chart3_asof_snapshot.py --data-dir data/tac-chart3 --as-of-latest-plus-one --output /tmp/tac-chart3-asof-current.json
      - name: Commit only if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tac-chart3
          if git diff --cached --quiet; then
            echo "No new S&P 500 or ALFRED data; baseline checkpoint left unchanged."
          else
            git commit -m "data(chart3): incremental S&P 500 and FRED-ALFRED update"
            git push origin HEAD:main
          fi
