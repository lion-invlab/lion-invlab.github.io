name: Deploy GitHub Pages

on:
  # Deploy only after TAC structural validation has completed successfully.
  workflow_run:
    workflows: ["TAC Daily Report Structural Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Require a changed canonical dated preview
        id: release
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          changed="$(git diff --name-only "$sha^1" "$sha")"
          preview="$(printf '%s\n' "$changed" | grep -E '^preview/2026-[0-9]{2}-[0-9]{2}\.html$' | head -n 1 || true)"
          if [ -n "$preview" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "preview_path=$preview" >> "$GITHUB_OUTPUT"
            echo "Validated dated preview changed: $preview"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: validation succeeded but this commit did not change a canonical dated preview."
          fi

      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.should_deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed canonical preview URL
        if: github.event_name == 'workflow_run' && steps.release.outputs.should_deploy == 'true'
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PREVIEW_PATH: ${{ steps.release.outputs.preview_path }}
        run: |
          if [ -z "$PAGE_URL" ] || [ -z "$PREVIEW_PATH" ]; then
            echo "FAIL: Pages URL or canonical preview path is missing."
            exit 1
          fi
          url="${PAGE_URL%/}/$PREVIEW_PATH"
          for attempt in $(seq 1 12); do
            status="$(curl --location --silent --show-error --output /tmp/tac-preview.html --write-out '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ] \
              && grep -Fq 'TAC 投資早報' /tmp/tac-preview.html \
              && grep -Fq 'id="last-week-calendar"' /tmp/tac-preview.html \
              && grep -Fq 'id="last-week-earnings"' /tmp/tac-preview.html; then
              echo "PASS: deployed preview URL returned HTTP 200 and expected Monday report sections."
              echo "Verified URL: $url"
              exit 0
            fi
            echo "Attempt $attempt/12: HTTP $status; waiting for Pages propagation."
            sleep 5
          done
          echo "FAIL: deployed preview URL did not return the expected report content: $url"
          exit 1
