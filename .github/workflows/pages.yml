name: Deploy GitHub Pages

on:
  # Production deployment is released only after the dated-report structural
  # gate has completed successfully on main.
  workflow_run:
    workflows: ["TAC Daily Report Structural Gate"]
    types: [completed]
    branches: [main]
  # Retain an explicit operator-controlled deployment path.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # A failed or cancelled report gate must never publish the candidate.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
