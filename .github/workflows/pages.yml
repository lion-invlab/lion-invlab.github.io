name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "preview/20??-??-??.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  detect_release:
    name: Detect validated report changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.release.outputs.should_deploy }}
      preview_path: ${{ steps.release.outputs.preview_path }}
    steps:
      - name: Detect changed canonical preview or homepage
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("should_deploy", "true");
              core.setOutput("preview_path", "");
              core.info("Manual Pages deployment requested.");
              return;
            }

            const sha = context.sha;
            if (!sha) {
              throw new Error("GitHub event did not provide a commit SHA; refusing to guess deployment target.");
            }
            const response = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });
            const files = response.data.files;
            if (!Array.isArray(files) || files.length >= 300) {
              throw new Error("Commit file list is unavailable or truncated; refusing to guess whether deployment is required.");
            }

            const changed = files.map(file => file.filename);
            const preview = changed.find(path => /^preview\/20[0-9]{2}-[0-9]{2}-[0-9]{2}\.html$/.test(path));
            const homepage = changed.includes("index.html");
            const volatilityDashboard = changed.includes("volatility.html");
            const pagesWorkflow = changed.includes(".github/workflows/pages.yml");

            if (preview) {
              core.setOutput("should_deploy", "true");
              core.setOutput("preview_path", preview);
              core.info(`Validated dated preview changed: ${preview}`);
            } else if (homepage || volatilityDashboard || pagesWorkflow) {
              core.setOutput("should_deploy", "true");
              core.setOutput("preview_path", "");
              core.info(homepage ? "Approved homepage changed; deploy root site." : volatilityDashboard ? "Volatility dashboard changed; deploy root site." : "Pages workflow changed; deploy root site to validate deployment configuration.");
            } else {
              core.setOutput("should_deploy", "false");
              core.setOutput("preview_path", "");
              core.info("No canonical preview or homepage changed; deployment job will be skipped.");
            }

  deploy:
    name: Deploy validated TAC site
    needs: detect_release
    if: needs.detect_release.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Lock validated TAC Work Rules revision
        shell: bash
        run: |
          git fetch origin main --depth=1
          mkdir -p artifacts
          python scripts/tac_wr_lock.py --ref HEAD --output artifacts/tac-wr-lock.json
          echo "TAC_WR_LOCK_FILE=artifacts/tac-wr-lock.json" >> "$GITHUB_ENV"
          echo "## TAC Work Rules lock" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/tac-wr-lock.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TAC Work Rules lock record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-pages-wr-lock-${{ github.run_id }}
          path: artifacts/tac-wr-lock.json
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed report URL
        if: steps.deployment.outcome == 'success'
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PREVIEW_PATH: ${{ needs.detect_release.outputs.preview_path }}
        run: |
          if [ -z "$PAGE_URL" ]; then
            echo "FAIL: Pages deployment URL is missing."
            exit 1
          fi
          if [ -n "$PREVIEW_PATH" ]; then
            url="${PAGE_URL%/}/$PREVIEW_PATH"
          else
            url="${PAGE_URL%/}/"
          fi
          for attempt in $(seq 1 12); do
            status="$(curl --location --silent --show-error --output /tmp/tac-report.html --write-out '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ] \
              && grep -Fq 'TAC 投資早報' /tmp/tac-report.html \
              && grep -Fq 'id="overview"' /tmp/tac-report.html \
              && grep -Fq 'id="sentiment"' /tmp/tac-report.html; then
              echo "PASS: deployed report URL returned HTTP 200 and expected TAC report sections."
              echo "Verified URL: $url"
              exit 0
            fi
            echo "Attempt $attempt/12: HTTP $status; waiting for Pages propagation."
            sleep 5
          done
          echo "FAIL: deployed report URL did not return expected TAC report content: $url"
          exit 1
