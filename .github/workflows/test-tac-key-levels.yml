name: Test TAC Key Levels Data Source

on:
  push:
    branches:
      - tac-test-2026-10-23
    paths:
      - ".github/workflows/test-tac-key-levels.yml"
      - "scripts/test_tac_key_levels.py"
      - "scripts/probe_sox_sources.py"
      - "scripts/test_tac_report_integration.py"
      - "index.html"
      - "test-masters/**"
  workflow_dispatch:
    inputs:
      session_date:
        description: "Expected US trading session date (YYYY-MM-DD)"
        required: true
        default: "2026-10-21"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: tac-test-2026-10-23
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip yfinance pandas requests
      - name: Test SOX source parser regression cases
        run: python -m unittest scripts/test_probe_sox_parser.py -v

      - name: Verify rendered report key-level integration
        run: python -m unittest scripts/test_tac_report_integration.py -v

      - name: Validate same-session OHLC and calculate classic pivot levels
        run: python scripts/test_tac_key_levels.py "${{ inputs.session_date || '2026-10-21' }}"

      - name: Validate dated 2026-10-23 report session OHLC and pivots
        run: python scripts/test_tac_key_levels.py "2026-10-22"

      - name: Probe public SOX source consistency (diagnostic only)
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/probe_sox_sources.py "${{ inputs.session_date || '2026-10-21' }}"
