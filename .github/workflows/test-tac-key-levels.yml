name: Test TAC Key Levels Data Source

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "Expected US trading session date (YYYY-MM-DD)"
        required: true
        default: "2026-10-22"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: tac-test-2026-10-23
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip yfinance pandas requests
      - name: Validate same-session OHLC and calculate classic pivot levels
        run: python scripts/test_tac_key_levels.py "${{ inputs.session_date }}"

      - name: Probe public SOX source consistency (diagnostic only)
        run: python scripts/probe_sox_sources.py
