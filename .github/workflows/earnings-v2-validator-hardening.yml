name: TAC earnings v2 validator hardening

on:
  push:
    branches:
      - simulation/earnings-v2-validator-hardening-2026-11-13
    paths:
      - "simulation-lab/runner/validate_earnings_v2.py"
      - "simulation-lab/runner/earnings_judgment.py"
      - "simulation-lab/runner/calendar_source_guard.py"
      - "simulation-lab/runner/audit_earnings_schema.py"
      - "simulation-lab/runner/audit_earnings_v2_main_snapshot.py"
      - "simulation-lab/runner/test_earnings_judgment_engine.py"
      - "simulation-lab/runner/test_earnings_comparison_status.py"
      - "simulation-lab/runner/test_earnings_schema_audit.py"
      - "simulation-lab/runner/calendar_source_guard.py"
      - "schemas/tac-earnings-record-v2.schema.json"
      - ".github/workflows/earnings-v2-validator-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this isolated hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema beautifulsoup4

      - name: Run earnings judgment engine regression tests
        run: python simulation-lab/runner/test_earnings_judgment_engine.py

      - name: Run calendar projection and renderer consistency regression tests
        run: python simulation-lab/runner/test_earnings_comparison_status.py

      - name: Run read-only calendar projection self-test
        run: python simulation-lab/runner/calendar_source_guard.py --self-test

      - name: Audit authoritative main W46 earnings data read-only
        run: |
          git fetch --no-tags origin main
          python simulation-lab/runner/audit_earnings_v2_main_snapshot.py --week-path data/calendar/weeks/2026-W46.json

      - name: Run migration audit CSV regression tests
        run: python simulation-lab/runner/test_earnings_schema_audit.py

      - name: Run validator fail-closed regression tests
        run: python simulation-lab/runner/validate_earnings_v2.py --self-test
