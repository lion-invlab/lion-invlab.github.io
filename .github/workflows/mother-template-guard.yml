name: TAC Mother Template Guard

on:
  push:
    branches: ["main"]
    paths:
      - "母版專區/**"
      - "TAC_WORK_RULES.md"
      - "scripts/validate_mother_template.py"
      - ".github/workflows/mother-template-guard.yml"
  workflow_dispatch:
    inputs:
      report_date:
        description: "台灣報告日期 (YYYY-MM-DD)"
        required: true
        type: string
  pull_request:
    paths:
      - "母版專區/**"
      - "TAC_WORK_RULES.md"
      - "scripts/validate_mother_template.py"
      - ".github/workflows/mother-template-guard.yml"

permissions:
  contents: read

jobs:
  validate-approved-mother-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Positive test - Monday master
        run: python scripts/validate_mother_template.py --date "2026-10-26"
      - name: Positive test - Tuesday-Friday master
        run: python scripts/validate_mother_template.py --date "2026-10-27"
      - name: Negative test - weekend must be rejected
        shell: bash
        run: |
          set +e
          output="$(python scripts/validate_mother_template.py --date "2026-10-24" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "ERROR: weekend date unexpectedly passed validation"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q "是週末；依規則不得自動製作早報"; then
            echo "ERROR: validator failed for an unexpected reason"
            exit 1
          fi
          echo "PASS: weekend date correctly rejected for the expected reason"
      - name: Negative test - tampered manifest SHA must be rejected
        shell: bash
        run: |
          manifest="母版專區/mother-template-manifest.json"
          backup="$(mktemp)"
          cp "$manifest" "$backup"
          restore_manifest() {
            cp "$backup" "$manifest"
            rm -f "$backup"
          }
          trap restore_manifest EXIT
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("母版專區/mother-template-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["templates"]["weekdays"]["blob_sha"] = "0000000000000000000000000000000000000000"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          set +e
          output="$(python scripts/validate_mother_template.py --date "2026-10-27" 2>&1)"
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "ERROR: tampered manifest SHA unexpectedly passed validation"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q "manifest 的 weekdays SHA 不符合硬編碼核准 SHA"; then
            echo "ERROR: validator rejected tampered manifest for an unexpected reason"
            exit 1
          fi
          echo "PASS: tampered manifest SHA correctly rejected"
      - name: Validate requested/current report date
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/validate_mother_template.py --date "$REPORT_DATE"
          else
            report_date="$(TZ=Asia/Taipei date +%F)"
            weekday="$(TZ=Asia/Taipei date +%u)"
            if [ "$weekday" -ge 6 ]; then
              echo "SKIP: today is a Taiwan-time weekend; no automatic report date validation is run."
            else
              python scripts/validate_mother_template.py --date "$report_date"
            fi
          fi
