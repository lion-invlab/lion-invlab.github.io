name: TAC Simulation run failure monitor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tac-simulation-run-monitor.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: tac-simulation-run-monitor
  cancel-in-progress: false

jobs:
  inspect-simulation:
    name: Inspect latest completed Simulation run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Slack secret availability without exposing its value
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL=CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::SLACK_WEBHOOK_URL is unavailable to this workflow."
            echo "SLACK_WEBHOOK_URL=NOT_AVAILABLE_TO_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Find latest completed Simulation run and inspect its jobs
        id: inspect
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'simulation/tac-process-lab-2026-11-06';
            const expectedName = 'TAC isolated simulation lab';
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              per_page: 100
            });
            const runs = data.workflow_runs
              .filter(run => run.name === expectedName &&
                run.head_branch === branch &&
                run.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (runs.length === 0) {
              core.setOutput('alert', 'false');
              core.summary.addHeading('TAC Simulation monitor')
                .addText('No completed Simulation run was found for the monitored branch.')
                .write();
              return;
            }

            // Scan completed runs newest-first and select the newest abnormal run.
            // This prevents a later successful run from hiding an earlier failure
            // between two five-minute monitor polls.
            let selected = null;
            let latestSuccess = null;
            for (const candidate of runs) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidate.id,
                per_page: 100
              });
              const jobCount = jobsData.total_count ?? jobsData.jobs.length;
              const zeroJobs = jobCount === 0;
              const failed = candidate.conclusion !== 'success';
              if (zeroJobs || failed) {
                selected = { run: candidate, jobCount, zeroJobs, failed };
                break;
              }
              if (!latestSuccess) latestSuccess = { run: candidate, jobCount };
            }

            if (!selected) {
              const healthy = latestSuccess;
              core.setOutput('alert', 'false');
              core.summary.addHeading('TAC Simulation monitor')
                .addText('PASS: no abnormal completed run found in the latest ' + runs.length + ' completed runs.')
                .addTable([
                  [{data: 'Field', header: true}, {data: 'Value', header: true}],
                  ['Latest Run ID', String(healthy.run.id)],
                  ['Conclusion', healthy.run.conclusion || 'unknown'],
                  ['Jobs', String(healthy.jobCount)]
                ])
                .addLink('Open latest run', healthy.run.html_url)
                .write();
              return;
            }

            const { run, jobCount, zeroJobs, failed } = selected;
            const shouldAlert = true;
            core.setOutput('run_id', String(run.id));
            core.setOutput('run_url', run.html_url);
            core.setOutput('run_conclusion', run.conclusion || 'unknown');
            core.setOutput('job_count', String(jobCount));
            core.setOutput('alert', 'true');
            core.setOutput('reason', zeroJobs
              ? 'ZERO_JOBS'
              : 'RUN_CONCLUSION_' + String(run.conclusion).toUpperCase());

            core.summary.addHeading('TAC Simulation monitor')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Run ID', String(run.id)],
                ['Branch', run.head_branch],
                ['Conclusion', run.conclusion || 'unknown'],
                ['Jobs', String(jobCount)],
                ['Result', shouldAlert ? 'ALERT' : 'PASS'],
                ['Scan depth', String(runs.length) + ' completed runs']
              ])
              .addLink('Open abnormal run', run.html_url)
              .write();

      - name: Prepare notification state
        if: steps.inspect.outputs.alert == 'true'
        run: mkdir -p .tac-monitor-state && touch .tac-monitor-state/alerted

      - name: Restore notification state
        id: notified
        if: steps.inspect.outputs.alert == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tac-monitor-state
          key: tac-simulation-alerted-${{ steps.inspect.outputs.run_id }}

      - name: Send Slack alert
        id: send
        if: steps.inspect.outputs.alert == 'true' && steps.notified.outputs.cache-hit != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ steps.inspect.outputs.run_url }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
          REASON: ${{ steps.inspect.outputs.reason }}
          JOB_COUNT: ${{ steps.inspect.outputs.job_count }}
          CONCLUSION: ${{ steps.inspect.outputs.run_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::Failure detected, but SLACK_WEBHOOK_URL is unavailable to this workflow."
            echo "delivered=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Slack notification not delivered"
              echo "The monitored Simulation run is abnormal, but the repository secret was not exposed to this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          payload="$(jq -n \
            --arg text ":rotating_light: TAC Simulation 執行異常\\nRun: #${RUN_ID}\\n原因: ${REASON}\\nConclusion: ${CONCLUSION}\\nJobs: ${JOB_COUNT}\\n${RUN_URL}" \
            '{text: $text}')"
          curl --fail --silent --show-error \
            -X POST -H "Content-Type: application/json" \
            --data "$payload" "$SLACK_WEBHOOK_URL"
          echo "delivered=true" >> "$GITHUB_OUTPUT"
          echo "Slack alert delivered for run #${RUN_ID}."

      - name: Save notification state
        if: steps.send.outputs.delivered == 'true'
        uses: actions/cache/save@v4
        with:
          path: .tac-monitor-state
          key: tac-simulation-alerted-${{ steps.inspect.outputs.run_id }}

      - name: Report previously notified run
        if: steps.inspect.outputs.alert == 'true' && steps.notified.outputs.cache-hit == 'true'
        run: echo "This run was already notified; suppressing duplicate Slack alert."
