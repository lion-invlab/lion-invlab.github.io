name: TAC Simulation run failure monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: tac-simulation-run-monitor
  cancel-in-progress: false

jobs:
  inspect-latest-simulation-run:
    name: Inspect latest Simulation run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find latest Simulation run and inspect its jobs
        id: inspect
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'simulation/tac-process-lab-2026-11-06';
            const expectedName = 'TAC isolated simulation lab';
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              per_page: 100
            });
            const runs = data.workflow_runs
              .filter(run => run.name === expectedName && run.head_branch === branch)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (runs.length === 0) {
              core.setOutput('alert', 'false');
              core.summary.addHeading('TAC Simulation monitor')
                .addText('No matching Simulation run was found for the monitored branch.')
                .write();
              return;
            }

            const run = runs[0];
            core.setOutput('run_id', String(run.id));
            core.setOutput('run_url', run.html_url);
            core.setOutput('run_status', run.status);
            core.setOutput('run_conclusion', run.conclusion || 'not-completed');

            if (run.status !== 'completed') {
              core.setOutput('alert', 'false');
              core.summary.addHeading('TAC Simulation monitor')
                .addText('Latest run is still in progress; no failure alert is due.')
                .addLink('Open run', run.html_url)
                .write();
              return;
            }

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const jobCount = jobsData.total_count ?? jobsData.jobs.length;
            const zeroJobs = jobCount === 0;
            const failed = run.conclusion !== 'success';
            const shouldAlert = zeroJobs || failed;

            core.setOutput('job_count', String(jobCount));
            core.setOutput('alert', shouldAlert ? 'true' : 'false');
            core.setOutput('reason', zeroJobs
              ? 'ZERO_JOBS'
              : (failed ? 'RUN_CONCLUSION_' + run.conclusion.toUpperCase() : 'SUCCESS'));

            core.summary.addHeading('TAC Simulation monitor')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Run ID', String(run.id)],
                ['Branch', run.head_branch],
                ['Conclusion', run.conclusion || 'unknown'],
                ['Jobs', String(jobCount)],
                ['Result', shouldAlert ? 'ALERT' : 'PASS']
              ])
              .addLink('Open monitored run', run.html_url)
              .write();

      - name: Prepare de-duplication cache path
        if: steps.inspect.outputs.alert == 'true'
        run: mkdir -p .tac-monitor-state && touch .tac-monitor-state/alerted

      - name: Check whether this run was already notified
        id: notified
        if: steps.inspect.outputs.alert == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tac-monitor-state
          key: tac-simulation-alerted-${{ steps.inspect.outputs.run_id }}

      - name: Send Slack failure alert
        if: steps.inspect.outputs.alert == 'true' && steps.notified.outputs.cache-hit != 'true' && secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ steps.inspect.outputs.run_url }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
          REASON: ${{ steps.inspect.outputs.reason }}
          JOB_COUNT: ${{ steps.inspect.outputs.job_count }}
          CONCLUSION: ${{ steps.inspect.outputs.run_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg text ":rotating_light: TAC Simulation 執行異常\nRun: #${RUN_ID}\n原因: ${REASON}\nConclusion: ${CONCLUSION}\nJobs: ${JOB_COUNT}\n${RUN_URL}" \
            '{text: $text}')"
          curl --fail --silent --show-error \
            -X POST -H "Content-Type: application/json" \
            --data "$payload" "$SLACK_WEBHOOK_URL"
          echo "Slack alert delivered for run #${RUN_ID}."

      - name: Record successful Slack notification to prevent duplicates
        if: steps.inspect.outputs.alert == 'true' && steps.notified.outputs.cache-hit != 'true' && secrets.SLACK_WEBHOOK_URL != ''
        uses: actions/cache/save@v4
        with:
          path: .tac-monitor-state
          key: tac-simulation-alerted-${{ steps.inspect.outputs.run_id }}

      - name: Report notification configuration gap
        if: steps.inspect.outputs.alert == 'true' && secrets.SLACK_WEBHOOK_URL == ''
        run: |
          echo "::warning::Simulation failure detected, but SLACK_WEBHOOK_URL is not configured. Slack notification was not sent."
          {
            echo "### Notification not delivered"
            echo "The monitored Simulation run is abnormal, but repository secret `SLACK_WEBHOOK_URL` is unavailable to this workflow."
            echo "Configure that repository Actions secret to enable automatic Slack delivery."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report already-notified run
        if: steps.inspect.outputs.alert == 'true' && steps.notified.outputs.cache-hit == 'true'
        run: echo "This run was already notified; suppressing duplicate Slack alert."
