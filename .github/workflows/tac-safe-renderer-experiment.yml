name: TAC Safe Renderer Experiment
on:
  push:
    branches:
      - tac-renderer-safe-refactor-20261102
    paths:
      - "scripts/tac_safe_text_patch.py"
      - "scripts/test_tac_safe_text_patch.py"
      - "scripts/render_tac_market_safe.py"
      - "scripts/test_tac_market_safe_renderer.py"
      - "scripts/tac_html_binding_map.json"
      - "scripts/validate_tac_html_binding.py"
      - "scripts/validate_tac_daily_snapshot.py"
      - "scripts/assemble_tac_daily_snapshot.py"
      - "scripts/assemble_tac_calendar_snapshot.py"
      - "scripts/compose_tac_daily_snapshot.py"
      - "scripts/test_compose_tac_daily_snapshot.py"
      - "scripts/import_tac_calendar_capture.py"
      - "scripts/test_tac_calendar_snapshot.py"
      - "scripts/adapt_tac_market_snapshot_for_renderer.py"
      - "scripts/test_tac_market_snapshot_adapter.py"
      - "scripts/run_tac_daily_pipeline.py"
      - "scripts/test_tac_daily_pipeline.py"
      - "scripts/fetch_tac_secondary_market.py"
      - "scripts/capture_tac_market_bundle.py"
      - "scripts/test_tac_market_bundle.py"
      - "scripts/test_tac_secondary_market.py"
      - "scripts/capture_tac_fedwatch_fallback.mjs"
      - "scripts/adapt_tac_fedwatch_capture.py"
      - "scripts/test_tac_fedwatch_capture_adapter.py"
      - "scripts/fetch_tac_global_indices.py"
      - "scripts/fetch_tac_sector_etfs.py"
      - "scripts/fetch_tac_treasury_yields.py"
      - "scripts/fetch_tac_treasury_fred_fallback.py"
      - "scripts/build_tac_visual_fixtures.py"
      - "scripts/test_tac_browser_visual.py"
      - "data/calendar/weeks/*.json"
      - "schemas/tac-daily-market-snapshot.schema.json"
      - "母版專區/TAC_母版_週一_2026-10-28_最終定版.html"
      - "母版專區/TAC_母版_週二至週五_2026-10-28_最終定版.html"
      - ".github/workflows/tac-safe-renderer-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-text-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed text patch unit and mother-template tests
        run: python -m unittest -v scripts/test_tac_safe_text_patch.py
      - name: Run contract-driven market renderer tests
        run: python -m unittest -v scripts/test_tac_market_safe_renderer.py
      - name: Run normalized market display adapter and FedWatch pending-state tests
        run: python -m unittest -v scripts/test_tac_market_snapshot_adapter.py
      - name: Install schema validator and test fail-closed daily report orchestrator
        run: |
          python -m pip install jsonschema
          python scripts/run_tac_daily_pipeline.py --self-test
          python -m unittest -v scripts/test_tac_daily_pipeline.py
      - name: Install Investing.com capture dependencies and test market collectors
        run: |
          python -m pip install requests beautifulsoup4
          python scripts/fetch_tac_global_indices.py --self-test
          python scripts/fetch_tac_sector_etfs.py --self-test
          python scripts/fetch_tac_treasury_yields.py --self-test
          python scripts/fetch_tac_treasury_fred_fallback.py --self-test
          python scripts/fetch_tac_secondary_market.py --self-test
          python -m unittest -v scripts/test_tac_secondary_market.py
          python scripts/capture_tac_market_bundle.py --self-test
          python -m unittest -v scripts/test_tac_market_bundle.py
      - name: Test Investing.com Fed Rate Monitor primary capture and mapping
        run: |
          node scripts/capture_tac_fedwatch_fallback.mjs --self-test
          python -m unittest -v scripts/test_tac_fedwatch_capture_adapter.py
      - name: Run calendar adapter and mother-template integration tests
        run: python -m unittest -v scripts/test_tac_calendar_snapshot.py
      - name: Run market/calendar snapshot composition tests
        run: python -m unittest -v scripts/test_compose_tac_daily_snapshot.py
      - name: Run calendar capture importer self-test
        run: python scripts/import_tac_calendar_capture.py --self-test
      - name: Validate daily snapshot schema and self-tests
        run: |
          python scripts/validate_tac_daily_snapshot.py --self-test
          python scripts/assemble_tac_daily_snapshot.py --self-test
      - name: Verify approved mother-template SHA locks
        run: python scripts/verify_tac_master_templates.py
      - name: Verify snapshot-to-HTML binding contracts
        run: python scripts/validate_tac_html_binding.py

  browser-visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: Render Monday and weekday HTML fixtures
        run: python scripts/build_tac_visual_fixtures.py
      - name: Verify desktop, tablet and 320px mobile layouts
        run: python scripts/test_tac_browser_visual.py
      - name: Set up Node.js for approved-master comparison
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install matching Node Playwright
        run: |
          PLAYWRIGHT_VERSION="$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')"
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install chromium
      - name: Compare both rendered templates with their approved masters
        run: |
          mkdir -p artifacts/tac-visual-regression/review
          cp artifacts/tac-visual-regression/monday.html artifacts/tac-visual-regression/review/2026-11-02-review.html
          cp artifacts/tac-visual-regression/weekday.html artifacts/tac-visual-regression/review/2026-11-03-review.html
          node scripts/tac_browser_layout_regression.mjs --report artifacts/tac-visual-regression/review/2026-11-02-review.html --output artifacts/tac-visual-regression/master-comparison-monday
          node scripts/tac_browser_layout_regression.mjs --report artifacts/tac-visual-regression/review/2026-11-03-review.html --output artifacts/tac-visual-regression/master-comparison-weekday
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tac-browser-visual-regression
          path: artifacts/tac-visual-regression/
          if-no-files-found: warn
          retention-days: 14
