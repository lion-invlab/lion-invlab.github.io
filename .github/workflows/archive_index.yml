name: Archive TAC Morning Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0-4"

permissions:
  contents: write

concurrency:
  group: tac-history-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archive previous TAC report
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          TODAY=$(TZ=Asia/Taipei date +%u)
          if [ "$TODAY" -eq 1 ]; then
            ARCHIVE_DATE=$(TZ=Asia/Taipei date -d "3 days ago" +%Y-%m-%d)
          else
            ARCHIVE_DATE=$(TZ=Asia/Taipei date -d "yesterday" +%Y-%m-%d)
          fi
          echo "Taiwan weekday: $TODAY"
          echo "Archive date: ${ARCHIVE_DATE}"
          export ARCHIVE_DATE
          python - <<'PY'
          import re, os
          from pathlib import Path
          expected = os.environ["ARCHIVE_DATE"]
          html = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r"TAC 投資早報[｜|]\s*(\d{4})/(\d{2})/(\d{2})", html)
          if not m:
              m = re.search(r"(\d{4})/(\d{2})/(\d{2})", html)
          if not m: raise SystemExit("ERROR: Cannot determine report date from index.html")
          actual = f"{m.group(1)}-{m.group(2)}-{m.group(3)}"
          if actual != expected: raise SystemExit(f"ERROR: Homepage report date is {actual}, expected {expected}. Refusing mislabeled archive.")
          print(f"Homepage date verified: {actual}")
          PY
          mkdir -p history
          ARCHIVE_FILE="history/index_${ARCHIVE_DATE}.html"
          cp index.html "$ARCHIVE_FILE"
          test -s "$ARCHIVE_FILE"
          echo "Created: $ARCHIVE_FILE"
          echo "Archive size: $(wc -c < "$ARCHIVE_FILE") bytes"
          python - <<'PY'
          import json, os
          from pathlib import Path
          archive_date = os.environ["ARCHIVE_DATE"]
          history = Path("history")
          index_file = history / "index.json"
          data = json.loads(index_file.read_text(encoding="utf-8")) if index_file.exists() else {"reports":[]}
          reports = set(data.get("reports", [])); reports.add(archive_date)
          valid = []
          for date in reports:
              f = history / f"index_{date}.html"
              if f.is_file() and f.stat().st_size > 0: valid.append(date)
          valid.sort(reverse=True)
          index_file.write_text(json.dumps({"reports":valid}, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          for date in valid:
              f = history / f"index_{date}.html"
              if not f.is_file() or f.stat().st_size == 0: raise SystemExit(f"ERROR: invalid archive for {date}")
          print(json.dumps({"reports":valid}, ensure_ascii=False, indent=2))
          PY

      - name: Verify homepage was not changed
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -z "$(git diff -- index.html)"

      - name: Commit archive only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then echo "No history changes to commit."; exit 0; fi
          git diff --cached --name-status
          git commit -m "Archive TAC report and update history index"
          git push
