實際版型來源：2026/10/23 測試分支內已調整的「index_母版_修正測試_週一.html」。

本檔保留經修正測試版驗收的版面、欄位、互動與樣式；日期相關示範資料僅供參考，產製每日審核版前必須按製作規則全量更新。

<!-- TAC 製作規則層（內部規範，不顯示給讀者）
1. 週別口徑：週一早報回顧上週整體市場與原先判斷，再展望本週；週二至週五只分析上一個實際交易日，不做上週回顧。休市時依最近一個實際交易日判定。
2. 圖釘評論原則：不反覆抄寫漲跌幅，應解釋漲跌原因、後勢情境及投資應對／建議。
3. 資料補齊同步：任何行情或數據修正後，逐一同步相關摘要、觀察、核心觀察、圖釘評論及總結；評論須以最新已核實資料為依據。
4. 新聞規則：全球焦點新聞與市場熱門頭條使用同一台灣時間窗口；依原始發布時間與事件獨立性篩選。不得以頁面更新時間冒充原始發布時間；無法核實者剔除或明確標示待驗收。
5. 審核狀態：每次修改內容或完成驗收，必須同步更新可見審核狀態；已完成項目移出待辦，未完成項目不得標示完成。交付前重新讀取檔案，核對正文、評論、總結與狀態。
6. 發布分層：本檔審核版保留必要的內部驗收提示；正式發布版須在所有相關項目驗收完成後，才移除內部提示。不得只隱藏警示而未完成驗收。
7. 這段規範只記錄在本日審核 HTML 原始碼中；仍須同步至正式週一／週二至週五母版及交接規則檔，才算完成長期制度化。
-->

<script id="tac-layout-hint-v9-script">
document.addEventListener('DOMContentLoaded',function(){
 const header=document.querySelector('header');
 if(!header)return;
 const title=header.querySelector('h1');
 if(!title)return;
 const candidates=[...header.querySelectorAll('*')].filter(el=>{
   if(el.children.length>0)return false;
   const t=(el.textContent||'').trim();
   return t.includes('資料僅供內部教育訓練使用');
 });
 if(!candidates.length)return;
 let warning=candidates[0];
 while(warning.parentElement&&warning.parentElement!==header&&warning.parentElement.children.length===1)warning=warning.parentElement;
 const titleParent=title.parentElement;
 if(!titleParent)return;
 let row=titleParent;
 if(!row.contains(warning)){
   row.style.display='flex';
   row.style.flexWrap='wrap';
   row.style.alignItems='center';
   row.style.columnGap='10px';
   row.style.rowGap='4px';
   row.style.minWidth='0';
   title.style.margin='0';
   warning.style.margin='0 0 0 auto';
   warning.style.flex='0 1 auto';
   warning.style.maxWidth='48%';
   warning.style.fontSize='10px';
   warning.style.lineHeight='1.25';
   warning.style.whiteSpace='normal';
   warning.style.textAlign='right';
   warning.style.boxSizing='border-box';
   row.appendChild(warning);
 }
});
