<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e19">
<title>美股五大指數｜走勢圖</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#101b2b;--line:#26364c;--muted:#91a2ba;--text:#f2f5fa;--active:#e8eef8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center}
h1{font-size:20px;line-height:1.3;margin:0;font-weight:750;letter-spacing:.03em}
.sub{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-top:5px}
main{width:100%;max-width:1500px;margin:0 auto;padding:8px 12px 8px;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.view-tabs{display:flex;gap:8px;padding:2px 1px 9px;flex:0 0 auto}
.view-tab{appearance:none;flex:1;border:1px solid var(--line);background:#111c2c;color:#aebbd0;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.view-tab[aria-selected="true"]{background:#e8eef8;color:#101827;border-color:#e8eef8}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;flex:0 0 auto;border:1px solid var(--line);background:#111c2c;color:#aebbd0;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:650;white-space:nowrap;cursor:pointer}
.tab[aria-pressed="true"]{background:#e8eef8;color:#101827;border-color:#e8eef8}
[hidden]{display:none!important}
.single-view{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.chart-wrap{flex:1;min-height:0;height:auto;max-height:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b111b}
.overview-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;overflow:hidden}
.mini-card{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;background:#0b111b;overflow:hidden}
.mini-title{flex:0 0 auto;padding:5px 7px 2px;font-size:11px;font-weight:700;color:#dce5f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-chart{flex:1;min-height:0;width:100%;height:100%;overflow:hidden}

.mini-card:last-child{grid-column:1 / -1}
#chart,.tradingview-widget-container,.tradingview-widget-container__widget{width:100%;height:100%;min-height:0}
.tradingview-widget-container iframe{width:100%!important;height:100%!important}
footer{font-size:10px;color:#71829a;text-align:center;padding:7px 4px 0;flex:0 0 auto}
@media(min-width:700px){header{padding-top:22px}main{padding:12px 20px 12px}.tab{font-size:14px;padding:11px 20px}.overview-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}.mini-card:last-child{grid-column:auto}.mini-title{font-size:13px;padding:8px 10px 3px}}
@media(max-width:420px){header{padding:calc(7px + env(safe-area-inset-top)) 12px 6px}h1{font-size:18px}.sub{font-size:9px}.view-tab{padding:8px;font-size:12px}.tab{padding:8px 12px;font-size:12px}.tabs{padding-bottom:7px}main{padding:4px 10px calc(5px + env(safe-area-inset-bottom))}footer{display:none}.overview-grid{gap:6px}.mini-title{font-size:10px;padding:4px 5px 1px}}
</style>

</head>
<body>
<header>
  <h1>美股五大指數｜走勢圖</h1>
  <div class="sub">US INDEX CFD &amp; PHLX SEMICONDUCTOR FUTURES</div>
</header>
<main>
  <nav class="view-tabs" aria-label="切換看板">
    <button class="view-tab" type="button" data-view="single" aria-selected="true">單一走勢</button>
    <button class="view-tab" type="button" data-view="overview" aria-selected="false">五大指數總覽</button>
  </nav>
  <section id="singleView" class="single-view">
    <nav class="tabs" aria-label="選擇指數">
      <button class="tab" type="button" data-symbol="OANDA:SPX500USD" aria-pressed="true">S&amp;P 500</button>
      <button class="tab" type="button" data-symbol="OANDA:NAS100USD" aria-pressed="false">Nasdaq 100</button>
      <button class="tab" type="button" data-symbol="OANDA:US30USD" aria-pressed="false">Dow Jones</button>
      <button class="tab" type="button" data-symbol="OANDA:US2000USD" aria-pressed="false">Russell 2000</button>
      <button class="tab" type="button" data-symbol="CME_MINI:SOX1!" aria-pressed="false">費城半導體期貨</button>
    </nav>
    <section class="chart-wrap" aria-label="指數互動走勢圖"><div id="chart"></div></section>
    <footer>前四項為 OANDA 指數 CFD；第五項為 CME E-mini PHLX 半導體指數期貨（SOX1!），期貨價格不等同現貨指數點位。</footer>
  </section>
  <section id="overviewView" class="overview-grid" aria-label="五大指數同步走勢" hidden>
    <article class="mini-card"><div class="mini-title">S&amp;P 500</div><div class="mini-chart"></div></article>
    <article class="mini-card"><div class="mini-title">Nasdaq 100</div><div class="mini-chart"></div></article>
    <article class="mini-card"><div class="mini-title">Dow Jones</div><div class="mini-chart"></div></article>
    <article class="mini-card"><div class="mini-title">Russell 2000</div><div class="mini-chart"></div></article>
    <article class="mini-card"><div class="mini-title">費城半導體期貨</div><div class="mini-chart"></div></article>
  </section>
</main>
<script>
(function(){
  const chart=document.getElementById('chart');
  const buttons=[...document.querySelectorAll('.tab')];
  const viewButtons=[...document.querySelectorAll('.view-tab')];
  const singleView=document.getElementById('singleView');
  const overviewView=document.getElementById('overviewView');
  let activeSymbol='OANDA:SPX500USD';
  let activeView='single';
  function loadChart(symbol){
    activeSymbol=symbol;
    buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.symbol===symbol)));
    chart.replaceChildren();
    const container=document.createElement('div');
    container.className='tradingview-widget-container';
    const widget=document.createElement('div');
    widget.className='tradingview-widget-container__widget';
    container.appendChild(widget);
    const script=document.createElement('script');
    script.type='text/javascript';
    script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    script.async=true;
    script.textContent=JSON.stringify({autosize:false,width:'100%',height:Math.max(240,Math.floor(chart.clientHeight)),symbol:symbol,interval:'5',timezone:'Asia/Taipei',theme:'dark',style:'1',locale:'zh_TW',allow_symbol_change:false,calendar:false,hide_side_toolbar:false,withdateranges:true,details:false,hotlist:false,show_popup_button:false,support_host:'https://www.tradingview.com'});
    container.appendChild(script);
    chart.appendChild(container);
  }
  let overviewRendered=false;
  function renderOverview(){
    if(overviewRendered) return;
    const cards=[...overviewView.querySelectorAll('.mini-card')];
    const symbols=['OANDA:SPX500USD','OANDA:NAS100USD','OANDA:US30USD','OANDA:US2000USD','CME_MINI:SOX1!'];
    cards.forEach((card,index)=>{
      const host=card.querySelector('.mini-chart');
      const container=document.createElement('div');
      container.className='tradingview-widget-container';
      container.style.cssText='width:100%;height:100%';
      const widget=document.createElement('div');
      widget.className='tradingview-widget-container__widget';
      widget.style.cssText='width:100%;height:100%';
      container.appendChild(widget);
      const script=document.createElement('script');
      script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
      script.async=true;
      script.textContent=JSON.stringify({autosize:true,symbol:symbols[index],interval:'60',timezone:'Asia/Taipei',theme:'dark',style:'1',locale:'zh_TW',allow_symbol_change:false,calendar:false,hide_top_toolbar:true,hide_side_toolbar:true,hide_legend:true,save_image:false,withdateranges:false,details:false,hotlist:false,show_popup_button:false,support_host:'https://www.tradingview.com'});
      container.appendChild(script);
      host.replaceChildren(container);
    });
    overviewRendered=true;
  }
  function setView(view){
    activeView=view;
    singleView.hidden=view!=='single';
    overviewView.hidden=view!=='overview';
    viewButtons.forEach(button=>button.setAttribute('aria-selected',String(button.dataset.view===view)));
    if(view==='single') requestAnimationFrame(()=>loadChart(activeSymbol));
    else requestAnimationFrame(renderOverview);
  }
  buttons.forEach(button=>button.addEventListener('click',()=>loadChart(button.dataset.symbol)));
  viewButtons.forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
  loadChart(activeSymbol);
  let resizeTimer;
  window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(activeView==='single')loadChart(activeSymbol)},180)});
})();
</script>
</body>
</html>
