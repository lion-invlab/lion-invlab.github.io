<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q4 精選基金｜複選測試｜TAC 投資早報</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#17191d;--muted:#737981;--line:#e1e4e8;--red:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.top{background:#fff;border-bottom:1px solid var(--line);padding:18px 16px}.logo{font-size:27px;font-weight:950}.logo i{font-style:normal;color:var(--red)}
.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 2px #00000008}
.title{font-size:18px;font-weight:950;margin-bottom:14px}.label{font-size:12px;color:var(--muted);font-weight:850;margin-bottom:7px}
.selectbox{width:100%;min-height:48px;border:2px solid #75bdf3;border-radius:9px;background:#fff;padding:12px 42px 12px 14px;font-size:15px;font-weight:800;position:relative;cursor:pointer}.selectbox:after{content:"⌄";position:absolute;right:14px;top:8px;font-size:24px}
.summary{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.6}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;background:#fafafa}
.modal{display:none;position:fixed;inset:0;background:#0004;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
.panel{width:min(560px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 20px 60px #0003;padding:18px}
.panel-head{position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}
.all{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:900;padding:10px 4px;cursor:pointer}.all input{width:22px;height:22px;accent-color:var(--red)}.count{font-size:12px;color:var(--muted);margin-left:auto;font-weight:750}
.option{display:flex;align-items:flex-start;gap:12px;padding:14px 6px;border-bottom:1px solid #eee;cursor:pointer;font-size:17px;line-height:1.35}.option input{width:22px;height:22px;flex:0 0 22px;margin:2px 0 0;accent-color:var(--red)}
.actions{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:12px;border-top:1px solid var(--line);margin-top:5px}button{height:42px;border:0;border-radius:8px;padding:0 18px;font-weight:900;cursor:pointer}.cancel{background:#eee}.confirm{background:var(--red);color:#fff;flex:1}
@media(max-width:650px){.panel{border-radius:24px;padding:15px;max-height:84vh}.option{font-size:16px;padding:13px 4px}.all{font-size:17px}}
</style></head><body>
<header class="top"><div class="logo"><i>TAC</i> 投資早報</div></header>
<main class="wrap"><section class="card">
<div class="title">精選基金代號&amp;配息速查｜複選測試</div>
<div class="label">選擇主基金</div>
<div id="selectBox" class="selectbox" role="button" tabindex="0">請選擇 15 檔主基金</div>
<div id="summary" class="summary">可複選多檔基金。</div><div id="chips" class="chips"></div>
</section></main>
<div id="modal" class="modal">
<div class="panel"><div class="panel-head"><div id="allRow" class="all"><input id="allBox" type="checkbox"><span>全選／取消全選</span><span id="count" class="count">已選 0／15 檔</span></div></div>
<div id="options"></div><div class="actions"><button class="cancel" id="cancelBtn">取消</button><button class="confirm" id="confirmBtn">確認選擇</button></div></div></div>
<script>
const funds=["施羅德環球收息債券基金","PIMCO 多元收益債券基金","摩根多重收益基金","滙豐超核心多重資產基金","PIMCO 收益增長基金","施羅德環球收益成長基金","貝萊德全球智慧數據股票入息基金（複雜型）","安聯AI人工智慧基金","滙豐全球基礎建設收益基金","安聯台灣科技基金","施羅德環球基金系列－環球永續增長","施羅德環球黃金","摩根日本基金","聯博美國成長股票基金","安聯全球多元投資風格股票基金"];
let selected=new Set(),pending=new Set();
const $=id=>document.getElementById(id);
function renderOptions(){ $("options").innerHTML=funds.map((n,i)=>'<label class="option"><input type="checkbox" data-i="'+i+'"><span>'+n+'</span></label>').join(""); $("options").querySelectorAll("input").forEach(x=>x.checked=pending.has(+x.dataset.i)); sync(); }
function sync(){pending=new Set([...document.querySelectorAll("#options input:checked")].map(x=>+x.dataset.i));$("allBox").checked=pending.size===funds.length;$("count").textContent="已選 "+pending.size+"／15 檔";}
function openModal(){pending=new Set(selected);renderOptions();$("modal").classList.add("show");document.body.style.overflow="hidden";}
function closeModal(){ $("modal").classList.remove("show");document.body.style.overflow=""; }
$("selectBox").addEventListener("click",openModal);$("selectBox").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")openModal()});
$("options").addEventListener("change",sync);
$("allRow").addEventListener("click",()=>{const all=pending.size===funds.length;document.querySelectorAll("#options input").forEach(x=>x.checked=!all);sync();});
$("cancelBtn").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});
$("confirmBtn").addEventListener("click",()=>{selected=new Set(pending);const names=[...selected].map(i=>funds[i]);$("selectBox").textContent=selected.size?"已選 "+selected.size+"／15 檔基金":"請選擇 15 檔主基金";$("summary").textContent=selected.size?"目前已選："+names.join("、"):"可複選多檔基金。";$("chips").innerHTML=names.map(n=>'<span class="chip">'+n+"</span>").join("");closeModal();});
</script></body></html>
